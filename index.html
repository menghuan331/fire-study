  document.getElementById("practice-back").addEventListener("click", () => {
    app.ui.practiceView = "list";
    app.ui.practiceChoice = "";
    render();
  });

  const nextBtn = document.getElementById("practice-next");
  if (nextBtn && nextQ) {
    nextBtn.addEventListener("click", () => {
      app.ui.practiceQid = nextQ.id;
      app.ui.practiceChoice = "";
      app.ui.practiceView = "question";
      render();
    });
  }

  root.querySelectorAll("[data-choice]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.choice;
      if (isMultiSelect(current.type)) {
        const set = new Set(app.ui.practiceChoice.split("").filter(Boolean));
        if (set.has(key)) set.delete(key); else set.add(key);
        app.ui.practiceChoice = [...set].sort().join("");
        render();
      } else {
        app.ui.practiceChoice = "";
        submitAnswer(current, key);
      }
    });
  });

  const submitBtn = document.getElementById("practice-submit");
  if (submitBtn) {
    submitBtn.addEventListener("click", () => {
      if (!app.ui.practiceChoice) return;
      const choice = app.ui.practiceChoice;
      app.ui.practiceChoice = "";
      submitAnswer(current, choice);
    });
  }

  root.querySelectorAll("[data-err]").forEach((btn) => {
    btn.addEventListener("click", () => setPracticeErr(current.id, btn.dataset.err));
  });

  const noteEl = document.getElementById("practice-note");
  const saveNoteDebounced = () => {
    clearTimeout(app.ui.noteTimer);
    app.ui.noteTimer = setTimeout(() => {
      savePracticeNote(current.id, noteEl.value.trim());
    }, 1500);
  };
  noteEl.addEventListener("input", saveNoteDebounced);
  noteEl.addEventListener("blur", () => savePracticeNote(current.id, noteEl.value.trim()));
}

function reviewCardContent(card) {
  if (card.src === "wrong") {
    const q = app.derived.questionById.get(card.qid);
    if (!q) return { front: "原题已不存在", back: "请删除这张卡", anchor: "-" };
    const options = q.options ? Object.entries(q.options).map(([k, v]) => `${k}. ${v}`).join("\n") : "";
    const verify = q.verify || {};
    const answerLine = String(q.answer || "").trim() ? `正确答案：${q.answer}` : "答案存疑，见说明";
    const backParts = [answerLine];
    if (verify.note) backParts.push(verify.note);
    if (verify.excerpt) backParts.push(verify.excerpt);
    return {
      front: `${q.stem || "（无题干）"}\n${options}`,
      back: backParts.join("\n"),
      anchor: verify.anchor || q.anchor || "-"
    };
  }
  const base = app.derived.cardById.get(card.id);
  if (!base) return { front: "骨架卡数据缺失", back: "请检查 data/cards.json", anchor: "-" };
  return {
    front: base.q,
    back: base.a,
    anchor: base.anchor || "-"
  };
}

function renderReview(today) {
  const root = document.getElementById("page-review");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  const queue = getReviewQueue(today);
  if (app.ui.reviewIndex >= queue.length) app.ui.reviewIndex = Math.max(0, queue.length - 1);
  if (!queue.length) {
    root.innerHTML = `
      <h1 class="h1">复习</h1>
      <section class="panel">
        <div class="empty">
          <p>今天队列已完成。</p>
          <p class="small">明天到期：${getTomorrowDueCount(today)} 张。</p>
        </div>
      </section>
    `;
    return;
  }
  const card = queue[app.ui.reviewIndex];
  const content = reviewCardContent(card);
  root.innerHTML = `
    <h1 class="h1">复习</h1>
    <section class="panel">
      <p class="small mono">第 ${app.ui.reviewIndex + 1} / ${queue.length} 张（最多 60）</p>
      <article class="review-card">
        <p>${content.front.replace(/\n/g, "<br>")}</p>
        ${app.ui.reviewShowAnswer ? `<section class="panel"><p>${content.back.replace(/\n/g, "<br>")}</p><p class="small mono">${content.anchor}</p>${anchorPrintedHtml(content.anchor)}</section>` : ""}
        <div class="button-row">
          <button id="review-show-answer" class="btn btn-secondary tap-target">${app.ui.reviewShowAnswer ? "收起答案" : "看答案"}</button>
        </div>
      </article>
      ${app.ui.reviewShowAnswer ? `
      <div class="button-row" style="margin-top:8px;">
        <button id="review-remember" class="btn btn-ok tap-target">记住了</button>
        <button id="review-forget" class="btn btn-bad tap-target">没记住</button>
      </div>` : ""}
    </section>
  `;

  document.getElementById("review-show-answer").addEventListener("click", () => {
    app.ui.reviewShowAnswer = !app.ui.reviewShowAnswer;
    render();
  });

  const remBtn = document.getElementById("review-remember");
  const forgetBtn = document.getElementById("review-forget");
  if (remBtn && forgetBtn) {
    remBtn.addEventListener("click", () => {
      let next = nextCardRemember(card, today);
      if (shouldClearWrongCard(next, today)) {
        next = { ...next, cleared: true, clearedAt: today };
      }
      app.sync.sessionReviews += 1;
      store.save(`cards/${card.id}`, next);
      app.ui.reviewIndex += 1;
      app.ui.reviewShowAnswer = false;
    });
    forgetBtn.addEventListener("click", () => {
      const next = nextCardForget(card, today);
      app.sync.sessionReviews += 1;
      store.save(`cards/${card.id}`, next);
      app.ui.reviewIndex += 1;
      app.ui.reviewShowAnswer = false;
    });
  }
}

function renderMap() {
  const root = document.getElementById("page-map");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  const rows = app.data.map.rows;
  const total = rows.length;
  const count0 = rows.filter((r) => getSectionStatus(r.id) === 0).length;
  const count1 = rows.filter((r) => getSectionStatus(r.id) === 1).length;
  const count2 = rows.filter((r) => getSectionStatus(r.id) === 2).length;
  const count3 = rows.filter((r) => getSectionStatus(r.id) === 3).length;
  const missing = rows.filter((r) => !r.unit);
  root.innerHTML = `
    <h1 class="h1">地图</h1>
    <section class="panel">
      <div class="map-toolbar">
        <button id="map-view-unit" class="btn ${app.ui.mapView === "unit" ? "btn-primary" : "btn-secondary"} tap-target">按单元</button>
        <button id="map-view-book" class="btn ${app.ui.mapView === "book" ? "btn-primary" : "btn-secondary"} tap-target">按书</button>
      </div>
      <p class="small">总行数 ${total}；未学 ${count0} / 学过 ${count1} / 做过题 ${count2} / 达标 ${count3}</p>
      ${missing.length === 0 ? `<p class="small">没有遗漏：${total} 行全部有归属</p>` : `<p class="small danger">缺少 unit 归属：${missing.map((m) => m.id).join("，")}</p>`}
    </section>
    <section id="map-groups" class="panel"></section>
  `;

  document.getElementById("map-view-unit").addEventListener("click", () => {
    app.ui.mapView = "unit";
    render();
  });
  document.getElementById("map-view-book").addEventListener("click", () => {
    app.ui.mapView = "book";
    render();
  });

  const groups = document.getElementById("map-groups");
  if (app.ui.mapView === "unit") {
    groups.innerHTML = app.data.schedule.units.filter((u) => u.id !== "CASE").map((u) => {
      const rowsForUnit = app.derived.unitRows.get(u.id) || [];
      const prog = unitProgress(u.id);
      const segs = statusSegments(rowsForUnit);
      const isOpen = app.ui.openUnits.has(u.id);
      return `
        <section class="group">
          <button class="group-head tap-target" data-open-unit="${u.id}">
            <strong>${u.id} · ${u.name}</strong>
            <span class="small">第 ${u.week_from || "-"}~${u.week_to || "-"} 周 · ${prog.done}/${prog.total}</span>
            <span class="segbar" aria-hidden="true">
              <span class="seg-0" style="width:${segs[0]}%"></span>
              <span class="seg-1" style="width:${segs[1]}%"></span>
              <span class="seg-2" style="width:${segs[2]}%"></span>
              <span class="seg-3" style="width:${segs[3]}%"></span>
            </span>
          </button>
          ${isOpen ? `<ul class="row-list">${rowsForUnit.map(renderMapRow).join("")}</ul>` : ""}
        </section>
      `;
    }).join("");
  } else {
    const byBook = new Map();
    for (const row of rows) {
      if (!byBook.has(row.book)) byBook.set(row.book, []);
      byBook.get(row.book).push(row);
    }
    groups.innerHTML = [...byBook.entries()].map(([book, list]) => {
      const isOpen = app.ui.openBooks.has(book);
      return `
        <section class="group">
          <button class="group-head tap-target" data-open-book="${book}">
            <strong>${bookName(book)}</strong>
            <span class="small">${list.length} 行</span>
          </button>
          ${isOpen ? `<ul class="row-list">${list.map(renderMapRow).join("")}</ul>` : ""}
        </section>
      `;
    }).join("");
  }

  groups.querySelectorAll("[data-open-unit]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.openUnit;
      if (app.ui.openUnits.has(id)) app.ui.openUnits.delete(id); else app.ui.openUnits.add(id);
      render();
    });
  });
  groups.querySelectorAll("[data-open-book]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.openBook;
      if (app.ui.openBooks.has(id)) app.ui.openBooks.delete(id); else app.ui.openBooks.add(id);
      render();
    });
  });
  groups.querySelectorAll("[data-row-lamp]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const rowId = btn.dataset.rowLamp;
      const next = (getSectionStatus(rowId) + 1) % 4;
      setSectionStatus(rowId, next);
      ensureSkeletonActivation(shanghaiToday());
    });
  });
}

function statusSegments(rows) {
  const counts = [0, 0, 0, 0];
  for (const row of rows) {
    const status = getSectionStatus(row.id);
    if (status >= 0 && status <= 3) counts[status] += 1;
  }
  const total = rows.length || 1;
  return counts.map((count) => (count / total) * 100);
}

function renderMapRow(row) {
  const status = getSectionStatus(row.id);
  const sectionName = row.section ? `§${row.section}` : "导言";
  const chapter = row.chapter_title || row.part_title || "";
  return `
    <li>
      <button type="button" class="map-row" data-row-lamp="${row.id}">
        <span class="lamp lamp-${status}" aria-hidden="true"></span>
        <span class="tag">${row.subject}</span>
        <span class="map-row-main">${chapter} · ${sectionName} · ${row.title}</span>
        <span class="map-row-page mono">印刷页 ${row.printed_start}</span>
      </button>
    </li>
  `;
}

function renderWeek(today, weekCtx) {
  const root = document.getElementById("page-week");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  if (!weekCtx.week) {
    root.innerHTML = `<h1 class="h1">本周</h1><p class="small">当前没有可复盘的一周。</p>`;
    return;
  }
  const week = weekCtx.week;
  const units = week.units || [];
  const weekQuestions = app.data.questions.questions.filter((q) => units.includes(q.unit) && q.verify?.status !== "doubt");
  const attemptedQids = new Set();
  let totalTries = 0;
  let correctTries = 0;
  const wrongFirstWeek = new Set();

  for (const q of weekQuestions) {
    const tries = getAttempt(q.id).tries || [];
    let hadWrongBefore = false;
    for (const tr of tries) {
      if (!tr.ok) {
        const day = String(tr.at).slice(0, 10);
        if (day < week.start) hadWrongBefore = true;
      }
    }
    for (const tr of tries) {
      if (tryInRange(tr, week.start, week.end)) {
        attemptedQids.add(q.id);
        totalTries += 1;
        if (tr.ok) correctTries += 1;
        if (!tr.ok && !hadWrongBefore) wrongFirstWeek.add(q.id);
      }
    }
  }

  const clearedCount = Object.values(app.state.cards).filter((card) => card.src === "wrong" && card.cleared && card.clearedAt && card.clearedAt >= week.start && card.clearedAt <= week.end).length;
  const backlog = Object.values(app.state.cards).filter((card) => card.src === "wrong" && !card.cleared).length;
  const rate = totalTries ? Math.round((correctTries / totalTries) * 100) : 0;
  const weekDoc = app.state.weeks[week.start] || { good: "", bad: "", next: "" };

  root.innerHTML = `
    <h1 class="h1">本周</h1>
    <section class="panel">
      <p>${Number.isInteger(week.index) ? `第 ${week.index} 周` : "当前周"} · ${formatUnitNames(units)}</p>
      <p class="small">做了 ${attemptedQids.size} 题，正确率 ${rate}% ，新增错题 ${wrongFirstWeek.size} ，清掉错题 ${clearedCount} ，错题积压 ${backlog}</p>
    </section>
    <section class="panel">
      <label for="week-good" class="label">这周什么管用</label>
      <textarea id="week-good" class="textarea">${weekDoc.good || ""}</textarea>
      <label for="week-bad" class="label">这周什么不管用</label>
      <textarea id="week-bad" class="textarea">${weekDoc.bad || ""}</textarea>
      <label for="week-next" class="label">下周改什么</label>
      <textarea id="week-next" class="textarea">${weekDoc.next || ""}</textarea>
      <p class="small">自动保存。</p>
      <div class="button-row">
        <button id="week-submit" class="btn ${weekDoc.submittedAt ? "btn-secondary" : "btn-primary"} tap-target" ${weekDoc.submittedAt ? "disabled" : ""}>交作业</button>
      </div>
      <p class="small">${weekDoc.submittedAt ? `已交：${weekDoc.submittedAt}` : "未交"}。周日交，Claude 会来验收。</p>
    </section>
  `;

  const saveWeekDebounced = () => {
    clearTimeout(app.ui.weekTimer);
    app.ui.weekTimer = setTimeout(() => {
      const next = {
        ...(app.state.weeks[week.start] || {}),
        good: document.getElementById("week-good").value.trim(),
        bad: document.getElementById("week-bad").value.trim(),
        next: document.getElementById("week-next").value.trim()
      };
      store.save(`weeks/${week.start}`, next);
    }, 900);
  };

  ["week-good", "week-bad", "week-next"].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener("input", saveWeekDebounced);
    el.addEventListener("blur", () => {
      const next = {
        ...(app.state.weeks[week.start] || {}),
        good: document.getElementById("week-good").value.trim(),
        bad: document.getElementById("week-bad").value.trim(),
        next: document.getElementById("week-next").value.trim()
      };
      store.save(`weeks/${week.start}`, next);
    });
  });

  const submitBtn = document.getElementById("week-submit");
  submitBtn.addEventListener("click", () => {
    const todayStamp = shanghaiToday();
    const next = {
      ...(app.state.weeks[week.start] || {}),
      good: document.getElementById("week-good").value.trim(),
      bad: document.getElementById("week-bad").value.trim(),
      next: document.getElementById("week-next").value.trim(),
      submittedAt: `${todayStamp} 23:59`
    };
    store.save(`weeks/${week.start}`, next);
    requestPush("submit");
  });
}

function renderPlan(today, weekCtx) {
  const root = document.getElementById("page-plan");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  const rows = app.data.schedule.weeks.map((w) => {
    const names = formatUnitNames(w.units || []);
    const caseTitle = w.case ? app.derived.rowById.get(w.case)?.title || w.case : "";
    const isCurrent = weekCtx.week?.start === w.start;
    const isPast = today > w.end;
    let progressText = "";
    if (isPast && w.units && w.units.length) {
      const allRows = w.units.flatMap((u) => app.derived.unitRows.get(u) || []);
      const done = allRows.filter((r) => getSectionStatus(r.id) >= 1).length;
      progressText = `${done}/${allRows.length} 节`;
    }
    const weekName = w.kind === "buffer" ? "机动周" : `第 ${w.index} 周`;
    return `
      <div class="week-row ${isCurrent ? "current" : ""} ${w.kind === "buffer" ? "buffer" : ""}">
        <div class="week-dates"><span class="mono">${w.start} ~ ${w.end}</span> <span class="small">${weekName}</span></div>
        <div class="week-unit">${names || w.note || "复习 / 清错题"}${progressText ? ` <span class="small mono">${progressText}</span>` : ""}</div>
        <div class="week-case">${caseTitle || "—"}</div>
      </div>
    `;
  }).join("");
  root.innerHTML = `
    <h1 class="h1">排程</h1>
    <section class="panel">
      <div class="timeline">${rows}</div>
    </section>
    <section class="panel">
      <p><strong>强化期（2027-06～08）</strong>：专题刷题、易混数值反复背，案例每周 2～3 道且必须动笔写。</p>
      <p><strong>冲刺期（2027-09～11）</strong>：每 1～2 周一套三科计时模拟，清错题，只复习薄弱卡。</p>
    </section>
  `;
}

function renderNav() {
  const tab = app.ui.tab;
  document.querySelectorAll("[data-tab-link]").forEach((link) => {
    const on = link.dataset.tabLink === tab;
    link.classList.toggle("active", on);
  });
}

function renderPages() {
  const tab = app.ui.tab;
  VALID_TABS.forEach((name) => {
    const el = document.getElementById(`page-${name}`);
    if (el) el.hidden = tab !== name;
  });
}

function render() {
  app.ui.tab = sanitizeTab(location.hash);
  renderPages();
  renderNav();
  renderSettings();
  const today = shanghaiToday();
  if (!app.data) {
    document.getElementById("status-center").textContent = "加载中";
    const countdown = document.getElementById("exam-countdown");
    if (countdown) countdown.innerHTML = `距考试 <span class="mono">--</span> 天`;
    renderSyncStatus();
    renderToday(today, { phase: "pre", week: null, weekLabel: "加载中", units: [] });
    return;
  }
  const weekCtx = getWeekContext(today);
  renderStatusBar(today, weekCtx);
  renderToday(today, weekCtx);
  renderPractice(today, weekCtx);
  renderReview(today);
  renderMap();
  renderWeek(today, weekCtx);
  renderPlan(today, weekCtx);
}

function wireRouting() {
  window.addEventListener("hashchange", () => {
    const key = (location.hash || "").replace(/^#/, "");
    if (!VALID_TABS.includes(key)) {
      location.hash = "#today";
      return;
    }
    app.ui.tab = key;
    render();
  });
  const syncStatus = document.getElementById("sync-status");
  if (syncStatus) {
    syncStatus.addEventListener("click", () => {
      if ((location.hash || "") !== "#settings") location.hash = "#settings";
      else render();
    });
  }
  document.addEventListener("visibilitychange", () => {
    if (!hasToken()) return;
    if (document.visibilityState === "hidden") {
      if (app.sync.dirty || app.sync.phase === "dirty" || app.sync.phase === "error") requestPush("background");
    } else {
      requestPull();
    }
  });
}

async function boot() {
  app.githubConfig = loadGithubConfig();
  loadSyncMeta();
  loadStateFromLocal();
  app.sync.phase = hasToken() ? "syncing" : "disconnected";
  if (!location.hash || !VALID_TABS.includes(location.hash.slice(1))) {
    location.hash = "#today";
  }
  app.ui.tab = sanitizeTab(location.hash);
  wireRouting();
  onChange(() => render());
  render();

  try {
    const [map, schedule, cards, questions] = await Promise.all([
      fetchJson("data/map.json", "data/map.json"),
      fetchJson("data/schedule.json", "data/schedule.json"),
      fetchJson("data/cards.json", "data/cards.json"),
      fetchJson("data/questions.json", "data/questions.json")
    ]);
    app.data = { map, schedule, cards, questions };
    buildIndexes();
    ensureSkeletonActivation(shanghaiToday());
    render();
  } catch (err) {
    app.error = err.message || "读不到数据文件，请让 Claude 重新发布";
    render();
  }

  registerServiceWorker();
  initialSync();
}

boot();
</script>
