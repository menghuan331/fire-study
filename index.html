function kaokaoSummary(meta) {
  const items = kaokaoItemsForChunk(meta);
  if (!items.length) return "";
  let correct = 0;
  let skipped = 0;
  for (const item of items) {
    const tryItem = latestKaokaoTry(item.id, "recog");
    if (!tryItem) skipped += 1;
    else if (tryItem.ok) correct += 1;
  }
  const whys = whyItemsForChunk(meta);
  let thought = 0;
  for (const item of whys) {
    const tryItem = latestKaokaoTry(item.id, "why");
    if (tryItem && tryItem.ok) thought += 1;
  }
  const retell = app.state.kaokaoRetell && app.state.kaokaoRetell[meta.id];
  const said = retell && String(retell.text || "").trim() ? "已复述" : "未复述";
  const whyPart = whys.length ? ` · 为什么 ${thought}/${whys.length} 想到了` : "";
  return `小测 ${correct}/${items.length} 对（跳过 ${skipped}）${whyPart} · ${said}`;
}

function kaokaoPoolNote(meta) {
  const left = allKaokaoItemsForChunk(meta).length - kaokaoItemsForChunk(meta).length;
  if (left <= 0) return "";
  return `另有 ${left} 条学完后进复习，每天最多 ${POOL_DAILY_LIMIT} 条`;
}

function clozeHtml(text) {
  return escapeHtml(text).replace(/_{3,}/g, '<span class="cloze-blank" aria-label="填空">　　</span>');
}

function fillCloze(text, answers) {
  let index = 0;
  const list = Array.isArray(answers) ? answers : [];
  return String(text || "").replace(/_{3,}/g, () => {
    const value = list[index] != null ? String(list[index]) : "";
    index += 1;
    return value;
  });
}

function openItemSource(meta, item) {
  if (!item) return;
  app.ui.kaokaoFocus = {
    chunkId: meta.id,
    blockId: anchorBlockId(item.anchor),
    src: item.src || ""
  };
  writeLearnMemory(meta.id, "read");
  render();
}

function applyKaokaoFocus(meta) {
  const focus = app.ui.kaokaoFocus;
  if (!focus || focus.chunkId !== meta.id) return;
  const block = document.getElementById(`block-${focus.blockId}`);
  if (!block) return;
  highlightBlock(block, focus.src);
  app.ui.kaokaoFocus = null;
}

function wireKaokao(meta) {
  const root = document.getElementById("page-learn");
  if (!root) return;
  root.querySelectorAll("[data-kk-choice]").forEach((button) => {
    button.addEventListener("click", () => {
      if (button.disabled) return;
      answerQuiz(meta, button.dataset.kkKey, button.dataset.kkItem, Number(button.dataset.kkChoice));
    });
  });
  root.querySelectorAll("[data-kk-next]").forEach((button) => {
    button.addEventListener("click", () => advanceQuiz(meta, button.dataset.kkNext));
  });
  root.querySelectorAll("[data-kk-src]").forEach((button) => {
    button.addEventListener("click", () => {
      const item = kaokaoItemsForChunk(meta).find((entry) => entry.id === button.dataset.kkSrc);
      if (!item) return;
      highlightBlock(document.getElementById(`block-${anchorBlockId(item.anchor)}`), item.src);
    });
  });
  root.querySelectorAll("[data-kk-open]").forEach((button) => {
    button.addEventListener("click", () => {
      const key = button.dataset.kkOpen;
      const card = plannedQuizCard(meta, key);
      if (!app.ui.quizCollapsed) app.ui.quizCollapsed = {};
      if (!app.ui.quizReview) app.ui.quizReview = {};
      if (!app.ui.quizCursor) app.ui.quizCursor = {};
      const items = card && card.items ? card.items : [];
      const allDone = items.length > 0 && items.every((item) => latestKaokaoTry(item.id, "recog"));
      app.ui.quizCollapsed[key] = false;
      app.ui.quizReview[key] = allDone;
      if (!allDone) {
        const cursorId = app.ui.quizCursor[key];
        const current = items.find((item) => item.id === cursorId);
        if (!current || latestKaokaoTry(current.id, "recog")) {
          const next = items.find((item) => !latestKaokaoTry(item.id, "recog"));
          if (next) app.ui.quizCursor[key] = next.id;
        }
      }
      render();
    });
  });
  root.querySelectorAll("[data-kk-collapse]").forEach((button) => {
    button.addEventListener("click", () => {
      const key = button.dataset.kkCollapse;
      if (!app.ui.quizCollapsed) app.ui.quizCollapsed = {};
      if (!app.ui.quizReview) app.ui.quizReview = {};
      app.ui.quizReview[key] = false;
      app.ui.quizCollapsed[key] = true;
      render();
    });
  });
  const whyShow = document.getElementById("why-show");
  if (whyShow) whyShow.addEventListener("click", () => { app.ui.learnWhyReveal = true; render(); });
  const whyGot = document.getElementById("why-got");
  if (whyGot) whyGot.addEventListener("click", () => answerWhy(meta, true));
  const whyMiss = document.getElementById("why-miss");
  if (whyMiss) whyMiss.addEventListener("click", () => answerWhy(meta, false));
  const whyNext = document.getElementById("why-next");
  if (whyNext) whyNext.addEventListener("click", () => {
    app.ui.learnWhy = (app.ui.learnWhy || 0) + 1;
    app.ui.learnWhyReveal = false;
    render();
  });
  const whySrc = document.getElementById("why-src");
  if (whySrc) whySrc.addEventListener("click", () => {
    const items = whyItemsForChunk(meta);
    const index = Math.min(Math.max(app.ui.learnWhy || 0, 0), Math.max(0, items.length - 1));
    openItemSource(meta, items[index]);
  });
  const retell = document.getElementById("learn-retell");
  if (!retell) return;
  const saveNow = () => saveKaokaoRetell(meta.id, retell.value, meta.unit, { silent: true });
  retell.addEventListener("input", () => {
    clearTimeout(app.ui.retellTimer);
    app.ui.retellTimer = setTimeout(saveNow, 1500);
  });
  retell.addEventListener("blur", () => {
    const text = retell.value;
    clearTimeout(app.ui.retellTimer);
    app.ui.retellTimer = setTimeout(() => {
      saveKaokaoRetell(meta.id, text, meta.unit, { silent: true });
    }, 0);
  });
}

function stripHashes(md) {
  return String(md || "").replace(/^#{1,6}\s*/, "");
}

function doubtPanelHtml(meta, block) {
  const id = doubtKey(meta.id, block.id);
  const rec = activeDoubt(meta.id, block.id);
  if (!rec) return "";
  const showCancel = app.ui.doubtCancel === id;
  if (qaApi) {
    return `<div class="doubt-box">
      ${showCancel ? `<button type="button" class="btn btn-secondary tap-target" data-doubt-cancel="${escapeHtml(id)}">取消标记</button>` : ""}
      <label class="small" for="doubt-note-${escapeHtml(String(block.id))}">阅读备注（可选）</label>
      <input id="doubt-note-${escapeHtml(String(block.id))}" class="doubt-input" data-doubt-note="${escapeHtml(String(block.id))}" type="text" value="${escapeHtml(rec.note || "")}" placeholder="保留你的阅读备注">
      <div id="doubt-answer-${escapeHtml(String(block.id))}" data-qa-block="${escapeHtml(String(block.id))}"></div>
    </div>`;
  }
  let answerHtml = "";
  if (rec.answer) {
    const text = limitSentences(rec.answer.text || "", 3);
    const quote = rec.answer.quote ? `<blockquote class="doubt-quote">${escapeHtml(rec.answer.quote)}</blockquote>` : "";
    const actions = rec.resolved === "got"
      ? `<p class="small">已记下：懂了</p>`
      : `<div class="button-row">
          <button type="button" class="btn btn-ok tap-target" data-doubt-got="${escapeHtml(id)}">懂了</button>
          <button type="button" class="btn btn-secondary tap-target" data-doubt-still="${escapeHtml(id)}">还是不懂</button>
        </div>`;
    answerHtml = `<section class="doubt-answer" id="doubt-answer-${escapeHtml(String(block.id))}">
      <p class="doubt-answer-kicker">${rec.answer.status === "insufficient_context" ? "资料不足 · 尚不能确认" : "解答"}</p>
      ${text ? `<p class="doubt-answer-text">${escapeHtml(text)}</p>` : ""}
      ${quote}
      ${actions}
      ${rec.resolved === "still" ? '<p class="small doubt-still">已记为还是不懂，原回答仍保留。</p>' : ""}
    </section>`;
  }
  return `
    <div class="doubt-box">
      ${showCancel ? `<button type="button" class="btn btn-secondary tap-target" data-doubt-cancel="${escapeHtml(id)}">取消标记</button>` : ""}
      <input class="doubt-input" data-doubt-note="${escapeHtml(String(block.id))}" type="text" value="${escapeHtml(rec.note || "")}" placeholder="哪里不懂？一句话就行，可不填">
      <p class="doubt-hint">备注已记下。答疑模块正在载入；若未出现，请联网刷新。</p>
      ${answerHtml}
    </div>`;
}

function renderReadBlocks(meta, body) {
  const blocks = body && Array.isArray(body.blocks) ? body.blocks : [];
  const quizCards = planReadQuizCards(blocks, kaokaoItemsForChunk(meta));
  const quizByIndex = new Map();
  for (const card of quizCards) {
    const list = quizByIndex.get(card.before) || [];
    list.push(card);
    quizByIndex.set(card.before, list);
  }
  let lastPrinted = null;
  const parts = [];
  blocks.forEach((block, index) => {
    for (const card of quizByIndex.get(index) || []) parts.push(quizCardHtml(meta, card));
    const kind = block.kind || "para";
    const printed = block.printed;
    const showPage = printed != null && printed !== lastPrinted;
    if (printed != null) lastPrinted = printed;
    const mark = showPage ? `p.${printed}` : "";
    let inner = "";
    let doubt = false;
    const rhythm = rhythmMarkupFor(meta, block);
    if (kind === "h3" || kind === "h4" || kind === "h5" || kind === "h6" || kind === "fixed") {
      const tag = kind === "fixed" ? "h6" : kind;
      inner = `<${tag}>${renderRich(stripHashes(block.md))}</${tag}>`;
    } else if (kind === "table") {
      doubt = true;
      const tableParts = splitTableMd(block.md);
      const table = tableParts.table ? `<div class="read-table-wrap">${sanitizeTableHtml(tableParts.table)}</div>` : "";
      inner = `${tableParts.before ? `<div>${renderRich(tableParts.before)}</div>` : ""}${table}`;
    } else if (kind === "equation") {
      const tex = String(block.md || "").replace(/^\$\$/, "").replace(/\$\$$/, "").trim();
      inner = `<div class="read-equation">${renderTex(tex, true)}</div>`;
    } else if (kind === "figure") {
      doubt = true;
      inner = `<div class="read-figure">${renderRich(block.md)}</div>`;
    } else if (rhythm) {
      doubt = true;
      inner = renderRhythmMarkup(rhythm);
    } else {
      if (kind === "para") doubt = true;
      const klass = kind === "footnote" || kind === "qr" || kind === "review_insert" ? "small" : "";
      inner = `<div class="${klass}">${renderRich(block.md)}</div>`;
    }
    const doubtOn = !!(doubt && activeDoubt(meta.id, block.id));
    parts.push(`
      <div class="read-block" id="block-${escapeHtml(String(block.id))}">
        <div class="page-mark mono">${escapeHtml(mark)}</div>
        <div class="read-copy${doubt ? " has-doubt" : ""}${doubtOn ? " is-doubt" : ""}">
          ${doubt ? `<button type="button" class="doubt-btn${doubtOn ? " is-on" : ""}" data-doubt="${escapeHtml(String(block.id))}" aria-label="没看懂" aria-pressed="${doubtOn ? "true" : "false"}">？</button>` : ""}
          ${inner}
          ${doubt ? doubtPanelHtml(meta, block) : ""}
        </div>
      </div>
    `);
  });
  for (const card of quizByIndex.get(blocks.length) || []) parts.push(quizCardHtml(meta, card));
  return parts.join("");
}

function previewStepHtml(meta) {
  const questions = questionsForChunk(meta).filter((question) => question.verify?.status !== "doubt").slice(0, 3);
  return `
    <p>先看看这一块会怎么考，带着问题读。</p>
    ${questions.map((question, index) => `
      <article class="panel">
        <p><strong>${index + 1}.</strong> ${escapeHtml(question.stem || "（题干缺失）")}</p>
        ${question.options ? `<ul class="option-list">
          ${Object.entries(question.options).map(([key, value]) => `<li><span class="mono">${escapeHtml(key)}.</span> ${escapeHtml(value)}</li>`).join("")}
        </ul>` : ""}
      </article>
    `).join("")}
  `;
}

function readStepHtml(meta) {
  if (!canReadRepo()) {
    return `<p>原文存在你的私有仓库里，需要先在设置页连接 GitHub。</p>
      <div class="button-row"><button id="learn-go-settings" class="btn btn-secondary tap-target" type="button">去设置</button></div>`;
  }
  kickChunkBody(meta);
  kickRhythm(meta.unit);
  kickKatex();
  const body = app.study.bodies[meta.id];
  if (!body) {
    const state = app.study.bodyState[meta.id];
    if (state === "missing" || state === "error") return `<p>这一块的原文暂时没读到。</p>`;
    return `<p class="small">正在读取原文…</p>`;
  }
  return `${rhythmSwitchHtml(meta, body)}<div class="read-flow" data-layout="${rhythmMode()}">${renderReadBlocks(meta, body)}</div>`;
}

function lectureStepHtml(meta) {
  const lectures = lecturesForChunk(meta);
  if (!lectures.length) {
    const cards = cardsForChunk(meta);
    return `
      <p>这一块的精讲还在制作中</p>
      ${cards.length ? `<h2 class="h2">要点</h2>${cards.map((card) => `
        <article class="recall-card">
          <p>${escapeHtml(card.q || "")}</p>
          <button type="button" class="btn btn-secondary tap-target" data-point="${escapeHtml(card.id)}">点开看答案</button>
          <p class="point-answer" data-point-answer="${escapeHtml(card.id)}" hidden>${escapeHtml(card.a || "")}</p>
        </article>
      `).join("")}` : ""}
    `;
  }
  return lectures.map((item) => {
    const href = lectureHref(item.url);
    return `
      <p><a id="learn-lecture-open" href="${escapeHtml(href)}">在新页面打开</a></p>
      <iframe class="lecture-frame" title="${escapeHtml(item.title || "精讲")}" src="${escapeHtml(href)}"></iframe>
    `;
  }).join("");
}

function recallStepHtml(meta) {
  const cards = cardsForChunk(meta);
  if (!cards.length) return "";
  const index = Math.min(app.ui.learnRecall || 0, cards.length - 1);
  const card = cards[index];
  return `
    <article class="recall-card">
      <p class="small">${index + 1} / ${cards.length}</p>
      <p>${escapeHtml(card.q || "")}</p>
      ${app.ui.learnReveal ? `<p>${escapeHtml(card.a || "")}</p><p class="small mono">${escapeHtml(card.anchor || "")}</p>` : `<button id="learn-reveal" class="btn btn-secondary tap-target" type="button">点开看答案</button>`}
      <div class="button-row">
        ${index > 0 ? `<button id="learn-recall-prev" class="btn btn-secondary tap-target" type="button">上一张</button>` : ""}
        ${index < cards.length - 1 ? `<button id="learn-recall-next" class="btn btn-secondary tap-target" type="button">下一张</button>` : ""}
      </div>
    </article>
  `;
}

function learnQuestionHtml(question) {
  const attempt = getAttempt(question.id);
  const lastTry = latestTry(question.id);
  const verify = question.verify || {};
  const verifyLabel = verify.status === "ok" ? "已核实" : verify.status === "fixed" ? "已按教材改正" : "存疑";
  const verifyClass = verify.status === "ok" ? "status-ok" : verify.status === "fixed" ? "status-warn" : "status-bad";
  const options = question.options ? Object.entries(question.options) : [];
  const multi = isMultiSelect(question.type);
  const hasAnswer = String(question.answer || "").trim().length > 0;
  const explanation = String(question.explanation || "").trim();
  const fixedHint = verify.status === "fixed"
    ? ` <span class="small">来源答案 ${escapeHtml(String(question.source_answer ?? ""))} 有误，已按教材改正</span>`
    : "";
  return `
    <article class="panel">
      <p>${escapeHtml(question.stem || "（题干缺失）")}</p>
      ${options.length ? `
        <ul class="option-list">
          ${options.map(([key, value]) => `
            <li>
              <button class="${optionButtonClass(key, question, lastTry, app.ui.learnChoice)}" data-learn-choice="${escapeHtml(key)}" type="button">
                <span class="mono">${escapeHtml(key)}.</span>&nbsp;<span>${escapeHtml(value)}</span>
              </button>
            </li>`).join("")}
        </ul>
        ${multi ? `<div class="button-row"><button id="learn-submit" class="btn btn-primary tap-target" type="button">提交答案</button></div>` : ""}
      ` : `<p class="small">该题暂无结构化选项，可直接看解析。</p>`}
      ${lastTry ? `
        <section class="panel">
          <p><span class="status-pill ${lastTry.ok ? "status-ok" : "status-bad"}">${lastTry.ok ? "答对了" : "答错了"}</span></p>
          ${hasAnswer ? `<p><strong>正确答案：</strong>${escapeHtml(String(question.answer))}${fixedHint}</p>` : `<p>答案存疑，见说明</p>`}
          ${explanation ? `<p><strong>解析：</strong>${escapeHtml(explanation)}</p>` : ""}
          ${verify.note ? `<p><strong>说明：</strong>${escapeHtml(verify.note)}</p>` : ""}
          <p><strong>教材原文摘录：</strong>${escapeHtml(verify.excerpt || "（暂无）")}</p>
          <p class="small mono">${escapeHtml(verify.anchor || question.anchor || "-")}</p>
          ${anchorPrintedHtml(verify.anchor || question.anchor || "")}
          <p><span class="verify-badge ${verifyClass}">${escapeHtml(verifyLabel)}${verify.status === "fixed" && verify.note ? `：${escapeHtml(verify.note)}` : ""}</span></p>
        </section>
      ` : ""}
      ${lastTry && !lastTry.ok && verify.status !== "doubt" ? `
        <section class="panel">
          <p>错因：</p>
          <div class="button-row">
            ${["不会", "记混", "没读清题"].map((txt) => `<button class="btn ${attempt.err === txt ? "btn-primary" : "btn-secondary"} tap-target" data-learn-err="${escapeHtml(txt)}" type="button">${escapeHtml(txt)}</button>`).join("")}
          </div>
        </section>` : ""}
      <section class="panel">
        <label for="learn-note" class="label">我的解析（答案 + 依据 + 规律）</label>
        <textarea id="learn-note" class="textarea" placeholder="写给下一次复习的自己">${escapeHtml(attempt.note || "")}</textarea>
        <p class="small">失焦或停顿 1.5 秒自动保存。</p>
      </section>
    </article>
  `;
}

function quizStepHtml(meta) {
  const questions = questionsForChunk(meta);
  if (!questions.length) return `<p>本块暂无真题，请在原文中完成随文练习。</p>`;
  const normal = questions.filter((question) => question.verify?.status !== "doubt");
  const doubts = questions.filter((question) => question.verify?.status === "doubt");
  const current = questions.find((question) => question.id === app.ui.learnQid) || null;
  if (app.ui.learnQuiz === "question" && current) {
    return `
      <div class="button-row"><button id="learn-back-list" class="btn btn-secondary tap-target" type="button">← 题目列表</button></div>
      ${learnQuestionHtml(current)}
    `;
  }
  const row = (question) => `
    <li class="q-item">
      <button class="q-btn" data-learn-qid="${escapeHtml(question.id)}" type="button">
        <span class="q-copy">
          <span class="q-stem">${escapeHtml(stemPreview(question.stem))}</span>
          <span class="q-meta">${escapeHtml(String(question.year || "----"))} · ${escapeHtml(question.subject || "")} · ${escapeHtml(question.type || "")}</span>
        </span>
        <span class="${getQuestionStateClass(question.id)}">${escapeHtml(getQuestionState(question.id))}</span>
      </button>
    </li>`;
  return `
    <ul class="q-list">${normal.map(row).join("")}</ul>
    ${doubts.length ? `
      <details class="doubt-fold" ${app.ui.learnDoubtOpen ? "open" : ""}>
        <summary class="doubt-summary">存疑（不计入复习）</summary>
        <ul class="q-list">${doubts.map(row).join("")}</ul>
      </details>
    ` : ""}
  `;
}

function pendingDoubtAnswers() {
  const list = [];
  for (const [id, rec] of Object.entries((app.state && app.state.doubts) || {})) {
    if (!rec || rec.removed || rec.resolved || !rec.answer) continue;
    if (!rec.answer.text && !rec.answer.quote) continue;
    list.push({ id, ...rec });
  }
  list.sort((a, b) => (Number(a.updatedAt) || 0) - (Number(b.updatedAt) || 0));
  return list;
}

function openDoubtAnswer(rec) {
  if (!rec || !rec.chunk) return;
  app.ui.kaokaoFocus = {
    chunkId: rec.chunk,
    blockId: rec.block,
    src: ""
  };
  writeLearnMemory(rec.chunk, "read");
  openLearn(rec.chunk);
}

function chunkDoubtItems(chunkId) {
  const list = [];
  for (const [id, rec] of Object.entries((app.state && app.state.doubts) || {})) {
    if (!rec || rec.removed || rec.chunk !== chunkId) continue;
    list.push({ id, ...rec });
  }
  return list;
}

function doubtJumpLabel(meta, rec) {
  const note = String(rec.note || "").trim();
  if (note) return note;
  const body = meta && app.study.bodies[meta.id];
  const block = body && (body.blocks || []).find((item) => String(item.id) === String(rec.block));
  if (block) {
    const text = markdownPlain(block.md);
    if (text) return text.length > 28 ? `${text.slice(0, 28)}…` : text;
  }
  return `段 ${rec.block}`;
}

function doneStepHtml(meta) {
  const score = chunkScore(meta);
  const chunks = unitChunks([meta.unit]);
  const next = nextChunkAfter(chunks, meta);
  const rec = app.state.chunks && app.state.chunks[meta.id];
  const reviewed = rec && rec.doneAt;
  const marked = chunkDoubtItems(meta.id);
  const kaokaoParts = [kaokaoSummary(meta), kaokaoPoolNote(meta)].filter(Boolean);
  const doubtLine = marked.length ? `
    <div id="learn-doubt-line">
      <p>没看懂 ${marked.length} 处，已记下</p>
      <ul class="doubt-jump-list">
        ${marked.map((item) => `<li><button type="button" class="text-link tap-target" data-doubt-jump="${escapeHtml(String(item.block))}">${escapeHtml(doubtJumpLabel(meta, item))}</button></li>`).join("")}
      </ul>
    </div>` : "";
  return `
    ${reviewed ? `<p class="learn-review-note" id="learn-review-note">已于 ${escapeHtml(rec.doneAt)} 学完，这次是复习。</p>` : ""}
    <p id="learn-minutes">用时 ${learnMinutes(meta.id)} 分钟</p>
    <p id="learn-score">做题 ${score.done} 道对 ${score.correct} 道</p>
    ${kaokaoParts.length ? `<p id="learn-kaokao-line">${kaokaoParts.map((part) => escapeHtml(part)).join("<br>")}</p>` : ""}
    ${doubtLine}
    <div class="button-row">
      <button id="learn-finish" class="btn btn-primary tap-target" type="button">${reviewed ? "再学一遍完成" : "这一块学完了"}</button>
      ${next ? `<button id="learn-finish-next" class="btn btn-secondary tap-target" type="button" data-next-chunk="${escapeHtml(next.id)}">学下一块</button>` : ""}
    </div>
  `;
}

function renderLearn() {
  const root = document.getElementById("page-learn");
  if (!root) return;
  flushDoubtInputs();
  if (app.ui.tab !== "learn") {
    destroyQaPanels();
    if (root.innerHTML) root.innerHTML = "";
    delete root.dataset.chunkId;
    return;
  }
  const chunkId = app.ui.routeChunkId || hashRoute().chunkId;
  for (const [id, panel] of qaPanels) {
    if (!id.startsWith(`${chunkId}:`)) { panel.handle.destroy(); qaPanels.delete(id); }
  }
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  const today = shanghaiToday();
  const weekUnits = app.data ? getWeekContext(today).units : [];
  weekUnits.forEach((unitId) => {
    kickUnitIndex(unitId);
    kickKaokao(unitId);
    kickRhythm(unitId);
  });
  const meta = findChunkMeta(chunkId);
  if (!meta) {
    const waiting = weekUnits.some((unitId) => app.study.indexState[unitId] === "loading" || !app.study.indexState[unitId]);
    root.innerHTML = waiting
      ? `<p class="small">正在读取学习内容…</p>`
      : `<p>原文存在你的私有仓库里，需要先在设置页连接 GitHub。</p>
         <p>连接 GitHub 后才能看到学习内容</p>
         <div class="button-row"><button id="learn-go-settings" class="btn btn-secondary tap-target" type="button">去设置</button></div>`;
    const settingsBtn = document.getElementById("learn-go-settings");
    if (settingsBtn) settingsBtn.addEventListener("click", () => navigateTo("settings"));
    return;
  }
  if (canReadRepo()) {
    kickChunkBody(meta);
    kickKaokao(meta.unit);
    kickRhythm(meta.unit);
  }
  if (app.ui.learnBoundChunk !== meta.id) {
    app.ui.learnBoundChunk = meta.id;
    app.ui.learnQid = "";
    app.ui.learnChoice = "";
    app.ui.learnQuiz = "list";
    app.ui.learnRecall = 0;
    app.ui.learnReveal = false;
    app.ui.learnDoubtOpen = false;
    app.ui.learnWhy = 0;
    app.ui.learnWhyReveal = false;
    app.ui.quizCursor = {};
    app.ui.quizCollapsed = {};
    app.ui.quizReview = {};
    app.ui.kaokaoShown = {};
    app.ui.doubtCancel = "";
  }
  ensureLearnTimer(meta.id);
  const steps = buildLearnSteps(meta);
  const memory = app.ui.learnPlace && app.ui.learnPlace.chunkId === meta.id
    ? app.ui.learnPlace
    : readLearnMemory();
  const preferred = memory && memory.chunkId === meta.id ? memory.stepId : "";
  const kaokaoState = app.study.kaokaoState[meta.unit];
  const kaokaoPending = canReadRepo() && !app.study.kaokao[meta.unit]
    && kaokaoState !== "missing" && kaokaoState !== "error";
  if (kaokaoPending && (preferred === "why" || preferred === "retell") && !steps.some((step) => step.id === preferred)) {
    root.innerHTML = `<p class="small">正在读取可考句…</p>`;
    return;
  }
  const stepId = currentLearnStep(meta.id, steps);
  if (stepId !== "read") destroyQaPanels();
  root.dataset.chunkId = meta.id;
  writeLearnMemory(meta.id, stepId);
  const stepIndex = Math.max(0, steps.findIndex((step) => step.id === stepId));
  let body = "";
  if (stepId === "preview") body = previewStepHtml(meta);
  else if (stepId === "read") body = readStepHtml(meta);
  else if (stepId === "why") body = whyStepHtml(meta);
  else if (stepId === "recall") body = recallStepHtml(meta);
  else if (stepId === "retell") body = retellStepHtml(meta);
  else if (stepId === "quiz") body = quizStepHtml(meta);
  else body = doneStepHtml(meta);
  root.innerHTML = `
    <div class="learn-top">
      <div class="button-row"><button id="learn-back" class="btn btn-secondary tap-target" type="button">← 今天</button></div>
      <h1 class="h1" id="learn-title">${escapeHtml(meta.title || meta.id)}</h1>
      <p class="small" id="learn-source">${escapeHtml(bookName(meta.book))} · 印刷页 ${escapeHtml(printedRange(meta))}</p>
    </div>
    <ol class="learn-steps" id="learn-steps" data-step-count="${steps.length}">
      ${steps.map((step) => `
        <li>
          <button type="button" class="step-jump${step.id === stepId ? " is-current" : ""}" data-step="${escapeHtml(step.id)}" aria-label="${escapeHtml(step.label)}"${step.id === stepId ? ` aria-current="step"` : ""}>
            <span class="step-dot" aria-hidden="true"></span>
            <span class="step-label">${escapeHtml(step.label)}</span>
          </button>
        </li>
      `).join("")}
    </ol>
    <div id="learn-step-body">${body}</div>
    <div class="learn-bar">
      <button id="learn-prev" class="btn btn-secondary tap-target" type="button" ${stepIndex === 0 ? "disabled" : ""}>上一步</button>
      <button id="learn-next" class="btn btn-primary tap-target" type="button" ${stepIndex >= steps.length - 1 ? "disabled" : ""}>下一步</button>
    </div>
  `;
  const goStep = (nextId) => {
    const retell = document.getElementById("learn-retell");
    if (retell) {
      clearTimeout(app.ui.retellTimer);
      app.ui.retellTimer = null;
      saveKaokaoRetell(meta.id, retell.value, meta.unit, { silent: true });
    }
    flushDoubtInputs();
    app.ui.learnChoice = "";
    writeLearnMemory(meta.id, nextId);
    render();
  };
  document.getElementById("learn-back").addEventListener("click", () => navigateTo("today"));
  const prev = document.getElementById("learn-prev");
  const next = document.getElementById("learn-next");
  if (prev) prev.addEventListener("click", () => { if (stepIndex > 0) goStep(steps[stepIndex - 1].id); });
  if (next) next.addEventListener("click", () => { if (stepIndex < steps.length - 1) goStep(steps[stepIndex + 1].id); });
  root.querySelectorAll("[data-step]").forEach((button) => {
    button.addEventListener("click", () => goStep(button.dataset.step));
  });
  root.querySelectorAll("[data-doubt-jump]").forEach((button) => {
    button.addEventListener("click", () => {
      app.ui.kaokaoFocus = {
        chunkId: meta.id,
        blockId: button.dataset.doubtJump,
        src: ""
      };
      goStep("read");
    });
  });
  const settingsBtn = document.getElementById("learn-go-settings");
  if (settingsBtn) settingsBtn.addEventListener("click", () => navigateTo("settings"));
  root.querySelectorAll("[data-point]").forEach((button) => {
    button.addEventListener("click", () => {
      const answer = root.querySelector(`[data-point-answer="${button.dataset.point}"]`);
      if (answer) answer.hidden = false;
      button.hidden = true;
    });
  });
  const reveal = document.getElementById("learn-reveal");
  if (reveal) reveal.addEventListener("click", () => { app.ui.learnReveal = true; render(); });
  const recallPrev = document.getElementById("learn-recall-prev");
  if (recallPrev) recallPrev.addEventListener("click", () => { app.ui.learnRecall -= 1; app.ui.learnReveal = false; render(); });
  const recallNext = document.getElementById("learn-recall-next");
  if (recallNext) recallNext.addEventListener("click", () => { app.ui.learnRecall += 1; app.ui.learnReveal = false; render(); });
  const finish = document.getElementById("learn-finish");
  if (finish) finish.addEventListener("click", () => { completeLearnChunk(meta); navigateTo("today"); });
  const finishNext = document.getElementById("learn-finish-next");
  if (finishNext) {
    finishNext.addEventListener("click", () => {
      const nextId = finishNext.dataset.nextChunk;
      completeLearnChunk(meta);
      app.ui.learnBoundChunk = "";
      writeLearnMemory(nextId, "");
      openLearn(nextId);
    });
  }
  wireLearnQuiz(meta);
  wireKaokao(meta);
  wireDoubts(meta);
  if (stepId === "read") applyKaokaoFocus(meta);
}

function wireDoubts(meta) {
  const root = document.getElementById("page-learn");
  if (!root || !meta) return;
  root.querySelectorAll("[data-rhythm]").forEach((button) => {
    button.addEventListener("click", () => {
      const next = button.dataset.rhythm === "plain" ? "plain" : "focus";
      if (next === rhythmMode()) return;
      flushDoubtInputs();
      setRhythmMode(next);
      render();
    });
  });
  root.querySelectorAll("[data-doubt]").forEach((button) => {
    button.addEventListener("click", () => {
      const blockId = button.dataset.doubt;
      const id = doubtKey(meta.id, blockId);
      const input = root.querySelector(`[data-doubt-note="${blockId}"]`);
      flushDoubtInput(meta, input);
      if (!activeDoubt(meta.id, blockId)) {
        const prev = (app.state.doubts && app.state.doubts[id]) || {};
        app.ui.doubtCancel = "";
        const patch = {
          note: prev.note || "",
          removed: false
        };
        if (prev.removed) {
          patch.at = shanghaiIso();
          patch.resolved = "";
        }
        writeDoubt(meta, blockId, patch);
        return;
      }
      app.ui.doubtCancel = id;
      render();
    });
  });
  root.querySelectorAll("[data-doubt-cancel]").forEach((button) => {
    button.addEventListener("click", () => {
      const blockId = button.dataset.doubtCancel.slice(meta.id.length + 1);
      const input = root.querySelector(`[data-doubt-note="${blockId}"]`);
      flushDoubtInput(meta, input);
      app.ui.doubtCancel = "";
      writeDoubt(meta, blockId, { removed: true });
    });
  });
  root.querySelectorAll("[data-doubt-got], [data-doubt-still]").forEach((button) => {
    button.addEventListener("click", () => {
      const id = button.dataset.doubtGot || button.dataset.doubtStill;
      const blockId = id.slice(meta.id.length + 1);
      const input = root.querySelector(`[data-doubt-note="${blockId}"]`);
      flushDoubtInput(meta, input);
      writeDoubt(meta, blockId, { resolved: button.dataset.doubtGot ? "got" : "still" });
    });
  });
  root.querySelectorAll("[data-doubt-note]").forEach((input) => {
    const blockId = input.dataset.doubtNote;
    const id = doubtKey(meta.id, blockId);
    const saveNow = () => flushDoubtInput(meta, input);
    input.addEventListener("input", () => {
      input.dataset.doubtDirty = "1";
      if (!app.ui.doubtTimers) app.ui.doubtTimers = {};
      clearTimeout(app.ui.doubtTimers[id]);
      app.ui.doubtTimers[id] = setTimeout(saveNow, 1500);
    });
    input.addEventListener("blur", () => {
      if (app.ui.doubtTimers) clearTimeout(app.ui.doubtTimers[id]);
      saveNow();
    });
  });
  mountStudyQa(meta);
}

function wireLearnQuiz(meta) {
  const root = document.getElementById("page-learn");
  if (!root) return;
  const fold = root.querySelector(".doubt-fold");
  if (fold) fold.addEventListener("toggle", () => { app.ui.learnDoubtOpen = fold.open; });
  root.querySelectorAll("[data-learn-qid]").forEach((button) => {
    button.addEventListener("click", () => {
      app.ui.learnQid = button.dataset.learnQid;
      app.ui.learnChoice = "";
      app.ui.learnQuiz = "question";
      const question = questionsForChunk(meta).find((item) => item.id === app.ui.learnQid);
      if (question && question.verify?.status === "doubt") app.ui.learnDoubtOpen = true;
      render();
    });
  });
  const back = document.getElementById("learn-back-list");
  if (back) {
    back.addEventListener("click", () => {
      app.ui.learnQuiz = "list";
      app.ui.learnChoice = "";
      render();
    });
  }
  const current = questionsForChunk(meta).find((question) => question.id === app.ui.learnQid);
  if (!current) return;
  root.querySelectorAll("[data-learn-choice]").forEach((button) => {
    button.addEventListener("click", () => {
      const key = button.dataset.learnChoice;
      if (isMultiSelect(current.type)) {
        const set = new Set(String(app.ui.learnChoice || "").split("").filter(Boolean));
        if (set.has(key)) set.delete(key); else set.add(key);
        app.ui.learnChoice = [...set].sort().join("");
        render();
      } else {
        app.ui.learnChoice = "";
        submitAnswer(current, key);
      }
    });
  });
  const submit = document.getElementById("learn-submit");
  if (submit) {
    submit.addEventListener("click", () => {
      if (!app.ui.learnChoice) return;
      const choice = app.ui.learnChoice;
      app.ui.learnChoice = "";
      submitAnswer(current, choice);
    });
  }
  root.querySelectorAll("[data-learn-err]").forEach((button) => {
    button.addEventListener("click", () => setPracticeErr(current.id, button.dataset.learnErr));
  });
  const noteEl = document.getElementById("learn-note");
  if (!noteEl) return;
  const saveNoteDebounced = () => {
    clearTimeout(app.ui.noteTimer);
    app.ui.noteTimer = setTimeout(() => {
      savePracticeNote(current.id, noteEl.value.trim());
    }, 1500);
  };
  noteEl.addEventListener("input", saveNoteDebounced);
  noteEl.addEventListener("blur", () => savePracticeNote(current.id, noteEl.value.trim()));
}

function renderToday(today, weekCtx) {
  const root = document.getElementById("page-today");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  if (app.error) {
    root.innerHTML = `<div class="app-error">${app.error}</div>`;
    return;
  }
  const weekUnits = weekCtx.units || [];
  weekUnits.forEach((unitId) => kickUnitIndex(unitId));
  const review = todayReviewView(today);
  const chunks = unitChunks(weekUnits);
  const indexReady = weekUnits.some((unitId) => app.study.indexes[unitId]);
  const indexSettled = weekUnits.every((unitId) => {
    const state = app.study.indexState[unitId];
    return state === "ready" || state === "missing" || state === "error";
  });
  const doneToday = chunks.filter((chunk) => {
    const rec = app.state.chunks && app.state.chunks[chunk.id];
    return rec && rec.doneAt === today;
  }).sort((a, b) => ((app.state.chunks[b.id] || {}).updatedAt || 0) - ((app.state.chunks[a.id] || {}).updatedAt || 0));
  const firstOpen = chunks.find((chunk) => !chunkDone(chunk.id)) || null;
  const shown = doneToday[0] || firstOpen;
  const learnedCount = chunks.filter((chunk) => chunkDone(chunk.id)).length;
  const remainMin = chunks.filter((chunk) => !chunkDone(chunk.id)).reduce((sum, chunk) => sum + chunkEstMinutes(chunk), 0);
  const currentWeek = weekCtx.week;
  const weekDoc = currentWeek ? app.state.weeks[currentWeek.start] || {} : {};
  const daysLeft = daysLeftInWeek(today, currentWeek);
  const submitted = weekDoc.submittedAt ? "已交" : "未交";
  const weekLine = indexReady
    ? `${formatUnitNames(weekUnits)} · 已学 ${learnedCount}/${chunks.length} 块 · 剩约 ${remainMin} 分钟 · 本周还剩 ${daysLeft} 天 · ${submitted}`
    : `${formatUnitNames(weekUnits)} · 本周还剩 ${daysLeft} 天 · ${submitted}`;
  const answered = questionsAnsweredOn(today);
  let foot = "";
  if (review.done && doneToday.length) {
    foot = `<p class="today-foot is-ok" id="today-complete">今天完成了 ✓ &nbsp; 复习 ${review.reviewed} 张 · 学了 ${doneToday.length} 块 · 做题 ${answered} 道</p>`;
  } else if (review.done) {
    foot = `<p class="today-foot" id="today-complete">复习完成，今天也算完成。时间够的话学一块。</p>`;
  }
  const pendingDoubts = pendingDoubtAnswers();
  let reviewBody = "";
  if (!review.done) {
    const eta = Math.round(review.remaining * 0.6);
    reviewBody = `
      <p class="small" id="today-review-status">到期 ${review.remaining} 张 · 约 ${eta} 分钟</p>
      <div class="button-row"><button id="today-go-review" class="btn btn-primary tap-target" type="button">开始复习</button></div>
    `;
  } else if (review.reviewed > 0) {
    reviewBody = `<p class="today-check" id="today-review-status">✓ 复习完成（答对 ${review.stats.remember || 0} / 答错 ${review.stats.wrong || 0} / 没印象 ${review.stats.blank || 0}）</p>`;
  } else {
    reviewBody = `<p class="small" id="today-review-status">今天没有到期的卡片</p>`;
  }
  let chunkBody = "";
  if (!indexReady && !indexSettled) {
    chunkBody = `<p class="small">正在读取学习内容…</p>`;
  } else if (!indexReady && !canReadRepo()) {
    chunkBody = `
      <p id="today-chunk-missing">连接 GitHub 后才能看到学习内容</p>
      <div class="button-row"><button id="today-go-settings" class="btn btn-secondary tap-target" type="button">去设置</button></div>
    `;
  } else if (!indexReady) {
    chunkBody = `<p id="today-chunk-missing">学习内容暂时没读到。</p>`;
  } else if (!shown) {
    chunkBody = `<p class="small">本周的块都学完了。</p>`;
  } else if (doneToday.length) {
    const next = nextChunkAfter(chunks, shown);
    chunkBody = `
      <p id="today-chunk-title">${escapeHtml(shown.title || shown.id)}</p>
      <p class="small">${escapeHtml(chunkMetaLine(shown))}</p>
      <p class="today-check" id="today-chunk-done">✓ 已学完</p>
      <div class="button-row"><button id="today-review-again" class="btn btn-secondary tap-target" type="button" data-chunk="${escapeHtml(shown.id)}">再看一遍</button></div>
      ${next ? `<div class="button-row"><button id="today-learn-next" class="btn btn-secondary tap-target" type="button" data-chunk="${escapeHtml(next.id)}">再学一块：${escapeHtml(next.title || next.id)}</button></div>` : `<p class="small">本周的块都学完了。</p>`}
    `;
  } else {
    chunkBody = `
      <p id="today-chunk-title">${escapeHtml(shown.title || shown.id)}</p>
      <p class="small">${escapeHtml(chunkMetaLine(shown))}</p>
      <div class="button-row"><button id="today-start-learn" class="btn btn-primary tap-target" type="button" data-chunk="${escapeHtml(shown.id)}">开始学</button></div>
    `;
  }
  const baseline = weekCtx.phase === "pre" ? `
    <label class="check-row baseline-line" for="baseline-done">
      <input id="baseline-done" type="checkbox" ${app.state.baselineDone ? "checked" : ""}>
      <span class="small">这周找一套综合能力真题，不计时做一遍，只看题型。做完了</span>
    </label>
  ` : "";
  root.innerHTML = `
    <h1 class="h1">今天</h1>
    <section class="today-board">
      <article class="today-task">
        <h2 class="today-kicker">① 复习</h2>
        ${reviewBody}
        ${pendingDoubts.length ? `<p class="today-doubt-jump"><button id="today-doubt-answer" class="text-link tap-target" type="button">有 ${pendingDoubts.length} 条解答待看</button></p>` : ""}
      </article>
      <article class="today-task" id="today-chunk-card">
        <h2 class="today-kicker">② 今天这一块</h2>
        ${chunkBody}
        <p class="today-all"><button id="today-all-chunks" class="text-link" type="button">全部学习块 →</button></p>
      </article>
    </section>
    ${baseline}
    ${foot}
    <p class="small today-week" id="today-week-line">${escapeHtml(weekLine)}</p>
  `;
  const baselineInput = document.getElementById("baseline-done");
  if (baselineInput) {
    baselineInput.addEventListener("change", () => store.save("baselineDone", baselineInput.checked));
  }
  const reviewBtn = document.getElementById("today-go-review");
  if (reviewBtn) reviewBtn.addEventListener("click", () => navigateTo("review"));
  const doubtBtn = document.getElementById("today-doubt-answer");
  if (doubtBtn && pendingDoubts[0]) {
    doubtBtn.addEventListener("click", () => openDoubtAnswer(pendingDoubts[0]));
  }
  const settingsBtn = document.getElementById("today-go-settings");
  if (settingsBtn) settingsBtn.addEventListener("click", () => navigateTo("settings"));
  const startBtn = document.getElementById("today-start-learn");
  if (startBtn) startBtn.addEventListener("click", () => openLearn(startBtn.dataset.chunk));
  const againBtn = document.getElementById("today-review-again");
  if (againBtn) againBtn.addEventListener("click", () => openLearn(againBtn.dataset.chunk));
  const nextBtn = document.getElementById("today-learn-next");
  if (nextBtn) nextBtn.addEventListener("click", () => openLearn(nextBtn.dataset.chunk));
  const allBtn = document.getElementById("today-all-chunks");
  if (allBtn) allBtn.addEventListener("click", () => openWeekMap());
}

function practiceQuestionLists(unitId) {
  const unitQuestions = app.data.questions.questions.filter((q) => q.unit === unitId);
  const normal = unitQuestions.filter((q) => q.verify?.status !== "doubt");
  const doubts = unitQuestions.filter((q) => q.verify?.status === "doubt");
  return { normal, doubts };
}

function nextPracticeQuestion(current, normal, doubts) {
  const group = current.verify?.status === "doubt" ? doubts : normal;
  const index = group.findIndex((q) => q.id === current.id);
  if (index < 0 || index + 1 >= group.length) return null;
  return group[index + 1];
}

function optionButtonClass(key, question, lastTry, pendingChoice) {
  const classes = ["option-btn", "tap-target"];
  const picked = pendingChoice == null ? app.ui.practiceChoice : pendingChoice;
  const answer = String(question.answer || "").trim();
  const showResult = !!lastTry && !picked && /^[A-Z]+$/.test(answer);
  if (showResult) {
    const correct = new Set(answer.split(""));
    const chosen = new Set(String(lastTry.choice || "").split(""));
    if (correct.has(key)) classes.push("opt-ok");
    else if (chosen.has(key)) classes.push("opt-bad");
  } else if (String(picked || "").includes(key)) {
    classes.push("on");
  }
  return classes.join(" ");
}

function renderPracticeListRow(q) {
  return `
    <li class="q-item">

        <span class="q-copy">
          <span class="q-stem">${stemPreview(q.stem)}</span>
          <span class="q-meta">${q.year || "----"} · ${q.subject} · ${q.type}</span>
        </span>
        <span class="${getQuestionStateClass(q.id)}">${getQuestionState(q.id)}</span>
      </button>
    </li>`;
}

    app.ui.practiceUnit = defaultUnit;
    app.ui.practiceView = "list";
    app.ui.practiceQid = "";
    app.ui.practiceChoice = "";

  const { normal, doubts } = practiceQuestionLists(app.ui.practiceUnit);
  const ordered = [...normal, ...doubts];
  const current = ordered.find((q) => q.id === app.ui.practiceQid) || null;

    renderPracticeQuestion(root, current, normal, doubts);

  root.innerHTML = `

      <label for="practice-unit-select" class="label">单元</label>

  document.getElementById("practice-unit-select").addEventListener("change", (event) => {

    app.ui.practiceQid = "";
    app.ui.practiceChoice = "";
    app.ui.practiceView = "list";
    render();
  });

  if (doubtFold) {

      app.ui.doubtOpen = doubtFold.open;
    });
