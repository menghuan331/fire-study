  root.querySelectorAll("[data-qid]").forEach((btn) => {
    btn.addEventListener("click", () => {
      app.ui.practiceQid = btn.dataset.qid;
      app.ui.practiceChoice = "";
      app.ui.practiceView = "question";
      const picked = ordered.find((q) => q.id === btn.dataset.qid);
      if (picked?.verify?.status === "doubt") app.ui.doubtOpen = true;
      render();
    });
  });
}

function renderPracticeQuestion(root, current, normal, doubts) {
  const attempt = getAttempt(current.id);
  const lastTry = latestTry(current.id);
  const verify = current.verify || {};
  const verifyLabel = verify.status === "ok" ? "已核实" : verify.status === "fixed" ? "已按教材改正" : "存疑";
  const verifyClass = verify.status === "ok" ? "status-ok" : verify.status === "fixed" ? "status-warn" : "status-bad";
  const options = current.options ? Object.entries(current.options) : [];
  const multi = isMultiSelect(current.type);
  const hasAnswer = String(current.answer || "").trim().length > 0;
  const explanation = String(current.explanation || "").trim();
  const fixedHint = verify.status === "fixed"
    ? ` <span class="small">来源答案 ${current.source_answer ?? ""} 有误，已按教材改正</span>`
    : "";
  const nextQ = nextPracticeQuestion(current, normal, doubts);

  root.innerHTML = `
    <h1 class="h1">做题</h1>
    <div class="button-row">
      <button id="practice-back" class="btn btn-secondary tap-target" type="button">← 题目列表</button>
    </div>
    <article class="panel">
      <p><strong>${current.id}</strong></p>
      <p>${current.stem || "（题干缺失）"}</p>
      ${options.length ? `
      <ul class="option-list">
        ${options.map(([key, value]) => `
          <li>
            <button class="${optionButtonClass(key, current, lastTry)}" data-choice="${key}" type="button">
              <span class="mono">${key}.</span>&nbsp;<span>${value}</span>
            </button>
          </li>`).join("")}
      </ul>
      ${multi ? `<div class="button-row"><button id="practice-submit" class="btn btn-primary tap-target" type="button">提交答案</button></div>` : ""}
      ` : `<p class="small">该题暂无结构化选项，可直接看解析。</p>`}
      ${lastTry ? `
      <section class="panel">
        <p><span class="status-pill ${lastTry.ok ? "status-ok" : "status-bad"}">${lastTry.ok ? "答对了" : "答错了"}</span></p>
        ${hasAnswer ? `<p><strong>正确答案：</strong>${current.answer}${fixedHint}</p>` : `<p>答案存疑，见说明</p>`}
        ${explanation ? `<p><strong>解析：</strong>${explanation}</p>` : ""}
        ${verify.note ? `<p><strong>说明：</strong>${verify.note}</p>` : ""}
        <p><strong>教材原文摘录：</strong>${verify.excerpt || "（暂无）"}</p>
        <p class="small mono">${verify.anchor || current.anchor || "-"}</p>
        <p><span class="verify-badge ${verifyClass}">${verifyLabel}${verify.status === "fixed" && verify.note ? `：${verify.note}` : ""}</span></p>
      </section>
      ` : ""}
      ${lastTry && !lastTry.ok && verify.status !== "doubt" ? `
      <section class="panel">
        <p>错因：</p>
        <div class="button-row">
          ${["不会", "记混", "没读清题"].map((txt) => `<button class="btn ${attempt.err === txt ? "btn-primary" : "btn-secondary"} tap-target" data-err="${txt}" type="button">${txt}</button>`).join("")}
        </div>
      </section>` : ""}
      <section class="panel">
        <label for="practice-note" class="label">我的解析（答案 + 依据 + 规律）</label>
        <textarea id="practice-note" class="textarea" placeholder="写给下一次复习的自己">${attempt.note || ""}</textarea>
        <p class="small">失焦或停顿 1.5 秒自动保存。</p>
      </section>
    </article>
    <div class="button-row">
      <button id="practice-next" class="btn btn-secondary tap-target" type="button" ${nextQ ? "" : "disabled"}>下一题 →</button>
    </div>
  `;

  document.getElementById("practice-back").addEventListener("click", () => {
    app.ui.practiceView = "list";
    app.ui.practiceChoice = "";
    render();
  });

  const nextBtn = document.getElementById("practice-next");
  if (nextBtn && nextQ) {
    nextBtn.addEventListener("click", () => {
      app.ui.practiceQid = nextQ.id;
      app.ui.practiceChoice = "";
      app.ui.practiceView = "question";
      render();
    });
  }

  root.querySelectorAll("[data-choice]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.choice;
      if (isMultiSelect(current.type)) {
        const set = new Set(app.ui.practiceChoice.split("").filter(Boolean));
        if (set.has(key)) set.delete(key); else set.add(key);
        app.ui.practiceChoice = [...set].sort().join("");
        render();
      } else {
        app.ui.practiceChoice = "";
        submitAnswer(current, key);
      }
    });
  });

  const submitBtn = document.getElementById("practice-submit");
  if (submitBtn) {
    submitBtn.addEventListener("click", () => {
      if (!app.ui.practiceChoice) return;
      const choice = app.ui.practiceChoice;
      app.ui.practiceChoice = "";
      submitAnswer(current, choice);
    });
  }

  root.querySelectorAll("[data-err]").forEach((btn) => {
    btn.addEventListener("click", () => setPracticeErr(current.id, btn.dataset.err));
  });

  const noteEl = document.getElementById("practice-note");
  const saveNoteDebounced = () => {
    clearTimeout(app.ui.noteTimer);
    app.ui.noteTimer = setTimeout(() => {
      savePracticeNote(current.id, noteEl.value.trim());
    }, 1500);
  };
  noteEl.addEventListener("input", saveNoteDebounced);
  noteEl.addEventListener("blur", () => savePracticeNote(current.id, noteEl.value.trim()));
}

function reviewCardContent(card) {
  if (card.src === "wrong") {
    const q = app.derived.questionById.get(card.qid);
    if (!q) return { front: "原题已不存在", back: "请删除这张卡", anchor: "-" };
    const options = q.options ? Object.entries(q.options).map(([k, v]) => `${k}. ${v}`).join("\n") : "";
    const verify = q.verify || {};
    const answerLine = String(q.answer || "").trim() ? `正确答案：${q.answer}` : "答案存疑，见说明";
    const backParts = [answerLine];
    if (verify.note) backParts.push(verify.note);
    if (verify.excerpt) backParts.push(verify.excerpt);
    return {
      front: `${q.stem || "（无题干）"}\n${options}`,
      back: backParts.join("\n"),
      anchor: verify.anchor || q.anchor || "-"
    };
  }
  const base = app.derived.cardById.get(card.id);
  if (!base) return { front: "骨架卡数据缺失", back: "请检查 data/cards.json", anchor: "-" };
  return {
    front: base.q,
    back: base.a,
    anchor: base.anchor || "-"
  };
}

function reviewRichText(text) {
  return escapeHtml(text).replace(/\n/g, "<br>");
}

function reviewDueCount(today) {
  const dueIds = getReviewQueue(today).map((card) => card.id);
  const session = app.ui.review;
  if (session && session.sessionDate === today && Array.isArray(session.order) && session.order.length) {
    app.ui.review = reconcileReviewSession(session, today, dueIds, app.state.cards);
    const remaining = countReviewRemaining(app.ui.review, today, app.state.cards);
    if (remaining != null) return remaining;
  }
  return dueIds.length;
}

function applyReviewGrade(card, action, today) {
  let next;
  if (action === "remember") {
    next = nextCardRemember(card, today);
    if (shouldClearWrongCard(next, today)) {
      next = { ...next, cleared: true, clearedAt: today };
    }
  } else {
    next = nextCardForget(card, today);
  }
  if (next && Object.prototype.hasOwnProperty.call(next, "intro")) delete next.intro;
  return next;
}

function reviewUndoHtml() {
  if (!app.ui.review || !app.ui.review.lastUndo) return "";
  return `<button id="review-undo" class="review-undo" type="button">撤销上一张</button>`;
}

function bindReviewButton(id, handler) {
  const button = document.getElementById(id);
  if (!button) return;
  button.addEventListener("click", () => {
    if (Date.now() < app.ui.reviewArmedAt) return;
    const group = button.closest(".review-actions, .review-meta") || button;
    group.querySelectorAll("button").forEach((el) => {
      el.disabled = true;
    });
    handler();
  });
}

function gradeCurrentReview(action) {
  const session = app.ui.review;
  const today = shanghaiToday();
  if (!session || !session.currentId) return;
  if (action === "blank" && session.phase !== "front") return;
  if ((action === "remember" || action === "wrong") && session.phase !== "checking") return;
  const id = session.currentId;
  if (!app.state.cards[id]) return;
  const result = gradeReview(session, app.state.cards, today, action, applyReviewGrade);
  if (!result.card) return;
  let cardToSave = result.card;
  if (app.ui.reviewHint && app.ui.reviewHint.cardId === id && app.ui.reviewHint.used) {
    cardToSave = { ...result.card, hint: true };
  }
  if (action !== "blank") app.ui.reviewHint = null;
  app.ui.review = result.session;
  app.sync.sessionReviews += 1;
  store.save(`cards/${id}`, cardToSave);
  render();
}

function undoCurrentReview() {
  const result = undoReview(app.ui.review);
  if (!result.card || !result.session || !result.session.currentId) return;
  const id = result.session.currentId;
  app.ui.review = result.session;
  app.ui.reviewHint = null;
  if (app.sync.sessionReviews > 0) app.sync.sessionReviews -= 1;
  const keepIntroStamp = !!(result.card && result.card.intro);
  store.save(`cards/${id}`, result.card, keepIntroStamp ? { keepUpdatedAt: true } : undefined);
  render();
}

function chunkForCardId(cardId) {
  for (const index of Object.values(app.study.indexes || {})) {
    for (const chunk of (index && index.chunks) || []) {
      if (chunk && Array.isArray(chunk.cards) && chunk.cards.includes(cardId)) return chunk;
    }
  }
  return null;
}

function skeletonUnit(cardId) {
  const base = app.derived.cardById.get(cardId);
  if (base && base.unit) return base.unit;
  const matched = String(cardId || "").match(/U\d+/);
  return matched ? matched[0] : "";
}

function anchorParagraph(meta, anchor) {
  if (!meta) return { status: "loading" };
  const state = app.study.bodyState[meta.id];
  const body = app.study.bodies[meta.id];
  if (!body) {
    if (state === "missing" || state === "error") return { status: "missing" };
    return { status: "loading" };
  }
  const blockId = anchorBlockId(anchor);
  const block = (body.blocks || []).find((item) => Number(item.id) === Number(blockId));
  if (!block) return { status: "missing" };
  const text = markdownPlain(block.md);
  if (!text) return { status: "missing" };
  return { status: "ready", text, blockId };
}

function prepareSkeletonSource(cardId) {
  const unit = skeletonUnit(cardId);
  if (unit) kickUnitIndex(unit);
  const meta = chunkForCardId(cardId);
  if (meta && canReadRepo()) kickChunkBody(meta);
  return meta;
}

function skeletonAnswerExtra(cardId, base) {
  const why = base && base.why ? String(base.why) : "";
  const whyBasis = base && base.whyBasis;
  const whyHtml = why
    ? `<p id="review-why">为什么：${escapeHtml(why)}${whyBasis === "推理" ? ` <span class="small">推理，教材未明说</span>` : ""}</p>`
    : "";
  const meta = prepareSkeletonSource(cardId);
  const indexState = app.study.indexState[skeletonUnit(cardId)];
  let quoteHtml = "";
  if (!meta && indexState !== "missing" && indexState !== "error" && indexState !== "ready") {
    quoteHtml = `<p class="small" id="review-source-quote">正在读取原句…</p>`;
  } else if (meta) {
    const para = anchorParagraph(meta, base && base.anchor);
    if (para.status === "ready") {
      quoteHtml = `<div class="review-quote" id="review-source-quote"><p class="small">教材原句</p><p>${escapeHtml(para.text)}</p></div>`;
    } else if (para.status === "loading") {
      quoteHtml = `<p class="small" id="review-source-quote">正在读取原句…</p>`;
    }
  }
  return `${whyHtml}${quoteHtml}<button id="review-source" class="btn btn-secondary tap-target" type="button">看原文</button>`;
}

function openSkeletonFromReview(cardId) {
  const meta = prepareSkeletonSource(cardId);
  const base = app.derived.cardById.get(cardId);
  if (!meta) {
    const unit = skeletonUnit(cardId);
    const state = unit && app.study.indexState[unit];
    if (!state || state === "loading") return;
    app.ui.reviewSourceNote = "原文暂时没读到。";
    app.ui.reviewSourceFor = cardId;
    render();
    return;
  }
  app.ui.reviewSourceNote = "";
  app.ui.kaokaoFocus = {
    chunkId: meta.id,
    blockId: anchorBlockId(base && base.anchor),
    src: ""
  };
  writeLearnMemory(meta.id, "read");
  openLearn(meta.id);
}

function openKaokaoFromReview(item) {
  const cardId = app.ui.review && app.ui.review.currentId ? app.ui.review.currentId : "";
  if (!item || !item.chunk) {
    app.ui.reviewSourceNote = item && item.src ? item.src : "这张可考句暂时没读到。";
    app.ui.reviewSourceFor = cardId;
    render();
    return;
  }
  const meta = findChunkMeta(item.chunk);
  if (!meta) {
    const unit = (String(item.id || "").match(/U\d+/) || [])[0] || "";
    if (unit) kickUnitIndex(unit);
    const state = unit && app.study.indexState[unit];
    if (!state || state === "loading") return;
    app.ui.reviewSourceNote = item.src || "";
    app.ui.reviewSourceFor = cardId;
    render();
    return;
  }
  app.ui.reviewSourceNote = "";
  app.ui.kaokaoFocus = {
    chunkId: item.chunk,
    blockId: anchorBlockId(item.anchor),
    src: item.src || ""
  };
  writeLearnMemory(item.chunk, "read");
  openLearn(item.chunk);
}

function poolIntroFrontHtml(item, tryItem) {
  const options = (item.recog && item.recog.options) || [];
  return `
    <p id="review-pool-stem">${escapeHtml((item.recog && item.recog.stem) || "")}</p>
    <ul class="option-list">
      ${options.map((text, index) => `
        <li>
          <button type="button" class="${kkOptionClass(index, item, tryItem)}" data-pool-choice="${index}" ${tryItem ? "disabled" : ""}>
            <span class="mono">${escapeHtml(String.fromCharCode(65 + index))}.</span>&nbsp;<span>${escapeHtml(text)}</span>
          </button>
        </li>`).join("")}
    </ul>`;
}

function poolIntroAnswerHtml(item, tryItem) {
  const options = (item.recog && item.recog.options) || [];
  const answerText = options[Number(item.recog && item.recog.answer)] || "";
  return `
    <p class="quiz-result ${tryItem.ok ? "ok" : "bad"}" id="review-pool-result">${tryItem.ok ? "✓ 对了" : `✗ 正确是：${escapeHtml(answerText)}`}</p>
    <p id="review-kaokao-src">原句：${escapeHtml(item.src || "")}</p>
    <p class="small" id="review-pool-why">${escapeHtml((item.recog && item.recog.why) || "")}</p>
    <button id="review-source" class="btn btn-secondary tap-target" type="button">看原文</button>`;
}

function answerPoolIntro(choiceIndex) {
  const session = app.ui.review;
  if (!session || !session.currentId) return;
  if (session.phase !== "front" && session.phase !== "pool") return;
  if (!Number.isInteger(choiceIndex)) return;
  const card = app.state.cards[session.currentId];
  if (!card || card.pool !== true || card.src !== "kaokao") return;
  const item = kaokaoItemById(card.kid);
  const options = item && item.recog && Array.isArray(item.recog.options) ? item.recog.options : [];
  if (!item || !options.length || choiceIndex < 0 || choiceIndex >= options.length) return;
  if (latestKaokaoTry(item.id, "recog")) return;
  const next = cloneReviewSession(session);
  next.phase = "pool";
  app.ui.review = next;
  const shown = app.ui.kaokaoShown && app.ui.kaokaoShown[item.id];
  recordKaokaoTry(item, {
    at: shanghaiIso(),
    level: "recog",
    choice: choiceIndex,
    ok: choiceIndex === Number(item.recog.answer),
    ms: Math.max(0, Date.now() - (shown || Date.now()))
  });
}

function advancePoolIntro() {
  const session = app.ui.review;
  const today = shanghaiToday();
  if (!session || session.phase !== "pool" || !session.currentId) return;
  const id = session.currentId;
  const card = app.state.cards[id];
  if (!card || card.pool !== true) return;
  const item = kaokaoItemById(card.kid);
  if (!item || !latestKaokaoTry(item.id, "recog")) return;
  const nextCard = { ...card, box: 0, due: addDaysYmd(today, 1), streak: 0 };
  const cards = { ...app.state.cards, [id]: nextCard };
  const advanced = advanceReview(session, cards, today);
  advanced.lastUndo = null;
  app.ui.review = advanced;
  store.save(`cards/${id}`, nextCard);
}

function renderReview(today) {
  const root = document.getElementById("page-review");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  if (app.ui.tab !== "review") return;
  ensureKaokaoLoaded(today);
  releasePoolCards(today);

  const dueIds = getReviewQueue(today).map((card) => card.id);
  const session = reconcileReviewSession(app.ui.review, today, dueIds, app.state.cards);
  app.ui.review = session;
  const undo = reviewUndoHtml();
  const stats = session.stats || emptyReviewStats();

  if (!session.currentId) {
    root.innerHTML = `
      <h1 class="h1">复习</h1>
      <section class="panel">
        ${undo ? `<div class="review-meta"><span></span>${undo}</div>` : ""}
        <div class="empty">
          <p>今天复习完了：答对 ${stats.remember} 张，答错 ${stats.wrong} 张，没印象 ${stats.blank} 张。明天到期 ${getTomorrowDueCount(today)} 张。</p>
        </div>
      </section>
    `;
    bindReviewButton("review-undo", undoCurrentReview);
    app.ui.reviewArmedAt = Date.now() + 300;
    return;
  }

  if (app.ui.reviewSourceFor && app.ui.reviewSourceFor !== session.currentId) {
    app.ui.reviewSourceNote = "";
    app.ui.reviewSourceFor = "";
  }
  const stored = app.state.cards[session.currentId];
  const card = stored ? { id: session.currentId, ...stored } : { id: session.currentId, src: "skeleton" };
  const kkItem = card.src === "kaokao" ? kaokaoItemById(card.kid) : null;
  const content = card.src === "kaokao" ? null : reviewCardContent(card);
  const showAnswer = session.phase === "checking" || session.phase === "revealed";
  const index = session.order.indexOf(session.currentId);
  const position = index >= 0 ? index + 1 : 1;
  const hintUsed = !!(app.ui.reviewHint && app.ui.reviewHint.cardId === card.id && app.ui.reviewHint.used);
  if (card.src !== "kaokao" && card.src !== "wrong") prepareSkeletonSource(card.id);
  const poolOptions = kkItem && kkItem.recog && Array.isArray(kkItem.recog.options) ? kkItem.recog.options : [];
  const poolFirst = card.pool === true && card.src === "kaokao" && !latestKaokaoTry(card.kid, "recog");
  const poolReady = poolFirst && poolOptions.length > 0;
  const poolTry = session.phase === "pool" ? latestKaokaoTry(card.kid, "recog") : null;
  const poolAnswered = !!(poolTry && kkItem && card.pool === true && card.src === "kaokao" && poolOptions.length > 0);
  if (poolReady) {
    if (!app.ui.kaokaoShown) app.ui.kaokaoShown = {};
    if (!app.ui.kaokaoShown[kkItem.id]) app.ui.kaokaoShown[kkItem.id] = Date.now();
  }
  const srcTag = (poolReady || poolAnswered || (poolFirst && !kkItem))
    ? `<p class="review-src" id="review-src-tag">新句子</p>`
    : card.src === "kaokao"
      ? `<p class="review-src" id="review-src-tag">小测里的句子</p>`
      : card.src === "wrong"
        ? ""
        : `<p class="review-src" id="review-src-tag">教材要点</p>`;
  let poolHold = false;
  let frontHtml = "";
  if (poolReady || poolAnswered) {
    frontHtml = poolIntroFrontHtml(kkItem, poolAnswered ? poolTry : null);
  } else if (card.src === "kaokao") {
    if (!kkItem) {
      const unit = (String(card.kid || "").match(/U\d+/) || [])[0] || "";
      const state = unit && app.study.kaokaoState[unit];
      const missing = state === "missing" || state === "error";
      frontHtml = `<p>${missing ? "这张可考句暂时没读到。" : "正在读取可考句…"}</p>`;
      if (poolFirst && !missing) poolHold = true;
    } else {
      frontHtml = `<p id="review-cloze">${clozeHtml(kkItem.cloze && kkItem.cloze.text)}</p>`;
      if (hintUsed) frontHtml += `<p class="small" id="review-hint-text">${escapeHtml((kkItem.cloze && kkItem.cloze.hint) || "")}</p>`;
      else if (session.phase === "front") frontHtml += `<div class="button-row"><button id="review-hint" class="btn btn-secondary tap-target" type="button">提示</button></div>`;
    }
  } else {
    frontHtml = `<p>${reviewRichText(content.front)}</p>`;
  }
  let answerHtml = "";
  if (poolAnswered) {
    answerHtml = poolIntroAnswerHtml(kkItem, poolTry);
    if (app.ui.reviewSourceNote) answerHtml += `<p id="review-source-note">${escapeHtml(app.ui.reviewSourceNote)}</p>`;
  } else if (showAnswer && card.src === "kaokao") {
    if (kkItem) {
      const filled = fillCloze(kkItem.cloze && kkItem.cloze.text, kkItem.cloze && kkItem.cloze.answers);
      answerHtml = `<section class="panel" id="review-kaokao-answer">
        <p id="review-kaokao-src">原句：${escapeHtml(kkItem.src || "")}</p>
        <p>${escapeHtml(filled)}</p>
        <p class="small">${escapeHtml((kkItem.recog && kkItem.recog.why) || "")}</p>
        <button id="review-source" class="btn btn-secondary tap-target" type="button">看原文</button>
        ${app.ui.reviewSourceNote ? `<p id="review-source-note">${escapeHtml(app.ui.reviewSourceNote)}</p>` : ""}
      </section>`;
    } else if (app.ui.reviewSourceNote) {
      answerHtml = `<section class="panel"><p id="review-source-note">${escapeHtml(app.ui.reviewSourceNote)}</p></section>`;
    }
  } else if (showAnswer && card.src !== "wrong") {
    const base = app.derived.cardById.get(card.id);
    answerHtml = `<section class="panel" id="review-skeleton-answer">
      <p>${reviewRichText(content.back)}</p>
      ${anchorPrintedHtml(content.anchor)}
      ${skeletonAnswerExtra(card.id, base)}
      ${app.ui.reviewSourceNote ? `<p id="review-source-note">${escapeHtml(app.ui.reviewSourceNote)}</p>` : ""}
    </section>`;
  } else if (showAnswer) {
    answerHtml = `<section class="panel"><p>${reviewRichText(content.back)}</p>${anchorPrintedHtml(content.anchor)}</section>`;
  }
  const mark = session.phase === "revealed" ? `<p class="review-mark">已记为没印象，明天会再出现。</p>` : "";
  let actions = "";
  if (poolAnswered) {
    actions = `
      <div class="review-actions">
        <button id="review-pool-next" class="btn btn-primary tap-target" type="button">下一张</button>
      </div>`;
  } else if (poolReady || poolHold) {
    actions = "";
  } else if (session.phase === "checking") {
    actions = `
      <p class="small review-hint">和你心里的答案一样吗？</p>
      <div class="review-actions">
        <button id="review-remember" class="btn btn-ok" type="button">答对了</button>
        <button id="review-wrong" class="btn btn-bad" type="button">答错了</button>
      </div>`;
  } else if (session.phase === "revealed") {
    actions = `
      <div class="review-actions">
        <button id="review-next" class="btn btn-primary" type="button">下一张</button>
      </div>`;
  } else {
    actions = `
      <p class="small review-hint">先在心里答一遍。</p>
      <div class="review-actions">
        <button id="review-blank" class="btn btn-bad" type="button">没印象</button>
        <button id="review-show" class="btn btn-primary" type="button">想好了，看答案</button>
      </div>`;
  }

  root.innerHTML = `
    <h1 class="h1">复习</h1>
    <section class="panel">
      <div class="review-meta">
        <p class="small mono">第 ${position} / ${session.order.length} 张</p>
        ${poolAnswered ? "" : undo}
      </div>
      <article class="review-card" data-phase="${session.phase}" data-src="${escapeHtml(card.src || "skeleton")}">
        ${srcTag}
        ${mark}
        ${frontHtml}
        ${answerHtml}
        ${actions}
      </article>
    </section>
  `;

  root.querySelectorAll("[data-pool-choice]").forEach((button) => {
    button.addEventListener("click", () => {
      if (button.disabled) return;
      if (Date.now() < app.ui.reviewArmedAt) return;
      root.querySelectorAll("[data-pool-choice]").forEach((el) => { el.disabled = true; });
      answerPoolIntro(Number(button.dataset.poolChoice));
    });
  });
  bindReviewButton("review-pool-next", advancePoolIntro);
  bindReviewButton("review-hint", () => {
    app.ui.reviewHint = { cardId: session.currentId, used: true };
    render();
  });
  bindReviewButton("review-source", () => {
    const current = app.state.cards[session.currentId];
    if (current && current.src === "kaokao") {
      openKaokaoFromReview(kaokaoItemById(current.kid));
      return;
    }
    openSkeletonFromReview(session.currentId);
  });
  bindReviewButton("review-blank", () => gradeCurrentReview("blank"));
  bindReviewButton("review-show", () => {
    const current = app.ui.review;
    if (!current || current.phase !== "front") return;
    app.ui.review = revealReviewAnswer(current);
    render();
  });
  bindReviewButton("review-remember", () => gradeCurrentReview("remember"));
  bindReviewButton("review-wrong", () => gradeCurrentReview("wrong"));
  bindReviewButton("review-next", () => {
    const current = app.ui.review;
    if (!current || current.phase !== "revealed") return;
    app.ui.review = advanceReview(current, app.state.cards, today);
    render();
  });
  bindReviewButton("review-undo", undoCurrentReview);
  app.ui.reviewArmedAt = Date.now() + 300;
}

function renderMap() {
  const root = document.getElementById("page-map");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  ensureMapWeekOpen();
  const rows = app.data.map.rows;
  const total = rows.length;
  const count0 = rows.filter((r) => getSectionStatus(r.id) === 0).length;
  const count1 = rows.filter((r) => getSectionStatus(r.id) === 1).length;
  const count2 = rows.filter((r) => getSectionStatus(r.id) === 2).length;
  const count3 = rows.filter((r) => getSectionStatus(r.id) === 3).length;
  const missing = rows.filter((r) => !r.unit);
  root.innerHTML = `
    <h1 class="h1">地图</h1>
    <section class="panel">
      <div class="map-toolbar">
        <button id="map-view-unit" class="btn ${app.ui.mapView === "unit" ? "btn-primary" : "btn-secondary"} tap-target">按单元</button>
        <button id="map-view-book" class="btn ${app.ui.mapView === "book" ? "btn-primary" : "btn-secondary"} tap-target">按书</button>
      </div>
      <p class="small">总行数 ${total}；未学 ${count0} / 学过 ${count1} / 做过题 ${count2} / 达标 ${count3}</p>
      ${missing.length === 0 ? `<p class="small">没有遗漏：${total} 行全部有归属</p>` : `<p class="small danger">缺少 unit 归属：${missing.map((m) => m.id).join("，")}</p>`}
    </section>
    <section id="map-groups" class="panel"></section>
  `;

  document.getElementById("map-view-unit").addEventListener("click", () => {
    app.ui.mapView = "unit";
    render();
  });
  document.getElementById("map-view-book").addEventListener("click", () => {
    app.ui.mapView = "book";
    render();
  });

  const groups = document.getElementById("map-groups");
  if (app.ui.mapView === "unit") {
    groups.innerHTML = app.data.schedule.units.filter((u) => u.id !== "CASE").map((u) => {
      const rowsForUnit = app.derived.unitRows.get(u.id) || [];
      const prog = unitProgress(u.id);
      const segs = statusSegments(rowsForUnit);
      const isOpen = app.ui.openUnits.has(u.id);
      if (isOpen) kickUnitIndex(u.id);
      const lectureCount = unitLectureCount(u.id);
      const lectureNote = lectureCount > 0 ? ` · ${lectureCount} 篇精讲` : "";
      return `
        <section class="group">
          <button class="group-head tap-target" data-open-unit="${u.id}">
            <strong>${u.id} · ${u.name}</strong>
            <span class="small">第 ${u.week_from || "-"}~${u.week_to || "-"} 周 · ${prog.done}/${prog.total}${lectureNote}</span>
            <span class="segbar" aria-hidden="true">
              <span class="seg-0" style="width:${segs[0]}%"></span>
              <span class="seg-1" style="width:${segs[1]}%"></span>
              <span class="seg-2" style="width:${segs[2]}%"></span>
              <span class="seg-3" style="width:${segs[3]}%"></span>
            </span>
          </button>
          ${isOpen ? `<ul class="row-list">${rowsForUnit.map(renderMapRow).join("")}</ul>` : ""}
        </section>
      `;
    }).join("");
  } else {
    const byBook = new Map();
    for (const row of rows) {
      if (!byBook.has(row.book)) byBook.set(row.book, []);
      byBook.get(row.book).push(row);
    }
    groups.innerHTML = [...byBook.entries()].map(([book, list]) => {
      const isOpen = app.ui.openBooks.has(book);
      return `
        <section class="group">
          <button class="group-head tap-target" data-open-book="${book}">
            <strong>${bookName(book)}</strong>
            <span class="small">${list.length} 行</span>
          </button>
          ${isOpen ? `<ul class="row-list">${list.map(renderMapRow).join("")}</ul>` : ""}
        </section>
      `;
    }).join("");
  }

  groups.querySelectorAll("[data-open-unit]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.openUnit;
      if (app.ui.openUnits.has(id)) app.ui.openUnits.delete(id);
      else {
        app.ui.openUnits.add(id);
        kickUnitIndex(id);
      }
      render();
    });
  });
  groups.querySelectorAll("[data-open-book]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.openBook;
      if (app.ui.openBooks.has(id)) app.ui.openBooks.delete(id); else app.ui.openBooks.add(id);
      render();
    });
  });
  groups.querySelectorAll("[data-lecture-url]").forEach((tag) => {
    tag.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      openLecture(tag.getAttribute("data-lecture-url"));
    });
  });
  groups.querySelectorAll("[data-row-lamp]").forEach((btn) => {
    btn.addEventListener("click", (event) => {
      if (event.target.closest("[data-lecture-url]")) return;
      const rowId = btn.dataset.rowLamp;
      const next = (getSectionStatus(rowId) + 1) % 4;
      setSectionStatus(rowId, next);
      if (shouldActivateSkeletons(hasToken(), app.sync.initialPullSettled)) {
        ensureSkeletonActivation(shanghaiToday());
      }
    });
  });
  groups.querySelectorAll("[data-toggle-chunks]").forEach((btn) => {
    btn.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      const id = btn.dataset.toggleChunks;
      if (app.ui.openRows.has(id)) app.ui.openRows.delete(id);
      else app.ui.openRows.add(id);
      render();
    });
  });
  groups.querySelectorAll("[data-chunk-open]").forEach((btn) => {
    btn.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      openLearn(btn.dataset.chunkOpen);
    });
  });
}

function statusSegments(rows) {
  const counts = [0, 0, 0, 0];
  for (const row of rows) {
    const status = getSectionStatus(row.id);
    if (status >= 0 && status <= 3) counts[status] += 1;
  }
  const total = rows.length || 1;
  return counts.map((count) => (count / total) * 100);
}

function renderMapChunk(chunk) {
  const done = chunkDone(chunk.id);
  const mark = done
    ? `<span class="chunk-mark is-done" aria-hidden="true">✓</span>`
    : `<span class="chunk-mark is-todo" aria-hidden="true"></span>`;
  const questions = Array.isArray(chunk.questions) ? chunk.questions.length : 0;
  const minutes = chunkEstMinutes(chunk);
  const lecture = lecturesForChunk(chunk)[0];
  const tag = lecture
    ? `<button type="button" class="tag lecture-tag map-chunk-lecture" data-lecture-url="${escapeHtml(lecture.url)}">精讲</button>`
    : "";
  return `
    <li class="map-chunk">
      <button type="button" class="map-chunk-open" data-chunk-open="${escapeHtml(chunk.id)}">
        ${mark}
        <span class="map-chunk-copy">
          <span class="map-chunk-title">${escapeHtml(chunk.title || chunk.id)}</span>
          <span class="map-chunk-meta">${minutes} 分钟 · ${questions} 题</span>
        </span>
      </button>
      ${tag}
    </li>
  `;
}

function renderMapRow(row) {
  const status = getSectionStatus(row.id);
  const sectionName = row.section ? `§${row.section}` : "导言";
  const chapter = row.chapter_title || row.part_title || "";
  const owned = chunksOwnedByRow(row.id);
  const lecture = unitChunkIndexLoaded(row.unit) ? null : lectureForRow(row.id);
  const lectureTag = lecture
    ? `<span class="tag lecture-tag" data-lecture-url="${escapeHtml(lecture.url)}">精讲</span>`
    : "";
  const stats = rowChunkStats(row.id);
  const chunkLabel = stats ? `<span class="map-chunk-count mono">${stats.done}/${stats.total} 块</span>` : "";
  const open = app.ui.openRows.has(row.id);
  const toggle = owned.length
    ? `<button type="button" class="map-chunks-toggle" data-toggle-chunks="${escapeHtml(row.id)}" aria-expanded="${open ? "true" : "false"}">块 ▾</button>`
    : "";
  const chunks = open && owned.length
    ? `<ul class="map-chunk-list">${owned.map(renderMapChunk).join("")}</ul>`
    : "";
  return `
    <li class="map-section">
      <div class="map-row-line">
        <button type="button" class="map-row" data-row-lamp="${row.id}">
          <span class="lamp lamp-${status}" aria-hidden="true"></span>
          <span class="tag">${row.subject}</span>
          <span class="map-row-main">${chapter} · ${sectionName} · ${row.title}</span>
          ${lectureTag}
          ${chunkLabel}
          <span class="map-row-page mono">印刷页 ${row.printed_start}</span>
        </button>
        ${toggle}
      </div>
      ${chunks}
    </li>
  `;
}

function renderWeek(today, weekCtx) {
  const root = document.getElementById("page-week");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  if (!weekCtx.week) {
    root.innerHTML = `<h1 class="h1">本周</h1><p class="small">当前没有可复盘的一周。</p>`;
    return;
  }
  const week = weekCtx.week;
  const units = week.units || [];
  const weekQuestions = app.data.questions.questions.filter((q) => units.includes(q.unit) && q.verify?.status !== "doubt");
  const attemptedQids = new Set();
  let totalTries = 0;
  let correctTries = 0;
  const wrongFirstWeek = new Set();

  for (const q of weekQuestions) {
    const tries = getAttempt(q.id).tries || [];
    let hadWrongBefore = false;
    for (const tr of tries) {
      if (!tr.ok) {
        const day = String(tr.at).slice(0, 10);
        if (day < week.start) hadWrongBefore = true;
      }
    }
    for (const tr of tries) {
      if (tryInRange(tr, week.start, week.end)) {
        attemptedQids.add(q.id);
        totalTries += 1;
        if (tr.ok) correctTries += 1;
        if (!tr.ok && !hadWrongBefore) wrongFirstWeek.add(q.id);
      }
    }
  }

  const clearedCount = Object.values(app.state.cards).filter((card) => card.src === "wrong" && card.cleared && card.clearedAt && card.clearedAt >= week.start && card.clearedAt <= week.end).length;
  const backlog = Object.values(app.state.cards).filter((card) => card.src === "wrong" && !card.cleared).length;
  const rate = totalTries ? Math.round((correctTries / totalTries) * 100) : 0;
  const weekDoc = app.state.weeks[week.start] || { good: "", bad: "", next: "" };

  root.innerHTML = `
    <h1 class="h1">本周</h1>
    <section class="panel">
      <p>${Number.isInteger(week.index) ? `第 ${week.index} 周` : "当前周"} · ${formatUnitNames(units)}</p>
      <p class="small">做了 ${attemptedQids.size} 题，正确率 ${rate}% ，新增错题 ${wrongFirstWeek.size} ，清掉错题 ${clearedCount} ，错题积压 ${backlog}</p>
    </section>
    <section class="panel">
      <label for="week-good" class="label">这周什么管用</label>
      <textarea id="week-good" class="textarea">${weekDoc.good || ""}</textarea>
      <label for="week-bad" class="label">这周什么不管用</label>
      <textarea id="week-bad" class="textarea">${weekDoc.bad || ""}</textarea>
      <label for="week-next" class="label">下周改什么</label>
      <textarea id="week-next" class="textarea">${weekDoc.next || ""}</textarea>
      <p class="small">自动保存。</p>
      <div class="button-row">
        <button id="week-submit" class="btn ${weekDoc.submittedAt ? "btn-secondary" : "btn-primary"} tap-target" ${weekDoc.submittedAt ? "disabled" : ""}>交作业</button>
      </div>
      <p class="small">${weekDoc.submittedAt ? `已交：${weekDoc.submittedAt}` : "未交"}。周日交，Claude 会来验收。</p>
    </section>
  `;

  const saveWeekDebounced = () => {
    clearTimeout(app.ui.weekTimer);
    app.ui.weekTimer = setTimeout(() => {
      const next = {
        ...(app.state.weeks[week.start] || {}),
        good: document.getElementById("week-good").value.trim(),
        bad: document.getElementById("week-bad").value.trim(),
        next: document.getElementById("week-next").value.trim()
      };
      store.save(`weeks/${week.start}`, next);
    }, 900);
  };

  ["week-good", "week-bad", "week-next"].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener("input", saveWeekDebounced);
    el.addEventListener("blur", () => {
      const next = {
        ...(app.state.weeks[week.start] || {}),
        good: document.getElementById("week-good").value.trim(),
        bad: document.getElementById("week-bad").value.trim(),
        next: document.getElementById("week-next").value.trim()
      };
      store.save(`weeks/${week.start}`, next);
    });
  });

  const submitBtn = document.getElementById("week-submit");
  submitBtn.addEventListener("click", () => {
    const todayStamp = shanghaiToday();
    const next = {
      ...(app.state.weeks[week.start] || {}),
      good: document.getElementById("week-good").value.trim(),
      bad: document.getElementById("week-bad").value.trim(),
      next: document.getElementById("week-next").value.trim(),
      submittedAt: `${todayStamp} 23:59`
    };
    store.save(`weeks/${week.start}`, next);
    requestPush("submit");
  });
}

function renderPlan(today, weekCtx) {
  const root = document.getElementById("page-plan");
  if (!app.data) {
    root.innerHTML = `<p class="small">正在读取学习数据...</p>`;
    return;
  }
  const rows = app.data.schedule.weeks.map((w) => {
    const names = formatUnitNames(w.units || []);
    const caseTitle = w.case ? app.derived.rowById.get(w.case)?.title || w.case : "";
    const isCurrent = weekCtx.week?.start === w.start;
    const isPast = today > w.end;
    let progressText = "";
    if (isPast && w.units && w.units.length) {
      const allRows = w.units.flatMap((u) => app.derived.unitRows.get(u) || []);
      const done = allRows.filter((r) => getSectionStatus(r.id) >= 1).length;
      progressText = `${done}/${allRows.length} 节`;
    }
    const weekName = w.kind === "buffer" ? "机动周" : `第 ${w.index} 周`;
    return `
      <div class="week-row ${isCurrent ? "current" : ""} ${w.kind === "buffer" ? "buffer" : ""}">
        <div class="week-dates"><span class="mono">${w.start} ~ ${w.end}</span> <span class="small">${weekName}</span></div>
        <div class="week-unit">${names || w.note || "复习 / 清错题"}${progressText ? ` <span class="small mono">${progressText}</span>` : ""}</div>
        <div class="week-case">${caseTitle || "—"}</div>
      </div>
    `;
  }).join("");
  root.innerHTML = `
    <h1 class="h1">排程</h1>
    <section class="panel">
      <div class="timeline">${rows}</div>
    </section>
    <section class="panel">
      <p><strong>强化期（2027-06～08）</strong>：专题刷题、易混数值反复背，案例每周 2～3 道且必须动笔写。</p>
      <p><strong>冲刺期（2027-09～11）</strong>：每 1～2 周一套三科计时模拟，清错题，只复习薄弱卡。</p>
    </section>
  `;
}

function renderNav() {
  const tab = app.ui.tab;
  document.querySelectorAll("[data-tab-link]").forEach((link) => {
    const on = link.dataset.tabLink === tab;
    link.classList.toggle("active", on);
  });
}

function renderPages() {
  const tab = app.ui.tab;
  VALID_TABS.concat(["learn"]).forEach((name) => {
    const el = document.getElementById(`page-${name}`);
    if (el) el.hidden = tab !== name;
  });
}

function render() {
  const route = hashRoute();
  app.ui.tab = route.tab;
  app.ui.routeChunkId = route.chunkId;
  document.body.classList.toggle("is-learn", route.tab === "learn");
  renderPages();
  renderNav();
  renderSettings();
  const today = shanghaiToday();
  if (!app.data) {
    document.getElementById("status-center").textContent = "加载中";
    const countdown = document.getElementById("exam-countdown");
    if (countdown) countdown.innerHTML = `距考试 <span class="mono">--</span> 天`;
    renderSyncStatus();
    renderToday(today, { phase: "pre", week: null, weekLabel: "加载中", units: [] });
    renderLearn();
    return;
  }
  if (shouldActivateSkeletons(hasToken(), app.sync.initialPullSettled)) {
    ensureSkeletonActivation(today);
  }
  const weekCtx = getWeekContext(today);
  renderStatusBar(today, weekCtx);
  renderToday(today, weekCtx);
  renderPractice(today, weekCtx);
  renderReview(today);
  renderMap();
  renderWeek(today, weekCtx);
  renderPlan(today, weekCtx);
  renderLearn();
}

function knownHash(hash) {
  let key = String(hash || "").replace(/^#/, "");
  try { key = decodeURIComponent(key); } catch (_) {}
  return VALID_TABS.includes(key) || key.startsWith("learn-");
}

function wireRouting() {
  window.addEventListener("hashchange", () => {
    if (!knownHash(location.hash)) {
      location.hash = "#today";
      return;
    }
    render();
  });
  const syncStatus = document.getElementById("sync-status");
  if (syncStatus) {
    syncStatus.addEventListener("click", () => {
      if ((location.hash || "") !== "#settings") location.hash = "#settings";
      else render();
    });
  }
  document.addEventListener("visibilitychange", () => {
    if (!hasToken()) return;
    if (document.visibilityState === "hidden") {
      if (app.sync.dirty || app.sync.phase === "dirty" || app.sync.phase === "error") requestPush("background");
    } else {
      requestPull();
    }
  });
}

async function boot() {
  app.githubConfig = loadGithubConfig();
  loadSyncMeta();
  loadStateFromLocal();
  loadQaModule();
  app.sync.initialPullSettled = !hasToken();
  app.sync.phase = hasToken() ? "syncing" : "disconnected";
  if (!knownHash(location.hash)) {
    location.hash = "#today";
  }
  app.ui.tab = hashRoute().tab;
  wireRouting();
  onChange(() => render());
  render();

  try {
    const [map, schedule, cards, questions, lectures] = await Promise.all([
      fetchJson("data/map.json", "data/map.json"),
      fetchJson("data/schedule.json", "data/schedule.json"),
      fetchJson("data/cards.json", "data/cards.json"),
      fetchJson("data/questions.json", "data/questions.json"),
      loadLectureIndex()
    ]);
    app.data = { map, schedule, cards, questions };
    app.lectures = lectures;
    buildIndexes();
    render();
  } catch (err) {
    app.error = err.message || "读不到数据文件，请让 Claude 重新发布";
    render();
  }

  registerServiceWorker();
  initialSync();
}

boot();
