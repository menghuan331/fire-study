function shanghaiParts(ms) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Shanghai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date(ms));
  const get = (type) => {
    const found = parts.find((part) => part.type === type);
    return found ? found.value : "";
  };
  return { y: get("year"), m: get("month"), d: get("day"), h: get("hour"), min: get("minute") };
}

function formatHm(ms) {
  const p = shanghaiParts(ms);
  return `${p.h}:${p.min}`;
}

function formatStamp(ms) {
  const p = shanghaiParts(ms);
  return `${p.y}-${p.m}-${p.d} ${p.h}:${p.min}`;
}

function shanghaiIso(date = new Date()) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Shanghai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(date);
  const get = (type) => {
    const found = parts.find((part) => part.type === type);
    return found ? found.value : "00";
  };
  return `${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}:${get("second")}+08:00`;
}

function lastSyncLabel() {
  if (!app.sync.lastSyncAt) return "上次同步：还没有";
  return `上次同步：${formatStamp(app.sync.lastSyncAt)}`;
}

function renderSyncStatus() {
  const el = document.getElementById("sync-status");
  if (el) {
    if (!hasToken()) el.textContent = "未连接 GitHub";
    else if (app.sync.phase === "syncing") el.textContent = "同步中…";
    else if (app.sync.phase === "error") el.textContent = `同步失败：${app.sync.errorText || "同步失败"}`;
    else if (app.sync.dirty || app.sync.phase === "dirty") el.textContent = "有改动未同步";
    else if (app.sync.lastSyncAt) el.textContent = `已同步 ${formatHm(app.sync.lastSyncAt)}`;
    else el.textContent = "有改动未同步";
  }
  const last = document.getElementById("settings-last-sync");
  if (last) last.textContent = lastSyncLabel();
}

function mapSyncError(err) {
  if (err && err.network) return "网络不通，稍后自动重试";
  const status = err && err.status;
  if (status === 401) return "令牌无效或过期";
  if (status === 403 || status === 404) return "令牌没有这个仓库的权限";
  if (status === 422) return "远端有新提交";
  if (err && err.code === "no-token") return "还没有令牌";
  if (err && err.message && err.message.length <= 24 && !/bearer|token|ghp_|github_pat/i.test(err.message)) return err.message;
  return "同步失败";
}

let syncClient = null;
let syncClientKey = "";

function syncConfigKey(cfg) {
  if (!cfg) return "";
  return `${cfg.owner}\n${cfg.repo}\n${cfg.branch}\n${cfg.token}`;
}

function annotateUnits(state) {
  const source = state || {};
  const cards = {};
  for (const [id, rec] of Object.entries(source.cards || {})) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    cards[id] = { ...rec, unit: unitForCardId(id) };
  }
  const attempts = {};
  for (const [id, rec] of Object.entries(source.attempts || {})) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    attempts[id] = { ...rec, unit: unitForQuestionId(id) };
  }
  const kaokao = {};
  for (const [id, rec] of Object.entries(source.kaokao || {})) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    const matched = String(id).match(/U\d+/);
    const unit = rec.unit && /^U\d+$/.test(rec.unit) ? rec.unit : (matched ? matched[0] : "unknown");
    kaokao[id] = { ...rec, unit };
  }
  const kaokaoRetell = {};
  for (const [id, rec] of Object.entries(source.kaokaoRetell || {})) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    kaokaoRetell[id] = { ...rec, unit: unitForRetellId(id, rec) };
  }
  const doubts = {};
  for (const [id, rec] of Object.entries(source.doubts || {})) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    doubts[id] = { ...rec, unit: unitForDoubt(id, rec) };
  }
  return { ...source, cards, attempts, kaokao, kaokaoRetell, doubts };
}

function unitForDoubt(id, rec) {
  if (rec && typeof rec.unit === "string" && /^U\d+$/.test(rec.unit)) return rec.unit;
  const chunkId = rec && rec.chunk ? rec.chunk : String(id || "").split(":")[0];
  const meta = findChunkMeta(chunkId);
  if (meta && meta.unit) return meta.unit;
  return "unknown";
}

function unitForRetellId(chunkId, rec) {
  if (rec && typeof rec.unit === "string" && /^U\d+$/.test(rec.unit)) return rec.unit;
  const meta = findChunkMeta(chunkId);
  if (meta && meta.unit) return meta.unit;
  const docs = app.study && app.study.kaokao ? app.study.kaokao : {};
  for (const [unitId, doc] of Object.entries(docs)) {
    const items = doc && Array.isArray(doc.items) ? doc.items : [];
    if (items.some((item) => item && item.chunk === chunkId)) return (doc && doc.unit) || unitId;
  }
  return "unknown";
}

function getSync(cfg) {
  const config = cfg || app.githubConfig || loadGithubConfig();
  const key = syncConfigKey(config);
  if (!syncClient || syncClientKey !== key) {
    syncClientKey = key;
    syncClient = createGithubSync({
      fetch: (url, options) => fetch(url, options),
      config,
      now: () => Date.now()
    });
  }
  return syncClient;
}

function sortValue(value) {
  if (Array.isArray(value)) return value.map(sortValue);
  if (value && typeof value === "object") {
    const out = {};
    for (const key of Object.keys(value).sort()) out[key] = sortValue(value[key]);
    return out;
  }
  return value;
}

function stableStringify(value) {
  return JSON.stringify(sortValue(value), null, 2);
}

function buildCommitMessage() {
  const stamp = formatStamp(Date.now());
  if (!app.sync.countsReliable) return `进度：${stamp}`;
  return `进度：${stamp}（做题 ${app.sync.sessionAttempts}，复习 ${app.sync.sessionReviews}）`;
}

function applyMerge(remoteState) {
  const merged = mergeStates(app.state, remoteState);
  app.state = coerceState(merged, { fillStarted: true });
  saveStateToLocal();
  emitChange();
}

function adoptSyncResult(state, sha) {
  app.state = coerceState(state, { fillStarted: true });
  saveStateToLocal();
  if (sha) app.sync.remoteSha = sha;
  persistSyncMeta();
  emitChange();
}

function markSynced(touchTime) {
  app.sync.dirty = false;
  app.sync.phase = "synced";
  app.sync.errorText = "";
  if (touchTime === false) {
    if (!app.sync.lastSyncAt) app.sync.lastSyncAt = Date.now();
  } else {
    app.sync.lastSyncAt = Date.now();
  }
  app.sync.countsReliable = true;
  app.sync.sessionAttempts = 0;
  app.sync.sessionReviews = 0;
  clearTimeout(app.sync.retryTimer);
  persistSyncMeta();
  renderSyncStatus();
}

function failSync(err, isAutoRetry) {
  if (!hasToken()) {
    app.sync.phase = "disconnected";
    app.sync.errorText = "";
    renderSyncStatus();
    return;
  }
  app.sync.phase = "error";
  app.sync.errorText = mapSyncError(err);
  app.sync.dirty = true;
  renderSyncStatus();
  if (!isAutoRetry) {
    clearTimeout(app.sync.retryTimer);
    app.sync.retryTimer = setTimeout(() => {
      if (!hasToken()) return;
      enqueue(() => runPushCycle(true));
    }, 60000);
  }
}

function flushEditors() {
  const noteEl = document.getElementById("practice-note");
  const learnNoteEl = document.getElementById("learn-note");
  const noteValue = noteEl && app.ui.practiceQid ? noteEl.value.trim() : null;
  const learnNoteValue = learnNoteEl && app.ui.learnQid ? learnNoteEl.value.trim() : null;
  const goodEl = document.getElementById("week-good");
  const badEl = document.getElementById("week-bad");
  const nextEl = document.getElementById("week-next");
  const weekValues = goodEl && badEl && nextEl ? {
    good: goodEl.value.trim(),
    bad: badEl.value.trim(),
    next: nextEl.value.trim()
  } : null;
  if (noteValue != null) {
    clearTimeout(app.ui.noteTimer);
    app.ui.noteTimer = null;
    const old = getAttempt(app.ui.practiceQid);
    if ((old.note || "") !== noteValue) savePracticeNote(app.ui.practiceQid, noteValue);
  }
  if (learnNoteValue != null) {
    const old = getAttempt(app.ui.learnQid);
    if ((old.note || "") !== learnNoteValue) savePracticeNote(app.ui.learnQid, learnNoteValue);
  }
  const retellEl = document.getElementById("learn-retell");
  if (retellEl && app.ui.routeChunkId) {
    clearTimeout(app.ui.retellTimer);
    app.ui.retellTimer = null;
    const meta = findChunkMeta(app.ui.routeChunkId);
    saveKaokaoRetell(app.ui.routeChunkId, retellEl.value, meta && meta.unit, { silent: true });
  }
  flushDoubtInputs();
  if (weekValues && app.data) {
    clearTimeout(app.ui.weekTimer);
    app.ui.weekTimer = null;
    const week = getWeekContext(shanghaiToday()).week;
    if (week) {
      const prev = app.state.weeks[week.start] || {};
      if ((prev.good || "") !== weekValues.good || (prev.bad || "") !== weekValues.bad || (prev.next || "") !== weekValues.next) {
        store.save(`weeks/${week.start}`, {
          ...prev,
          good: weekValues.good,
          bad: weekValues.bad,
          next: weekValues.next
        });
      }
    }
  }
}

function notePendingFollowUp() {
  if (!(app.sync.pendingAgain && hasToken()) || app.sync.phase === "error") {
    app.sync.pendingAgain = false;
    return;
  }
  app.sync.pendingAgain = false;
  app.sync.dirty = true;
  app.sync.phase = "dirty";
  clearTimeout(app.sync.debounce);
  app.sync.debounce = setTimeout(() => requestPush("debounce"), 20000);
  renderSyncStatus();
}

async function runPushCycle(isAutoRetry) {
  if (!hasToken()) return;
  app.sync.phase = "syncing";
  app.sync.errorText = "";
  renderSyncStatus();
  try {
    flushEditors();
    app.state = coerceState(app.state, { fillStarted: true });
    const result = await getSync().push(annotateUnits(app.state), {
      message: () => buildCommitMessage(),
      readLocal() {
        flushEditors();
        app.state = coerceState(app.state, { fillStarted: true });
        return annotateUnits(app.state);
      }
    });
    adoptSyncResult(result.state, result.commitSha);
    markSynced();
  } catch (err) {
    failSync(err, isAutoRetry);
  } finally {
    notePendingFollowUp();
  }
}

async function pullOnly() {
  if (!hasToken()) {
    app.sync.initialPullSettled = true;
    return;
  }
  app.sync.phase = "syncing";
  app.sync.errorText = "";
  renderSyncStatus();
  try {
    flushEditors();
    const client = getSync();
    const pulled = await client.pull();
    app.sync.initialPullSettled = true;
    applyMerge(pulled.state);
    app.sync.remoteSha = pulled.headSha || "";
    persistSyncMeta();
    const dirty = client.changedFiles(annotateUnits(app.state)).length > 0;
    app.sync.dirty = dirty;
    if (dirty) {
      app.sync.phase = "dirty";
      renderSyncStatus();
    } else {
      markSynced(false);
    }
  } catch (err) {
    failSync(err, false);
    app.sync.initialPullSettled = true;
    if (app.data) ensureSkeletonActivation(shanghaiToday());
  } finally {
    notePendingFollowUp();
  }
}

function enqueue(task) {
  const run = app.sync.chain.then(async () => {
    app.sync.busy = true;
    try {
      await task();
    } catch (err) {
      failSync(err, false);
    } finally {
      app.sync.busy = false;
      renderSyncStatus();
    }
  });
  app.sync.chain = run.then(() => {}, () => {});
  return run;
}

function requestPush(trigger) {
  if (!hasToken()) {
    renderSyncStatus();
    return;
  }
  if (trigger !== "retry") clearTimeout(app.sync.retryTimer);
  clearTimeout(app.sync.debounce);
  enqueue(() => runPushCycle(trigger === "retry"));
}

function requestPull() {
  if (!hasToken()) return;
  clearTimeout(app.sync.retryTimer);
  enqueue(() => pullOnly());
}

function initialSync() {
  if (!hasToken()) {
    app.sync.initialPullSettled = true;
    app.sync.phase = "disconnected";
    renderSyncStatus();
    return;
  }
  app.sync.phase = "syncing";
  renderSyncStatus();
  enqueue(async () => {
    await pullOnly();
    if (app.sync.dirty && hasToken() && app.sync.phase !== "error") {
      clearTimeout(app.sync.debounce);
      app.sync.debounce = setTimeout(() => requestPush("debounce"), 20000);
    }
  });
}

async function testGithubConnection(cfg) {
  if (!cfg || !cfg.token) return "还没有令牌";
  try {
    const result = await getSync(cfg).testConnection();
    if (result && result.canPush === true) return "连接成功，可读写";
    if (result && result.canPush === false) return "能打开仓库，但没有写入权限";
    return "能打开仓库，但没有确认写入权限";
  } catch (err) {
    return mapSyncError(err);
  }
}

function wireSettings() {
  const form = document.getElementById("gh-form");
  if (form) {
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (app.ui.tokenHoldForm) return;
      const tokenEl = document.getElementById("gh-token");
      if (!tokenEl) {
        saveGithubConfig(readRepoFields());
        return;
      }
      const typed = tokenEl.value.trim();
      if (!typed) {
        app.ui.settingsTestMessage = "先粘贴令牌";
        render();
        return;
      }
      const next = readRepoFields();
      next.token = typed;
      saveGithubConfig(next);
      app.ui.tokenDeleteArmed = false;
      app.ui.settingsTestMessage = "";
      app.sync.countsReliable = false;
      app.ui.tokenHoldForm = true;
      setTimeout(() => {
        app.ui.tokenHoldForm = false;
        app.ui.tokenEditing = false;
        const active = document.activeElement;
        if (active && typeof active.blur === "function") active.blur();
        render();
        initialSync();
      }, 500);
    });
  }
  const cancelBtn = document.getElementById("settings-token-cancel");
  if (cancelBtn) {
    cancelBtn.addEventListener("click", () => {
      app.ui.tokenEditing = false;
      render();
    });
  }
  const replaceBtn = document.getElementById("settings-token-replace");
  if (replaceBtn) {
    replaceBtn.addEventListener("click", () => {
      app.ui.tokenEditing = true;
      app.ui.tokenDeleteArmed = false;
      render();
    });
  }
  const deleteBtn = document.getElementById("settings-token-delete");
  if (deleteBtn) {
    deleteBtn.addEventListener("click", () => {
      if (!app.ui.tokenDeleteArmed) {
        app.ui.tokenDeleteArmed = true;
        render();
        return;
      }
      const next = readRepoFields();
      next.token = "";
      saveGithubConfig(next);
      app.ui.tokenDeleteArmed = false;
      app.ui.tokenEditing = false;
      clearSyncTimers();
      app.sync.dirty = false;
      app.sync.phase = "disconnected";
      app.sync.errorText = "";
      renderSyncStatus();
      render();
    });
  }
  ["gh-user", "settings-repo", "settings-branch"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("change", () => {
      saveGithubConfig(readRepoFields());
    });
  });
  const testBtn = document.getElementById("settings-test");
  if (testBtn) {
    testBtn.addEventListener("click", async () => {
      const cfg = saveGithubConfig(configFromSettingsForm());
      app.ui.settingsTestMessage = "正在测试…";
      render();
      app.ui.settingsTestMessage = await testGithubConnection(cfg);
      render();
    });
  }
  const syncBtn = document.getElementById("settings-sync-now");
  if (syncBtn) {
    syncBtn.addEventListener("click", () => {
      saveGithubConfig(configFromSettingsForm());
      if (!hasToken()) {
        app.ui.settingsTestMessage = "还没有令牌";
        render();
        return;
      }
      requestPush("manual");
    });
  }
  const exportBtn = document.getElementById("settings-export");
  if (exportBtn) exportBtn.addEventListener("click", () => exportProgress());
  const importInput = document.getElementById("settings-import");
  if (importInput) {
    importInput.addEventListener("change", () => {
      const file = importInput.files && importInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const parsed = safeParse(String(reader.result || ""));
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          app.ui.importError = "这个文件不是进度 JSON";
          app.ui.importPreview = null;
          render();
          return;
        }
        const state = coerceState(parsed, { fillStarted: false });
        app.ui.importError = "";
        app.ui.importPreview = {
          attempts: Object.keys(state.attempts).length,
          cards: Object.keys(state.cards).length,
          weeks: Object.keys(state.weeks).length,
          state
        };
        render();
      };
      reader.readAsText(file);
    });
  }
  const confirmBtn = document.getElementById("settings-import-confirm");
  if (confirmBtn) {
    confirmBtn.addEventListener("click", () => {
      const preview = app.ui.importPreview;
      if (!preview || !preview.state) return;
      const merged = mergeStates(app.state, preview.state);
      app.state = coerceState(merged, { fillStarted: true });
      saveStateToLocal();
      app.ui.importPreview = null;
      app.ui.importError = "";
      app.sync.countsReliable = false;
      app.sync.dirty = true;
      emitChange();
      if (hasToken()) requestPush("manual");
      else {
        app.sync.phase = "disconnected";
        renderSyncStatus();
      }
    });
  }
}

function registerServiceWorker() {
  if (!navigator.serviceWorker) return;
  const hadController = !!navigator.serviceWorker.controller;
  let pageReady = document.readyState === "complete";
  if (!pageReady) {
    window.addEventListener("load", () => { pageReady = true; }, { once: true });
  }
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || !pageReady || swControllerReload) return;
    swControllerReload = true;
    location.reload();
  });
  navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then((registration) => {
    const check = () => registration.update().catch(() => {});
    check();
    let lastCheck = Date.now();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      const now = Date.now();
      if (now - lastCheck < 60000) return;
      lastCheck = now;
      check();
    });
  }).catch(() => {});
}

function buildIndexes() {
  const { map, schedule, questions, cards } = app.data;
  app.derived.rowById = new Map(map.rows.map((row) => [row.id, row]));
  app.derived.unitRows = new Map();
  for (const row of map.rows) {
    if (!app.derived.unitRows.has(row.unit)) app.derived.unitRows.set(row.unit, []);
    app.derived.unitRows.get(row.unit).push(row);
  }
  app.derived.unitMeta = new Map(schedule.units.map((u) => [u.id, u]));
  app.derived.unitStart = new Map();
  for (const week of schedule.weeks) {
    for (const uid of week.units || []) {
      if (!app.derived.unitStart.has(uid)) app.derived.unitStart.set(uid, week.start);
    }
  }
  app.derived.questionById = new Map(questions.questions.map((q) => [q.id, q]));
  app.derived.rowQuestions = new Map();
  for (const q of questions.questions) {
    for (const rid of q.rows || []) {
      if (!app.derived.rowQuestions.has(rid)) app.derived.rowQuestions.set(rid, []);
      app.derived.rowQuestions.get(rid).push(q.id);
    }
  }
  app.derived.cardById = new Map(cards.cards.map((c) => [c.id, c]));
}

function firstStudyUnitId() {
  const week = (app.data.schedule.weeks || []).find((item) => (item.units || []).length);
  return week?.units?.[0] || "U01";
}

function getWeekContext(today) {
  const { schedule } = app.data;
  const firstStart = schedule.start;
  if (today < firstStart) {
    const unitId = firstStudyUnitId();
    const uname = app.derived.unitMeta.get(unitId)?.name || unitId;
    const week = {
      start: addDaysYmd(firstStart, -7),
      end: addDaysYmd(firstStart, -1),
      kind: "study",
      index: 0,
      units: [unitId],
      preview: true
    };
    return {
      phase: "pre",
      week,
      weekLabel: `第 0 周 · 预习${uname}`,
      units: [unitId]
    };
  }
  for (const week of schedule.weeks) {
    if (today >= week.start && today <= week.end) {
      const unitNames = (week.units || []).map((u) => app.derived.unitMeta.get(u)?.name || u);
      const weekName = week.kind === "buffer" ? "机动周" : `第 ${week.index} 周`;
      return {
        phase: "active",
        week,
        weekLabel: `${weekName} · ${unitNames.join(" / ") || "复习"}`,
        units: week.units || []
      };
    }
  }
  const last = schedule.weeks[schedule.weeks.length - 1];
  const names = (last.units || []).map((u) => app.derived.unitMeta.get(u)?.name || u);
  return {
    phase: "post",
    week: last,
    weekLabel: `第 ${last.index || "末"} 周后 · ${names.join(" / ")}`,
    units: last.units || []
  };
}

function getSectionStatus(rowId) {
  return Number(app.state.sections[rowId] || 0);
}

function setSectionStatus(rowId, status) {
  const prev = getSectionStatus(rowId);
  if (prev === status) return;
  store.save(`sections/${rowId}`, status);
}

function unitProgress(unitId) {
  const rows = app.derived.unitRows.get(unitId) || [];
  if (!rows.length) return { total: 0, done: 0, pct: 0 };
  const done = rows.filter((r) => getSectionStatus(r.id) >= 1).length;
  return { total: rows.length, done, pct: Math.round((done / rows.length) * 100) };
}

function getAttempt(questionId) {
  return app.state.attempts[questionId] || { tries: [], note: "", err: "" };
}

function latestTry(questionId) {
  const a = getAttempt(questionId);
  return (a.tries || [])[a.tries.length - 1] || null;
}

function tryInRange(tryItem, start, end) {
  const day = String(tryItem.at || "").slice(0, 10);
  return day >= start && day <= end;
}

function getQuestionState(questionId) {
  const last = latestTry(questionId);
  if (!last) return "未做";
  return last.ok ? "答对" : "答错";
}

function getQuestionStateClass(questionId) {
  const last = latestTry(questionId);
  if (!last) return "status-pill";
  return last.ok ? "status-pill status-ok" : "status-pill status-bad";
}

let skeletonActivationLock = false;
let poolReleaseLock = false;

function ensureSkeletonActivation(today) {
  if (skeletonActivationLock) return;
  if (!shouldActivateSkeletons(hasToken(), app.sync.initialPullSettled)) return;
  if (!app.data) return;
  const active = [];
  const seen = new Set();
  const previewUnit = today < app.data.schedule.start ? firstStudyUnitId() : "";
  for (const card of app.data.cards.cards) {
    if (seen.has(card.unit)) continue;
    const unitStart = app.derived.unitStart.get(card.unit);
    const rows = app.derived.unitRows.get(card.unit) || [];
    const anyStarted = rows.some((row) => getSectionStatus(row.id) >= 1);
    const started = (previewUnit && card.unit === previewUnit)
      || (unitStart && today >= unitStart)
      || anyStarted;
    if (!started) continue;
    seen.add(card.unit);
    active.push(card.unit);
  }
  const newcomers = planSkeletonIntroductions(app.data.cards.cards, app.state.cards, today, active, 10);
  skeletonActivationLock = true;
  try {
    for (const card of newcomers) {
      store.save(`cards/${card.id}`, newSkeletonCardState(today), { keepUpdatedAt: true });
    }
  } finally {
    skeletonActivationLock = false;
  }
}

function getReviewQueue(today) {
  const all = Object.entries(app.state.cards)
    .map(([id, card]) => ({ id, ...card }))
    .filter((card) => !card.cleared && card.due && card.due <= today);
  const wrong = all.filter((c) => c.src === "wrong");
  const kaokao = all.filter((c) => c.src === "kaokao");
  const skeleton = all.filter((c) => c.src !== "wrong" && c.src !== "kaokao");
  const sorter = (a, b) => `${a.due}-${a.created || ""}`.localeCompare(`${b.due}-${b.created || ""}`);
  wrong.sort(sorter);
  kaokao.sort(sorter);
  skeleton.sort(sorter);
  return [...wrong, ...kaokao, ...skeleton].slice(0, 60);
}

function getTomorrowDueCount(today) {
  const tomorrow = addDaysYmd(today, 1);
  return Object.values(app.state.cards).filter((card) => !card.cleared && card.due === tomorrow).length;
}

function upsertWrongCard(question, today) {
  if (question.verify?.status === "doubt") return;
  const id = `WQ-${question.id}`;
  const existing = app.state.cards[id];
  if (existing) {
    const reset = nextCardForget(existing, today);
    reset.src = "wrong";
    reset.qid = question.id;
    reset.created = existing.created || today;
    store.save(`cards/${id}`, reset);
    return;
  }
  store.save(`cards/${id}`, {
    box: 0,
    due: addDaysYmd(today, 1),
    streak: 0,
    streakStart: null,
    cleared: false,
    src: "wrong",
    qid: question.id,
    created: today
  });
}

function evaluateRowsAfterAttempt(question) {
  const nonDoubtQuestions = app.data.questions.questions.filter((q) => q.verify?.status !== "doubt");
  for (const rid of question.rows || []) {
    const current = getSectionStatus(rid);
    if (current < 2) {
      setSectionStatus(rid, 2);
    }
    const rel = (app.derived.rowQuestions.get(rid) || []).map((qid) => app.derived.questionById.get(qid)).filter(Boolean).filter((q) => q.verify?.status !== "doubt");
    if (!rel.length) continue;
    const allTried = rel.every((q) => (getAttempt(q.id).tries || []).length > 0);
    const allLatestOk = rel.every((q) => latestTry(q.id)?.ok);
    if (allTried && allLatestOk) {
      setSectionStatus(rid, 3);
    }
  }
  if (!nonDoubtQuestions.length) return;
}

function savePracticeNote(questionId, text) {
  const old = getAttempt(questionId);
  const next = { ...old, note: text };

}

function setPracticeErr(questionId, errValue) {

}

function submitAnswer(question, choice) {
  const today = shanghaiToday();
  const ok = compareAnswer(choice, question.answer, question.type);
  const old = getAttempt(question.id);
  const tries = [...(old.tries || []), { at: `${today}T00:00:00+08:00`, choice, ok }];
  const next = { ...old, tries };
  store.save(`attempts/${question.id}`, next);
  evaluateRowsAfterAttempt(question);
  if (!ok) {
    upsertWrongCard(question, today);
  }
}

const STUDY_CACHE = "study-chunks-v1";
const BOOK_TITLES = {
  SWS: "消防安全技术实务（上册）",
  SWX: "消防安全技术实务（下册）",
  ZHS: "消防安全技术综合能力（上册）",
  ZHX: "消防安全技术综合能力（下册）",
  AL: "消防安全案例分析"
};

function bookTitle(code) {
  return BOOK_TITLES[code] || bookName(code) || "教材";
}

function mockRepoOn() {
  try {
    const host = location.hostname;
    if (host !== "localhost" && host !== "127.0.0.1") return false;
    return new URLSearchParams(location.search).get("mockrepo") === "1";
  } catch (_) {
    return false;
  }
}

function canReadRepo() {
  return hasToken() || mockRepoOn();
}

function studyCacheRequest(repoPath) {
  const encoded = String(repoPath || "").split("/").filter(Boolean).map((part) => encodeURIComponent(part)).join("/");
  return new Request(`https://study-chunks.local/${encoded}`);
}

async function cachedStudyResponse(repoPath) {
  try {
    if (!window.caches) return null;
    const cache = await caches.open(STUDY_CACHE);
    return (await cache.match(studyCacheRequest(repoPath))) || null;
  } catch (_) {
    return null;
  }
}

async function cacheStudyResponse(repoPath, response) {
  try {
    if (!window.caches || !response) return;
    const cache = await caches.open(STUDY_CACHE);
    await cache.put(studyCacheRequest(repoPath), response.clone());
  } catch (_) {}
}

async function fetchStudyResponse(repoPath) {
  if (mockRepoOn()) {
    const url = new URL(`../../${repoPath}`, location.href);
    let res;
    try {
      res = await fetch(url.href);
    } catch (_) {
      const err = new Error("网络不通");
      err.network = true;
      throw err;
    }
    if (!res.ok) {
      const err = new Error("读取失败");
      err.status = res.status;
      throw err;
    }
    return res;
  }
  if (!hasToken()) {
    const err = new Error("还没有令牌");
    err.code = "no-token";
    throw err;
  }
  return getSync().getRaw(repoPath);
}

function ingestStudyText(repoPath, text) {
  const rhythmMatch = /^教材\/([^/]+)\/rhythm\.json$/.exec(repoPath || "");
  if (rhythmMatch) {
    try {
      const data = JSON.parse(text);
      app.study.rhythm[rhythmMatch[1]] = data && typeof data === "object" ? data : { blocks: {} };
      app.study.rhythmState[rhythmMatch[1]] = "ready";
    } catch (_) {
      app.study.rhythmState[rhythmMatch[1]] = "error";
    }
    return;
  }
  const kaokaoMatch = /^教材\/([^/]+)\/kaokao\.json$/.exec(repoPath || "");
  if (kaokaoMatch) {
    try {
      const data = JSON.parse(text);
      app.study.kaokao[kaokaoMatch[1]] = data && typeof data === "object" ? data : { items: [] };
      app.study.kaokaoState[kaokaoMatch[1]] = "ready";
    } catch (_) {
      app.study.kaokaoState[kaokaoMatch[1]] = "error";
    }
    return;
  }
  const indexMatch = /^教材\/([^/]+)\/index\.json$/.exec(repoPath || "");
  if (indexMatch) {
    try {
      app.study.indexes[indexMatch[1]] = JSON.parse(text);
      app.study.indexState[indexMatch[1]] = "ready";
    } catch (_) {
      app.study.indexState[indexMatch[1]] = "error";
    }
    return;
  }
  const chunkMatch = /^教材\/([^/]+)\/chunks\/([^/]+)\.json$/.exec(repoPath || "");
  if (chunkMatch) {
    try {
      app.study.bodies[chunkMatch[2]] = JSON.parse(text);
      app.study.bodyState[chunkMatch[2]] = "ready";
    } catch (_) {
      app.study.bodyState[chunkMatch[2]] = "error";
    }
  }
}

async function loadStudyText(repoPath) {
  const cached = await cachedStudyResponse(repoPath);
  const pull = async () => {
    const res = await fetchStudyResponse(repoPath);
    const clone = res.clone();
    const text = await res.text();
    await cacheStudyResponse(repoPath, clone);
    return text;
  };
  if (cached) {
    const text = await cached.text();
    pull().then((fresh) => {
      if (fresh === text) return;
      ingestStudyText(repoPath, fresh);
      render();
    }).catch(() => {});
    ingestStudyText(repoPath, text);
    return text;
  }
  try {
    const text = await pull();
    ingestStudyText(repoPath, text);
    return text;
  } catch (_) {
    return null;
  }
}

async function loadStudyBlobUrl(repoPath, filename) {
  if (app.study.imageUrls[filename]) return app.study.imageUrls[filename];
  const remember = async (res) => {
    const blob = await res.blob();
    const ext = String(filename || "").split(".").pop().toLowerCase();
    const types = {
      jpg: "image/jpeg",
      jpeg: "image/jpeg",
      png: "image/png",
      gif: "image/gif",
      webp: "image/webp",
      svg: "image/svg+xml"
    };
    const type = types[ext] || blob.type;
    const typed = new Blob([blob], { type });
    if (app.study.imageUrls[filename]) URL.revokeObjectURL(app.study.imageUrls[filename]);
    const url = URL.createObjectURL(typed);
    app.study.imageUrls[filename] = url;
    return url;
  };
  const cached = await cachedStudyResponse(repoPath);
  if (cached) {
    await remember(cached);
    fetchStudyResponse(repoPath).then(async (res) => {
      const clone = res.clone();
      await cacheStudyResponse(repoPath, clone);
      const previous = app.study.imageUrls[filename];
      await remember(res);
      if (previous !== app.study.imageUrls[filename] && app.ui.tab === "learn") render();
    }).catch(() => {});
    return app.study.imageUrls[filename];
  }
  const res = await fetchStudyResponse(repoPath);
  const clone = res.clone();
  await cacheStudyResponse(repoPath, clone);
  return remember(res);
}

function blocksForPoolOrder(chunkId, items) {
  const body = app.study.bodies && app.study.bodies[chunkId];
  if (body && Array.isArray(body.blocks) && body.blocks.length) return body.blocks;
  const ids = [];
  const seen = new Set();
  for (const item of items || []) {
    const blockId = anchorBlockId(item.anchor);
    if (blockId == null || seen.has(blockId)) continue;
    seen.add(blockId);
    ids.push(blockId);
  }
  ids.sort((a, b) => a - b);
  return ids.map((id) => ({ id }));
}

function releasePoolCards(today) {
  if (!today || poolReleaseLock || !app.state || !app.state.cards) return;
  const docs = Object.values(kaokaoDocs());
  if (!docs.length) return;
  poolReleaseLock = true;
  try {
    const byChunk = new Map();
    for (const doc of docs) {
      const items = doc && Array.isArray(doc.items) ? doc.items : [];
      for (const item of items) {
        if (!item || !item.id || !item.chunk) continue;
        if (!item.recog || !Array.isArray(item.recog.options)) continue;
        if (!chunkDone(item.chunk)) continue;
        if (latestKaokaoTry(item.id, "recog")) continue;
        if (app.state.cards[`KK-${item.id}`]) continue;
        if (!byChunk.has(item.chunk)) byChunk.set(item.chunk, []);
        byChunk.get(item.chunk).push(item);
      }
    }
    const chunkIds = [...byChunk.keys()].sort((a, b) => {
      const da = (app.state.chunks && app.state.chunks[a] && app.state.chunks[a].doneAt) || "";
      const db = (app.state.chunks && app.state.chunks[b] && app.state.chunks[b].doneAt) || "";
      if (da !== db) return da < db ? -1 : 1;
      return String(a).localeCompare(String(b));
    });
    const poolItems = [];
    for (const chunkId of chunkIds) {
      const group = byChunk.get(chunkId);
      poolItems.push(...selectInlineKaokao(group, blocksForPoolOrder(chunkId, group), new Set(), group.length));
    }
    const releasedToday = Object.values(app.state.cards).filter((card) => card && card.pool === true && card.created === today).length;
    const releasing = pickPoolRelease(poolItems, releasedToday, POOL_DAILY_LIMIT);
    for (const item of releasing) {
      const unit = (String(item.id).match(/U\d+/) || [])[0] || "";
      store.save(`cards/KK-${item.id}`, {
        box: 0,
        due: today,
        streak: 0,
        streakStart: null,
        cleared: false,
        src: "kaokao",
        kid: item.id,
        created: today,
        unit,
        pool: true
      }, { silent: true });
    }
  } finally {
    poolReleaseLock = false;
  }
}

function rowChunkStats(rowId) {
  const chunks = chunksTouchingRow(rowId);
  if (!chunks.length) return null;
  const done = chunks.filter((chunk) => chunkDone(chunk.id)).length;
  const next = chunks.find((chunk) => !chunkDone(chunk.id)) || chunks[0];
  return { done, total: chunks.length, nextId: next ? next.id : "" };
}

function nextChunkAfter(chunks, current) {
  const index = chunks.findIndex((chunk) => chunk.id === current.id);
  for (let i = Math.max(index, 0) + 1; i < chunks.length; i += 1) {
    if (!chunkDone(chunks[i].id)) return chunks[i];
  }
  return chunks.find((chunk) => chunk.id !== current.id && !chunkDone(chunk.id)) || null;
}

function renderTex(tex, display) {
  const raw = display ? `$$${tex}$$` : `$${tex}$`;
  if (!window.katex) return `<span class="tex-raw">${escapeHtml(raw)}</span>`;
  try {
    return window.katex.renderToString(tex, { displayMode: !!display, throwOnError: false });
  } catch (_) {
    return `<span class="tex-raw">${escapeHtml(raw)}</span>`;
  }
}

function imageFileName(src) {
  const clean = String(src || "").replace(/[<>]/g, "").split("?")[0];
  const name = clean.split("/").pop() || "";
  try { return decodeURIComponent(name); } catch (_) { return name; }
}

function imageHtml(src, alt) {
  const file = imageFileName(src);
  const url = app.study.imageUrls[file];
  if (!url) return `<span class="small">${escapeHtml(alt || file || "图片")}</span>`;
  return `<img src="${escapeHtml(url)}" alt="${escapeHtml(alt || "")}">`;
}

function renderPlain(text) {
  return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
}

function renderRich(md, inline) {
  const source = String(md || "");
  const re = /\$\$([\s\S]+?)\$\$|!\[([^\]]*)\]\(<([^>]+)>\)|!\[([^\]]*)\]\(([^)]+)\)|\$([^$\n]+?)\$/g;
  let last = 0;
  let match;
  const parts = [];
  while ((match = re.exec(source))) {
    parts.push(renderPlain(source.slice(last, match.index)));
    if (match[1] != null) {
      const eq = renderTex(match[1].trim(), true);
      parts.push(inline ? `<span class="read-equation">${eq}</span>` : `<div class="read-equation">${eq}</div>`);
    } else if (match[3] != null) parts.push(imageHtml(match[3], match[2]));
    else if (match[5] != null) parts.push(imageHtml(match[5], match[4]));
    else if (match[6] != null) parts.push(renderTex(match[6].trim(), false));
    last = match.index + match[0].length;
  }
  parts.push(renderPlain(source.slice(last)));
  return parts.join("");
}

function rhythmMode() {

  } catch (_) {

function setRhythmMode(mode) {

function rhythmBlocksFor(meta) {
  const doc = meta && app.study.rhythm && app.study.rhythm[meta.unit];
  // 只认 schemaVersion 2 的「块id:段id」。旧裸段号会串书，缺键或旧数据都回退本块原文。
  if (!doc || doc.schemaVersion !== 2 || !doc.blocks) return null;
  return doc.blocks;
}

function rhythmMarkupFor(meta, block) {
  if (!meta || !block || (block.kind || "para") !== "para") return "";
  if (rhythmMode() === "plain") return "";
  const blocks = rhythmBlocksFor(meta);
  if (!blocks) return "";
  const markup = blocks[meta.id + ":" + block.id];
  return typeof markup === "string" ? markup : "";
}

function chunkUsesRhythm(meta, body) {
  if (!meta || !body || !Array.isArray(body.blocks)) return false;
  const blocks = rhythmBlocksFor(meta);
  if (!blocks) return false;
  return body.blocks.some((block) => (block.kind || "para") === "para" && typeof blocks[meta.id + ":" + block.id] === "string");
}

function renderRhythmLine(line) {
  let text = String(line || "");
  let item = false;
  if (text.startsWith("· ")) {
    item = true;
    text = text.slice(2);
  }
  const parts = [];
  const re = /\{\{([\s\S]*?)\}\}|\(\(([\s\S]*?)\)\)/g;
  let last = 0;
  let match;
  while ((match = re.exec(text))) {
    if (match.index > last) parts.push({ kind: "n", text: text.slice(last, match.index) });
    if (match[1] != null) parts.push({ kind: "k", text: match[1] });
    else parts.push({ kind: "w", text: match[2] || "" });
    last = match.index + match[0].length;
  }
  if (last < text.length) parts.push({ kind: "n", text: text.slice(last) });
  const inner = parts.filter((part) => part.text).map((part) => {
    const html = renderRich(part.text, true);
    if (part.kind === "k") return `<strong class="rx-k">${html}</strong>`;
    if (part.kind === "w") return `<span class="rx-w">${html}</span>`;
    return `<span class="rx-n">${html}</span>`;
  }).join("");
  return `<div class="rx-line${item ? " rx-li" : ""}">${inner}</div>`;
}

function renderRhythmMarkup(markup) {
  return String(markup || "").replace(/\r\n/g, "\n").split("\n").map((line) => renderRhythmLine(line)).join("");
}

function rhythmSwitchHtml(meta, body) {
  if (!chunkUsesRhythm(meta, body)) return "";
  const plain = rhythmMode() === "plain";
  return `
    <div class="rhythm-switch" role="group" aria-label="排版">
      <button type="button" class="rhythm-opt tap-target${plain ? "" : " is-on"}" data-rhythm="focus" aria-pressed="${plain ? "false" : "true"}">重点排版</button>
      <button type="button" class="rhythm-opt tap-target${plain ? " is-on" : ""}" data-rhythm="plain" aria-pressed="${plain ? "true" : "false"}">原样</button>
    </div>`;
}

function sanitizeTableHtml(html) {
  const allowed = new Set(["TABLE", "THEAD", "TBODY", "TR", "TD", "TH"]);
  const drop = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META"]);
  const doc = new DOMParser().parseFromString(`<body>${html}</body>`, "text/html");
  const clean = (node) => {
    const out = [];
    for (const child of [...node.childNodes]) {
      if (child.nodeType === Node.TEXT_NODE) {
        out.push(document.createTextNode(child.textContent));
        continue;
      }
      if (child.nodeType !== Node.ELEMENT_NODE) continue;
      if (drop.has(child.tagName)) continue;
      if (!allowed.has(child.tagName)) {
        out.push(...clean(child));
        continue;
      }
      const el = document.createElement(child.tagName.toLowerCase());
      if (child.tagName === "TD" || child.tagName === "TH") {
        const colspan = child.getAttribute("colspan");
        const rowspan = child.getAttribute("rowspan");
        if (colspan && /^\d+$/.test(colspan)) el.setAttribute("colspan", colspan);
        if (rowspan && /^\d+$/.test(rowspan)) el.setAttribute("rowspan", rowspan);
      }
      for (const grand of clean(child)) el.appendChild(grand);
      out.push(el);
    }
    return out;
  };
  const holder = document.createElement("div");
  for (const node of clean(doc.body)) holder.appendChild(node);
  return holder.innerHTML;
}

function splitTableMd(md) {
  const text = String(md || "");
  const match = text.match(/<table[\s\S]*<\/table>/i);
  if (!match) return { before: text, table: "" };
  return { before: text.slice(0, match.index), table: match[0] };
}

function plainExcerpt(md) {

    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
    .replace(/\$\$[\s\S]*?\$\$/g, " ")
    .replace(/\$[^$\n]+\$/g, " ")
    .replace(/[#*_`>]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, 600);
}

function doubtKey(chunkId, blockId) {

function activeDoubt(chunkId, blockId) {
  const rec = app.state.doubts && app.state.doubts[doubtKey(chunkId, blockId)];
  if (!rec || rec.removed) return null;
  return rec;
}

function limitSentences(text, count) {
  const src = String(text || "").trim();
  if (!src) return "";
  const parts = src.match(/[^。！？!?]+[。！？!?]?/g) || [src];
  return parts.slice(0, count).join("").trim();
}

function writeDoubt(meta, blockId, patch, options) {
  const id = doubtKey(meta.id, blockId);
  const prev = (app.state.doubts && app.state.doubts[id]) || {};
  const next = {
    chunk: meta.id,
    block: blockId,
    unit: meta.unit,
    note: prev.note || "",
    at: prev.at || shanghaiIso()
  };
  if (prev.answer) next.answer = prev.answer;
  if (prev.qa) next.qa = prev.qa;
  if (prev.resolved) next.resolved = prev.resolved;
  if (prev.removed) next.removed = true;
  const incoming = { ...(patch || {}) };
  if (incoming.note == null) delete incoming.note;
  Object.assign(next, incoming);
  next.chunk = meta.id;
  next.block = blockId;
  next.unit = meta.unit || prev.unit || "";
  if (!next.at) next.at = shanghaiIso();
  if (patch && Object.prototype.hasOwnProperty.call(patch, "removed") && !patch.removed) delete next.removed;
  if (patch && Object.prototype.hasOwnProperty.call(patch, "resolved") && !patch.resolved) delete next.resolved;
  next.updatedAt = Math.max(Date.now(), (Number(prev.updatedAt) || 0) + 1);
  store.save(`doubts/${id}`, next, { ...(options || {}), keepUpdatedAt: true });
}

function saveDoubtNote(meta, blockId, note, options) {

function plainQuizHeading(block) {

    .trim();

function planReadQuizCards(blocks, items) {
  const list = Array.isArray(blocks) ? blocks : [];
  const indexById = new Map();
  list.forEach((block, index) => {
    const id = Number(block && block.id);
    if (Number.isFinite(id)) indexById.set(id, index);
  });
  const pending = (items || []).map((item) => {
    const blockId = anchorBlockId(item.anchor);
    const index = indexById.has(blockId) ? indexById.get(blockId) : list.length;
    return { item, index };
  }).sort((a, b) => a.index - b.index || String(a.item.id).localeCompare(String(b.item.id)));
  const cards = [];
  let paras = 0;
  let cursor = 0;
  const take = (beforeIndex, limit) => {
    const taken = [];
    while (cursor < pending.length && taken.length < limit && pending[cursor].index < beforeIndex) {
      taken.push(pending[cursor].item);
      cursor += 1;
    }
    return taken;
  };
  for (let i = 0; i < list.length; i += 1) {
    const block = list[i];
    const heading = block && (block.kind === "h6" || block.kind === "bold");
    if (heading && paras >= 2) {
      const taken = take(i, 3);
      if (taken.length) {
        cards.push({ before: i, heading: plainQuizHeading(block), items: taken });
        paras = 0;
      }
    }
    if (block && block.kind === "para") paras += 1;
  }
  while (cursor < pending.length) {
    const taken = [];
    while (cursor < pending.length && taken.length < 3) {
      taken.push(pending[cursor].item);
      cursor += 1;
    }
    if (taken.length) cards.push({ before: list.length, heading: "末尾", items: taken });
  }
  return cards.map((card) => ({
    ...card,
    key: `${card.before}:${card.items[0] ? card.items[0].id : "end"}`
  }));
}

function plannedQuizCard(meta, key) {

  return planReadQuizCards(blocks, kaokaoItemsForChunk(meta)).find((card) => card.key === key) || null;

function compactText(text) {
  return String(text || "").replace(/\s+/g, "");
}

function unwrapHitMarks(root) {
  if (!root) return;
  root.querySelectorAll("mark.src-hit").forEach((el) => {
    const parent = el.parentNode;
    if (!parent) return;
    while (el.firstChild) parent.insertBefore(el.firstChild, el);
    parent.removeChild(el);
    if (parent.normalize) parent.normalize();
  });
  if (root.classList) root.classList.remove("src-hit");
}

function wrapRange(node, from, to) {
  const range = document.createRange();
  range.setStart(node, from);
  range.setEnd(node, to);
  const mark = document.createElement("mark");
  mark.className = "src-hit";
  try {
    range.surroundContents(mark);
  } catch (_) {
    mark.appendChild(range.extractContents());
    range.insertNode(mark);
  }
}

function highlightBlock(block, src) {
  if (!block) return;
  unwrapHitMarks(block);
  const needle = compactText(src);
  let marked = false;
  if (needle) {
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (parent && parent.closest("button, .doubt-box, .page-mark")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    let raw = "";
    while (walker.nextNode()) {
      nodes.push({ node: walker.currentNode, start: raw.length });
      raw += walker.currentNode.textContent || "";
    }
    const map = [];
    let compact = "";
    for (let i = 0; i < raw.length; i += 1) {
      if (/\s/.test(raw[i])) continue;
      map.push(i);
      compact += raw[i];
    }
    const at = compact.indexOf(needle);
    if (at >= 0 && map[at] != null && map[at + needle.length - 1] != null) {
      const rawStart = map[at];
      const rawEnd = map[at + needle.length - 1] + 1;
      const slices = [];
      for (const entry of nodes) {
        const nodeEnd = entry.start + (entry.node.textContent || "").length;
        const from = Math.max(rawStart, entry.start);
        const to = Math.min(rawEnd, nodeEnd);
        if (from < to) slices.push({ node: entry.node, from: from - entry.start, to: to - entry.start });
      }
      for (let s = slices.length - 1; s >= 0; s -= 1) {
        wrapRange(slices[s].node, slices[s].from, slices[s].to);
      }
      marked = slices.length > 0;
    }
  }
  if (!marked) block.classList.add("src-hit");
  block.scrollIntoView({ behavior: "smooth", block: "center" });
  const token = (app.ui.highlightToken || 0) + 1;
  app.ui.highlightToken = token;
  setTimeout(() => {
    if (app.ui.highlightToken !== token) return;
    document.querySelectorAll("mark.src-hit").forEach((el) => {
      const parent = el.parentNode;
      if (!parent) return;
      while (el.firstChild) parent.insertBefore(el.firstChild, el);
      parent.removeChild(el);
      if (parent.normalize) parent.normalize();
    });
    document.querySelectorAll(".src-hit").forEach((el) => el.classList.remove("src-hit"));
  }, 2000);
}
