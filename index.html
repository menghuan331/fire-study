<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>消考学习台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="modules/qa/panel.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c4271d">
<style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600&display=swap");

:root {
  --bg: #eef0f2;
  --panel: #f8f9fa;
  --ink: #1d2329;
  --ink-2: #56606b;
  --line: #d3d8dd;
  --accent: #c4271d;
  --accent-ink: #ffffff;
  --lamp-off: #b9c0c7;
  --lamp-read: #3d7fb8;
  --lamp-done: #d39a12;
  --lamp-pass: #2f9a5d;
  --ok: #2f9a5d;
  --warn: #b7791f;
  --bad: #c4271d;
  --fg: #1d2329;
  --muted: #56606b;
  --rx-n: #3d4148;
  --font-display: "Noto Serif SC", "Songti SC", serif;
  --font-body: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191d;
    --panel: #1c2126;
    --ink: #e4e8ec;
    --ink-2: #98a2ad;
    --line: #2c333a;
    --accent: #e5483c;
    --accent-ink: #ffffff;
    --lamp-off: #3a424a;
    --lamp-read: #5b9bd5;
    --lamp-done: #e3ad2e;
    --lamp-pass: #45b878;
    --ok: #45b878;
    --warn: #e3ad2e;
    --bad: #e5483c;
    --fg: #e4e8ec;
    --muted: #98a2ad;
    --rx-n: #c9ccd2;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #15191d;
  --panel: #1c2126;
  --ink: #e4e8ec;
  --ink-2: #98a2ad;
  --line: #2c333a;
  --accent: #e5483c;
  --accent-ink: #ffffff;
  --lamp-off: #3a424a;
  --lamp-read: #5b9bd5;
  --lamp-done: #e3ad2e;
  --lamp-pass: #45b878;
  --ok: #45b878;
  --warn: #e3ad2e;
  --bad: #e5483c;
  --fg: #e4e8ec;
  --muted: #98a2ad;
  --rx-n: #c9ccd2;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--panel);
}

button,
.tap-target {
  min-height: 44px;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app-shell {
  min-height: 100dvh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px;
  padding-bottom: calc(56px + 12px + env(safe-area-inset-bottom, 0px));
}

.main-layout {
  display: block;
  min-width: 0;
}

.main-column {
  min-width: 0;
  width: 100%;
}

.status-bar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "left right" "center center";
  gap: 2px 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 8px 12px;
  font-size: 14px;
  align-items: center;
}

.status-left {
  grid-area: left;
  font-family: var(--font-display);
  font-weight: 600;
}

.status-center {
  grid-area: center;
  min-width: 0;
  text-align: left;
}

.status-right {
  grid-area: right;
  justify-self: end;
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 2px 8px;
  max-width: 100%;
  min-width: 0;
  font-variant-numeric: tabular-nums;
}

button.sync-status {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.4;
  padding: 0 2px;
  min-height: 44px;
  max-width: min(220px, 42vw);
  white-space: normal;
  overflow-wrap: anywhere;
  text-align: right;
  cursor: pointer;
}

.text-input {
  display: block;
  width: 100%;
  max-width: 100%;
  min-height: 44px;
  padding: 8px 10px;
}

.field {
  display: grid;
  gap: 4px;
  margin-top: 10px;
}

.settings-note a {
  color: var(--lamp-read);
  text-decoration: underline;
}

.app-version {
  margin: 12px 0 0;
  color: var(--ink-2);
  font-size: 13px;
}

#gh-form {
  margin: 0;
}

.content-wrap {
  border: 1px solid var(--line);
  background: var(--panel);
}

.page {
  padding: 14px;
  min-width: 0;
  max-width: 100%;
}

.page + .page {
  border-top: 1px solid var(--line);
}

.panel {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}

.panel:first-child {
  border-top: 0;
  padding-top: 0;
}

.h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  font-family: var(--font-display);
  font-weight: 600;
}

.h2 {
  margin: 0 0 8px;
  font-size: 20px;
  line-height: 1.35;
}

.label {
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-2);
}

.small {
  font-size: 14px;
  color: var(--ink-2);
}

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  padding: 8px 12px;
  cursor: pointer;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.btn-secondary {
  background: transparent;
  border-color: var(--line);
}

.btn-ok {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--accent-ink);
}

.btn-bad {
  background: transparent;
  border-color: var(--bad);
  color: var(--bad);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.task-list {
  display: grid;
  gap: 8px;
}

.task-item {
  border: 1px solid var(--line);
  padding: 10px;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  cursor: pointer;
}

.check-row input {
  width: 22px;
  height: 22px;
  accent-color: var(--accent);
}

.task-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.status-pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 8px;
  font-size: 12px;
  white-space: nowrap;
}

.status-ok {
  border-color: var(--ok);
  color: var(--ok);
}

.status-bad {
  border-color: var(--bad);
  color: var(--bad);
}

.status-warn {
  border-color: var(--warn);
  color: var(--warn);
}

.progress {
  height: 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.progress > span {
  display: block;
  height: 100%;
  background: var(--lamp-read);
}

.split {
  display: grid;
  gap: 8px;
}

.q-list {
  margin: 0;
  padding: 0;
  list-style: none;
  border: 1px solid var(--line);
}

.q-item {
  border-top: 1px solid var(--line);
}

.q-item:first-child {
  border-top: 0;
}

.doubt-fold {
  margin-top: 8px;
  border-top: 1px solid var(--line);
}

.doubt-summary {
  min-height: 44px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 14px;
}

.doubt-fold .q-list {
  border-left: 0;
  border-right: 0;
  border-bottom: 0;
}

.q-btn {
  display: flex;
  width: 100%;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: 10px;
  text-align: left;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.q-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}

.q-stem {
  white-space: normal;
  word-break: break-word;
}

.q-meta {
  font-size: 12px;
  line-height: 1.4;
  color: var(--ink-2);
}

.q-btn.active {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}

.option-list {
  list-style: none;
  padding: 0;
  margin: 8px 0;
}

.option-btn {
  display: flex;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  margin-top: 6px;
  padding: 8px;
  background: transparent;
  cursor: pointer;
}

.option-btn.on {
  border-color: var(--lamp-read);
  background: color-mix(in srgb, var(--lamp-read) 12%, transparent);
}

.option-btn.opt-ok {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 12%, transparent);
}

.option-btn.opt-bad {
  border-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 12%, transparent);
}

.verify-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 12px;
}

.textarea {
  width: 100%;
  min-height: 96px;
  padding: 8px;
  resize: vertical;
}

.review-card {
  border: 1px solid var(--line);
  padding: 12px;
}

.review-src {
  display: inline-block;
  margin: 0 0 8px;
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--muted);
}

.review-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 44px;
}

.review-meta p {
  margin: 0;
}

.review-undo {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  padding: 0 2px;
  min-height: 44px;
  cursor: pointer;
  white-space: nowrap;
}

.review-mark {
  margin: 0 0 8px;
  color: var(--bad);
  font-size: 14px;
  line-height: 1.5;
}

.review-hint {
  margin: 8px 0 0;
}

.review-actions {
  display: flex;
  flex-wrap: nowrap;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  margin-top: 8px;
}

.review-actions .btn {
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  height: 48px;
  min-height: 48px;
  padding: 8px 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.2;
}

.map-toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.group {
  border: 0;
  border-radius: 0;
  margin: 0;
  border-bottom: 1px solid var(--line);
}

.group-head {
  width: 100%;
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 8px 0;
  display: grid;
  gap: 4px;
  text-align: left;
  cursor: pointer;
}

.row-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.map-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 44px;
  min-height: 44px;
  max-height: 44px;
  border: 0;
  border-radius: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  padding: 0 2px;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
}

.map-row-main {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.map-row-page {
  flex: none;
  color: var(--ink-2);
}

.segbar {
  display: flex;
  width: 100%;
  height: 4px;
  background: var(--lamp-off);
}

.segbar > span {
  display: block;
  height: 4px;
  flex: 0 0 auto;
}

.seg-0 { background: var(--lamp-off); }
.seg-1 { background: var(--lamp-read); }
.seg-2 { background: var(--lamp-done); }
.seg-3 { background: var(--lamp-pass); }

.lamp {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  display: inline-block;
  flex: none;
}

.map-row .tag {
  flex: none;
  line-height: 1.4;
}

.tag.lecture-tag {
  border-color: var(--lamp-read);
  color: var(--lamp-read);
  background: transparent;
  font-size: 12px;
  cursor: pointer;
}

.lecture-block {
  border: 1px solid var(--line);
  padding: 10px;
}

.lecture-title {
  margin: 0 0 4px;
  font-size: 14px;
  color: var(--ink-2);
}

.lecture-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.lecture-link {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 8px 0;
  cursor: pointer;
}

.lecture-list li:last-child .lecture-link {
  border-bottom: 0;
}

.lamp-0 {
  background: var(--lamp-off);
}

.lamp-1 {
  background: var(--lamp-read);
}

.lamp-2 {
  background: var(--lamp-done);
}

.lamp-3 {
  background: var(--lamp-pass);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--lamp-pass) 35%, transparent);
}

.tag {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0 8px;
  font-size: 12px;
}

.danger {
  color: var(--bad);
}

.timeline {
  border-top: 1px solid var(--line);
}

.week-row {
  border: 0;
  border-bottom: 1px solid var(--line);
  border-left: 3px solid transparent;
  border-radius: 0;
  padding: 6px 8px;
  min-height: 44px;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  grid-template-areas: "dates dates" "unit case";
  gap: 2px 12px;
  align-items: center;
}

.week-dates { grid-area: dates; }
.week-unit { grid-area: unit; min-width: 0; }
.week-case { grid-area: case; min-width: 0; }

.week-row.current {
  border-left-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}

.week-row.buffer {
  color: var(--ink-2);
}

.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: 56px;
  height: auto;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: var(--panel);
  padding-top: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

.nav a {
  height: 56px;
  min-height: 56px;
  max-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-left: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  font-size: 14px;
  white-space: nowrap;
  padding: 0 2px;
}

.nav a:first-child {
  border-left: 0;
}

.nav a.active {
  background: var(--accent);
  color: var(--accent-ink);
}

.empty {
  border: 1px dashed var(--line);
  padding: 10px;
}

.app-error {
  border: 1px solid var(--bad);
  padding: 10px;
  color: var(--bad);
  margin-top: 10px;
}

@media (min-width: 720px) {
  .status-bar {
    grid-template-columns: 1fr auto 1fr;
    grid-template-areas: "left center right";
  }

  .status-center {
    text-align: center;
  }

  .week-row {
    grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1.15fr);
    grid-template-areas: "dates unit case";
    gap: 8px 12px;
  }

  .week-dates {
    white-space: nowrap;
  }
}

@media (min-width: 960px) {
  .app-shell {
    padding-bottom: 16px;
  }

  .main-layout {
    display: grid;
    grid-template-columns: 190px minmax(0, 1fr);
    gap: 24px;
    width: 100%;
    align-items: start;
  }

  .main-column {
    max-width: 880px;
    margin-inline: auto;
  }

  .nav {
    position: sticky;
    top: 12px;
    bottom: auto;
    left: auto;
    right: auto;
    height: auto;
    grid-template-columns: 1fr;
    grid-template-rows: none;
    padding: 0;
    border: 1px solid var(--line);
  }

  .nav a {
    height: auto;
    min-height: 44px;
    max-height: none;
    justify-content: flex-start;
    padding-inline: 12px;
    border-left: 0;
    border-top: 1px solid var(--line);
    white-space: normal;
  }

  .nav a:first-child {
    border-top: 0;
  }
}

.today-board {
  border: 1px solid var(--line);
  margin-top: 8px;
}

.today-task {
  padding: 14px 12px;
}

.today-task + .today-task {
  border-top: 1px solid var(--line);
}

.today-kicker {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.35;
}

.today-check {
  margin: 8px 0 0;
  color: var(--ok);
}

.today-foot {
  margin: 12px 0 0;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.today-foot.is-ok {
  color: var(--ok);
}

.today-week {
  margin: 8px 0 0;
}

.baseline-line {
  margin-top: 8px;
}

.map-row-line {
  display: flex;
  align-items: stretch;
  min-width: 0;
  border-top: 1px solid var(--line);
}

.map-row-line .map-row {
  border-top: 0;
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
}

.map-chunk-count {
  flex: none;
  color: var(--ink-2);
  font-size: 12px;
}

.map-section {
  min-width: 0;
}

.map-chunks-toggle {
  flex: none;
  min-height: 44px;
  border: 0;
  border-left: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  color: var(--lamp-read);
  cursor: pointer;
  padding: 0 10px;
  white-space: nowrap;
}

.map-chunk-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.map-chunk {
  display: flex;
  align-items: center;
  height: 44px;
  min-height: 44px;
  max-height: 44px;
  padding-left: 28px;
  border-top: 1px solid var(--line);
  min-width: 0;
  gap: 4px;
}

.map-chunk-open {
  flex: 1 1 auto;
  min-width: 0;
  height: 44px;
  min-height: 44px;
  max-height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 0 4px 0 0;
  text-align: left;
  cursor: pointer;
}

.map-chunk-copy {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  line-height: 1.2;
}

.map-chunk-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
}

.map-chunk-meta {
  color: var(--ink-2);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chunk-mark {
  width: 16px;
  height: 16px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.chunk-mark.is-done {
  color: var(--ok);
  font-size: 14px;
  line-height: 1;
}

.chunk-mark.is-todo::before {
  content: "";
  width: 10px;
  height: 10px;

<script id="pure">
// Keep the legacy synchronous sync adapter usable before optional UI modules load.
// qa.turns use the same deterministic record rule as modules/qa/state.js.
function mergeQaState(leftValue, rightValue) {
  const isObject = (value) => !!value && typeof value === "object" && !Array.isArray(value);
  const object = (value) => isObject(value) ? value : {};
  const own = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
  const number = (value) => typeof value === "number" && Number.isFinite(value) ? value : 0;
  const stable = (value) => {
    if (Array.isArray(value)) return `[${value.map((item) => stable(item) ?? "null").join(",")}]`;
    if (isObject(value)) return `{${Object.keys(value).sort().filter((key) => value[key] !== undefined)
      .map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(",")}}`;
    return JSON.stringify(value);
  };
  const newer = (left, right) => {
    if (!left) return right;
    if (!right) return left;
    const delta = number(left.updatedAt) - number(right.updatedAt);
    return delta ? (delta > 0 ? left : right) : (stable(left) >= stable(right) ? left : right);
  };
  const copy = (value) => JSON.parse(JSON.stringify(value));
  const left = object(leftValue), right = object(rightValue);
  const a = object(left.turns), b = object(right.turns);
  const turns = Object.fromEntries([...new Set([...Object.keys(a), ...Object.keys(b)])].sort().flatMap((id) => {
    const winner = newer(own(a, id) && isObject(a[id]) ? a[id] : undefined, own(b, id) && isObject(b[id]) ? b[id] : undefined);
    return winner ? [[id, { ...copy(winner), requestId: id, updatedAt: number(winner.updatedAt) }]] : [];
  }));
  const draft = newer(isObject(left.draft) ? left.draft : undefined, isObject(right.draft) ? right.draft : undefined);
  return { version: 1, turns, ...(draft ? { draft: { ...copy(draft), updatedAt: number(draft.updatedAt) } } : {}) };
}

function mergeStates(local, remote) {
  function asRecord(value) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return {};
    return value;
  }

  function copyRec(rec) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) return rec;
    return { ...rec };
  }

  function mergeMaps(a, b) {
    const out = {};
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
    for (const key of keys) {
      const aHas = !!(a && Object.prototype.hasOwnProperty.call(a, key));
      const bHas = !!(b && Object.prototype.hasOwnProperty.call(b, key));
      const av = aHas ? a[key] : null;
      const bv = bHas ? b[key] : null;
      if (av != null && bv != null) {
        const at = Number(av.updatedAt) || 0;
        const bt = Number(bv.updatedAt) || 0;
        out[key] = copyRec(bt > at ? bv : av);
      } else if (av != null) {
        out[key] = copyRec(av);
      } else if (bv != null) {
        out[key] = copyRec(bv);
      }
    }
    return out;
  }

  function mergeDoubts(a, b) {
    const out = mergeMaps(a, b);
    for (const id of Object.keys(out)) {
      if (a?.[id]?.qa || b?.[id]?.qa) out[id].qa = mergeQaState(a?.[id]?.qa, b?.[id]?.qa);
    }
    return out;
  }

  const left = asRecord(local);
  const right = asRecord(remote);
  const sections = {};
  const sectionsAt = {};
  const sectionIds = new Set([
    ...Object.keys(left.sections || {}),
    ...Object.keys(right.sections || {}),
    ...Object.keys(left.sectionsAt || {}),
    ...Object.keys(right.sectionsAt || {})
  ]);
  for (const id of sectionIds) {
    const lat = left.sectionsAt && Object.prototype.hasOwnProperty.call(left.sectionsAt, id)
      ? (Number(left.sectionsAt[id]) || 0)
      : 0;
    const rat = right.sectionsAt && Object.prototype.hasOwnProperty.call(right.sectionsAt, id)
      ? (Number(right.sectionsAt[id]) || 0)
      : 0;
    const lHas = !!(left.sections && Object.prototype.hasOwnProperty.call(left.sections, id));
    const rHas = !!(right.sections && Object.prototype.hasOwnProperty.call(right.sections, id));
    const useRemote = rat > lat;
    if (useRemote) {
      if (rHas) sections[id] = right.sections[id];
      else if (lHas) sections[id] = left.sections[id];
      else continue;
      sectionsAt[id] = rHas ? rat : lat;
    } else if (lHas) {
      sections[id] = left.sections[id];
      sectionsAt[id] = lat;
    } else if (rHas) {
      sections[id] = right.sections[id];
      sectionsAt[id] = rat;
    }
  }

  function stamp(state, key) {
    if (!state || !Object.prototype.hasOwnProperty.call(state, key)) return null;
    const n = Number(state[key]);
    return Number.isFinite(n) ? n : 0;
  }

  const lBase = stamp(left, "baselineAt");
  const rBase = stamp(right, "baselineAt");
  const lBaseHas = lBase !== null || Object.prototype.hasOwnProperty.call(left, "baselineDone");
  const rBaseHas = rBase !== null || Object.prototype.hasOwnProperty.call(right, "baselineDone");
  let baselineDone = false;
  let baselineAt = 0;
  if (rBaseHas && (!lBaseHas || (rBase || 0) > (lBase || 0))) {
    baselineDone = !!right.baselineDone;
    baselineAt = rBase || 0;
  } else if (lBaseHas) {
    baselineDone = !!left.baselineDone;
    baselineAt = lBase || 0;
  } else if (rBaseHas) {
    baselineDone = !!right.baselineDone;
    baselineAt = rBase || 0;
  }

  const startedLeft = left.startedAt ? String(left.startedAt) : "";
  const startedRight = right.startedAt ? String(right.startedAt) : "";
  let startedAt = "";
  if (!startedLeft) startedAt = startedRight;
  else if (!startedRight) startedAt = startedLeft;
  else startedAt = startedLeft <= startedRight ? startedLeft : startedRight;

  return {
    sections,
    sectionsAt,
    baselineDone,
    baselineAt,
    startedAt,
    weeks: mergeMaps(left.weeks, right.weeks),
    cards: mergeMaps(left.cards, right.cards),
    attempts: mergeMaps(left.attempts, right.attempts),
    chunks: mergeMaps(left.chunks, right.chunks),
    kaokao: mergeMaps(left.kaokao, right.kaokao),
    kaokaoRetell: mergeMaps(left.kaokaoRetell, right.kaokaoRetell),
    doubts: mergeDoubts(left.doubts, right.doubts)
  };
}

function copyReviewCard(card) {
  if (!card || typeof card !== "object" || Array.isArray(card)) return card;
  return { ...card };
}

function emptyReviewStats() {
  return { remember: 0, wrong: 0, blank: 0 };
}

function createReviewSession(today, dueIds) {
  const order = [];
  const seen = new Set();
  for (const id of dueIds || []) {
    if (!id || seen.has(id)) continue;
    seen.add(id);
    order.push(id);
    if (order.length >= 60) break;
  }
  return {
    sessionDate: today,
    order,
    doneIds: [],
    currentId: order[0] || null,
    phase: "front",
    lastUndo: null,
    stats: emptyReviewStats()
  };
}

function cloneReviewSession(session) {
  const stats = session && session.stats ? session.stats : emptyReviewStats();
  const undo = session && session.lastUndo;
  return {
    sessionDate: session.sessionDate,
    order: (session.order || []).slice(),
    doneIds: (session.doneIds || []).slice(),
    currentId: session.currentId || null,
    phase: session.phase || "front",
    lastUndo: undo
      ? {
          cardId: undo.cardId,
          prevState: copyReviewCard(undo.prevState),
          wasDone: !!undo.wasDone,
          stat: undo.stat || ""
        }
      : null,
    stats: {
      remember: stats.remember || 0,
      wrong: stats.wrong || 0,
      blank: stats.blank || 0
    }
  };
}

function listPendingSkip(order, doneIds, cards, today) {
  const done = new Set(doneIds || []);
  const skipped = [];
  for (const id of order || []) {
    if (done.has(id)) continue;
    const card = cards && cards[id];
    if (!card || card.cleared || (card.due && card.due > today)) {
      skipped.push(id);
      done.add(id);
      continue;
    }
    return { currentId: id, skipped };
  }
  return { currentId: null, skipped };
}

function withSkipped(doneIds, skipped) {
  const done = (doneIds || []).slice();
  for (const id of skipped || []) {
    if (!done.includes(id)) done.push(id);
  }
  return done;
}

function reconcileReviewSession(session, today, dueIds, cards) {
  if (!session || session.sessionDate !== today || !Array.isArray(session.order) || session.order.length === 0) {
    return createReviewSession(today, dueIds);
  }
  const next = cloneReviewSession(session);
  const seen = new Set(next.order);
  for (const id of dueIds || []) {
    if (!id || seen.has(id)) continue;
    seen.add(id);
    next.order.push(id);
  }
  if (!next.currentId) {
    const found = listPendingSkip(next.order, next.doneIds, cards, today);
    next.doneIds = withSkipped(next.doneIds, found.skipped);
    next.currentId = found.currentId;
    if (found.currentId) next.phase = "front";
  }
  return next;
}

function gradeReview(session, cards, today, action, gradeCard) {
  if (!session || !session.currentId || typeof gradeCard !== "function") {
    return { session, card: null };
  }
  const id = session.currentId;
  const current = cards && cards[id];
  if (!current) return { session, card: null };
  const prevState = copyReviewCard(current);
  const graded = gradeCard(current, action, today);
  const next = cloneReviewSession(session);
  next.stats[action] = (next.stats[action] || 0) + 1;
  next.lastUndo = {
    cardId: id,
    prevState,
    wasDone: next.doneIds.includes(id),
    stat: action
  };
  if (action === "blank") {
    next.phase = "revealed";
    next.currentId = id;
    return { session: next, card: graded };
  }
  if (!next.doneIds.includes(id)) next.doneIds.push(id);
  const nextCards = { ...cards, [id]: graded };
  const found = listPendingSkip(next.order, next.doneIds, nextCards, today);
  next.doneIds = withSkipped(next.doneIds, found.skipped);
  next.currentId = found.currentId;
  next.phase = "front";
  return { session: next, card: graded };
}

function revealReviewAnswer(session) {
  if (!session || session.phase !== "front" || !session.currentId) return session;
  const next = cloneReviewSession(session);
  next.phase = "checking";
  return next;
}

function advanceReview(session, cards, today) {
  if (!session) return session;
  const next = cloneReviewSession(session);
  if (next.currentId && !next.doneIds.includes(next.currentId)) next.doneIds.push(next.currentId);
  const found = listPendingSkip(next.order, next.doneIds, cards, today);
  next.doneIds = withSkipped(next.doneIds, found.skipped);
  next.currentId = found.currentId;
  next.phase = "front";
  return next;
}

function undoReview(session) {
  if (!session || !session.lastUndo) return { session, card: null };
  const undo = session.lastUndo;
  const next = cloneReviewSession(session);
  next.doneIds = next.doneIds.filter((id) => id !== undo.cardId);
  if (undo.wasDone && !next.doneIds.includes(undo.cardId)) next.doneIds.push(undo.cardId);
  if (undo.stat && next.stats[undo.stat]) next.stats[undo.stat] -= 1;
  next.currentId = undo.cardId;
  next.phase = "front";
  next.lastUndo = null;
  return { session: next, card: copyReviewCard(undo.prevState) };
}

function countReviewRemaining(session, today, cards) {
  if (!session || session.sessionDate !== today || !Array.isArray(session.order) || session.order.length === 0) {
    return null;
  }
  const done = new Set(session.doneIds || []);
  let count = 0;
  for (const id of session.order) {
    if (done.has(id)) continue;
    const card = cards && cards[id];
    if (!card || card.cleared) continue;
    if (card.due && card.due > today) continue;
    count += 1;
  }
  return count;
}

const INLINE_KAOKAO_LIMIT = 15;
const POOL_DAILY_LIMIT = 20;

function anchorBlockId(anchor) {
  const matched = String(anchor || "").match(/b(\d+)\s*$/);
  return matched ? Number(matched[1]) : null;
}

function selectInlineKaokao(items, blocks, triedIds, limit) {
  const list = (Array.isArray(items) ? items : []).filter((item) => item);
  const blockList = Array.isArray(blocks) ? blocks : [];
  const indexById = new Map();
  blockList.forEach((block, index) => {
    const id = Number(block && block.id);
    if (Number.isFinite(id)) indexById.set(id, index);
  });
  const sorted = list.map((item) => {
    const blockId = anchorBlockId(item.anchor);
    const index = indexById.has(blockId) ? indexById.get(blockId) : blockList.length;
    return { item, index };
  }).sort((a, b) => a.index - b.index || String(a.item.id).localeCompare(String(b.item.id)));
  if (sorted.length <= limit) return sorted.map((entry) => entry.item);
  const tried = triedIds && typeof triedIds.has === "function" ? triedIds : new Set();
  const selected = new Set();
  for (const entry of sorted) {
    if (tried.has(entry.item.id)) selected.add(entry.item.id);
  }
  let remaining = limit - selected.size;
  const rest = sorted.filter((entry) => !selected.has(entry.item.id));
  const hasWhy = (entry) => !!(entry.item.why && entry.item.why.q);
  const hasDigit = (entry) => /\d/.test(String(entry.item.src || ""));
  const tiers = [
    rest.filter((entry) => hasWhy(entry)),
    rest.filter((entry) => !hasWhy(entry) && hasDigit(entry)),
    rest.filter((entry) => !hasWhy(entry) && !hasDigit(entry))
  ];
  for (const tier of tiers) {
    if (remaining <= 0 || !tier.length) continue;
    if (tier.length <= remaining) {
      for (const entry of tier) selected.add(entry.item.id);
      remaining -= tier.length;
      continue;
    }
    const n = tier.length;
    const k = remaining;
    for (let i = 0; i < k; i += 1) {
      selected.add(tier[Math.floor((i + 0.5) * n / k)].item.id);
    }
    remaining = 0;
  }
  return sorted.filter((entry) => selected.has(entry.item.id)).map((entry) => entry.item);
}

function pickPoolRelease(poolItems, releasedToday, limit) {
  const items = Array.isArray(poolItems) ? poolItems : [];
  const already = Math.max(0, Number(releasedToday) || 0);
  const room = Math.max(0, Number(limit) - already);
  return items.slice(0, room);
}

<script id="sync">
function createGithubSync({ fetch: fetchImpl, config, now = () => Date.now() } = {}) {
  if (typeof fetchImpl !== "function") {
    throw new Error("缺少 fetch");
  }
  const PROGRESS_PREFIX = "进度/";
  let snapshot = null;

  function emptyState() {
    return {
      sections: {},
      sectionsAt: {},
      baselineDone: false,
      baselineAt: 0,
      startedAt: "",
      weeks: {},
      cards: {},
      attempts: {},
      chunks: {},
      kaokao: {},
      kaokaoRetell: {},
      doubts: {}
    };
  }

  function cloneState(state) {
    return JSON.parse(JSON.stringify(state || emptyState()));
  }

  function publicState(state) {
    const copy = cloneState(state || emptyState());
    for (const kind of ["cards", "attempts"]) {
      const bucket = copy[kind];
      if (!bucket || typeof bucket !== "object") continue;
      for (const rec of Object.values(bucket)) {
        if (rec && typeof rec === "object") delete rec.unit;
      }
    }
    return copy;
  }

  function sortValue(value) {
    if (Array.isArray(value)) return value.map(sortValue);
    if (value && typeof value === "object") {
      const out = {};
      for (const key of Object.keys(value).sort()) out[key] = sortValue(value[key]);
      return out;
    }
    return value;
  }

  function stableStringify(value) {
    return JSON.stringify(sortValue(value), null, 2);
  }

  function utf8ToBase64(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = "";
    const size = 0x8000;
    for (let i = 0; i < bytes.length; i += size) {
      binary += String.fromCharCode(...bytes.subarray(i, i + size));
    }
    return btoa(binary);
  }

  function base64ToUtf8(b64) {
    const clean = String(b64 || "").replace(/\s/g, "");
    if (!clean) return "";
    const binary = atob(clean);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function canonText(text) {
    return String(text == null ? "" : text).replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\n+$/, "");
  }

  function decodeBlob(blob) {
    if (!blob) return "";
    const encoding = String(blob.encoding || "base64").toLowerCase();
    if (encoding === "base64") return base64ToUtf8(blob.content);
    return String(blob.content || "");
  }

  function resolveUnit(id, rec) {
    if (rec && typeof rec.unit === "string" && rec.unit.trim()) return rec.unit.trim();
    const source = `${id || ""} ${rec && rec.qid ? rec.qid : ""}`;
    const matched = source.match(/U\d+/);
    return matched ? matched[0] : "unknown";
  }

  function fileRecord(rec) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) return rec;
    if (!Object.prototype.hasOwnProperty.call(rec, "unit")) return rec;
    const copy = { ...rec };
    delete copy.unit;
    return copy;
  }

  function groupByUnit(records) {
    const grouped = {};
    for (const [id, rec] of Object.entries(records || {})) {
      const unit = resolveUnit(id, rec);
      if (!grouped[unit]) grouped[unit] = {};
      grouped[unit][id] = fileRecord(rec);
    }
    return grouped;
  }

  function buildProgressFiles(state) {
    const src = state || emptyState();
    const files = {};
    files[`${PROGRESS_PREFIX}state.json`] = stableStringify({
      version: 1,
      sections: src.sections || {},
      sectionsAt: src.sectionsAt || {},
      baselineDone: !!src.baselineDone,
      baselineAt: Number(src.baselineAt) || 0,
      startedAt: src.startedAt || "",
      weeks: src.weeks || {},
      chunks: src.chunks || {}
    });
    const cards = groupByUnit(src.cards);
    for (const unit of Object.keys(cards).sort()) {
      files[`${PROGRESS_PREFIX}cards/${unit}.json`] = stableStringify(cards[unit]);
    }
    const attempts = groupByUnit(src.attempts);
    for (const unit of Object.keys(attempts).sort()) {
      files[`${PROGRESS_PREFIX}attempts/${unit}.json`] = stableStringify(attempts[unit]);
    }
    const kaokaoItems = groupByUnit(src.kaokao);
    const kaokaoRetell = groupByUnit(src.kaokaoRetell);
    const kaokaoUnits = new Set([...Object.keys(kaokaoItems), ...Object.keys(kaokaoRetell)]);
    for (const unit of [...kaokaoUnits].sort()) {
      files[`${PROGRESS_PREFIX}kaokao/${unit}.json`] = stableStringify({
        items: kaokaoItems[unit] || {},
        retell: kaokaoRetell[unit] || {}
      });
    }
    const doubts = groupByUnit(src.doubts);
    for (const unit of Object.keys(doubts).sort()) {
      files[`${PROGRESS_PREFIX}doubts/${unit}.json`] = stableStringify({
        items: doubts[unit] || {}
      });
    }
    return files;
  }

  function changedPaths(state) {
    const files = buildProgressFiles(state);
    const texts = snapshot ? snapshot.texts : new Map();
    const paths = [];
    for (const path of Object.keys(files)) {
      const text = files[path];
      if (!texts.has(path) || canonText(texts.get(path)) !== canonText(text)) paths.push(path);
    }
    return { files, paths };
  }

  function isProgressJson(filePath) {
    return typeof filePath === "string" && filePath.startsWith(PROGRESS_PREFIX) && filePath.endsWith(".json");
  }

  function unitFromPath(filePath) {
    const match = /^进度\/(?:cards|attempts|kaokao|doubts)\/([^/]+)\.json$/.exec(filePath || "");
    return match ? match[1] : "";
  }

  function absorbRecords(bucket, json, unit) {
    if (!json || typeof json !== "object" || Array.isArray(json)) return;
    for (const [id, rec] of Object.entries(json)) {
      if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
      const copy = { ...rec };
      if (unit) copy.unit = unit;
      bucket[id] = copy;
    }
  }

  function stateFromTexts(texts) {
    const remote = emptyState();
    for (const [filePath, text] of texts.entries()) {
      let json;
      try {
        json = JSON.parse(text);
      } catch (_) {
        const err = new Error("远端进度无法解析");
        throw err;
      }
      if (!json || typeof json !== "object" || Array.isArray(json)) continue;
      if (filePath === `${PROGRESS_PREFIX}state.json`) {
        remote.sections = json.sections || {};
        remote.sectionsAt = json.sectionsAt || {};
        if (Object.prototype.hasOwnProperty.call(json, "baselineDone")) remote.baselineDone = !!json.baselineDone;
        if (Object.prototype.hasOwnProperty.call(json, "baselineAt")) remote.baselineAt = Number(json.baselineAt) || 0;
        if (json.startedAt) remote.startedAt = String(json.startedAt);
        remote.weeks = json.weeks || {};
        remote.chunks = json.chunks && typeof json.chunks === "object" && !Array.isArray(json.chunks) ? json.chunks : {};
      } else if (filePath.startsWith(`${PROGRESS_PREFIX}cards/`)) {
        absorbRecords(remote.cards, json, unitFromPath(filePath));
      } else if (filePath.startsWith(`${PROGRESS_PREFIX}attempts/`)) {
        absorbRecords(remote.attempts, json, unitFromPath(filePath));
      } else if (filePath.startsWith(`${PROGRESS_PREFIX}kaokao/`)) {
        const unit = unitFromPath(filePath);
        absorbRecords(remote.kaokao, json.items, unit);
        absorbRecords(remote.kaokaoRetell, json.retell, unit);
      } else if (filePath.startsWith(`${PROGRESS_PREFIX}doubts/`)) {
        absorbRecords(remote.doubts, json.items, unitFromPath(filePath));
      }
    }
    return remote;
  }

  function fallbackMessage() {
    const ms = now();
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }).formatToParts(new Date(ms));
    const get = (type) => {
      const found = parts.find((part) => part.type === type);
      return found ? found.value : "";
    };
    return `进度：${get("year")}-${get("month")}-${get("day")} ${get("hour")}:${get("minute")}`;
  }

  async function request(method, suffix, body) {
    const cfg = config || {};
    if (!cfg.token) {
      const err = new Error("还没有令牌");
      err.code = "no-token";
      throw err;
    }
    const headers = {
      Authorization: `Bearer ${cfg.token}`,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const owner = encodeURIComponent(cfg.owner || "");
    const repo = encodeURIComponent(cfg.repo || "");
    let res;
    try {
      res = await fetchImpl(`https://api.github.com/repos/${owner}/${repo}${suffix}`, {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body)
      });
    } catch (_) {
      const err = new Error("网络不通");
      err.network = true;
      throw err;
    }
    const text = await res.text();
    let data = null;
    if (text) {
      try { data = JSON.parse(text); } catch (_) { data = null; }
    }
    if (!res.ok) {
      const err = new Error("同步失败");
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function loadSnapshot() {
    const cfg = config || {};
    const ref = await request("GET", `/git/ref/heads/${encodeURIComponent(cfg.branch || "")}`);
    const headSha = ref && ref.object && ref.object.sha;
    if (!headSha) {
      const err = new Error("找不到分支");
      throw err;
    }
    if (snapshot && snapshot.headSha === headSha) return snapshot;
    const commit = await request("GET", `/git/commits/${headSha}`);
    const treeSha = commit && commit.tree && commit.tree.sha;
    if (!treeSha) {
      const err = new Error("找不到目录树");
      throw err;
    }
    const tree = await request("GET", `/git/trees/${treeSha}?recursive=1`);
    if (tree && tree.truncated) {
      const err = new Error("远端文件没读全");
      throw err;
    }
    const texts = new Map();
    const blobs = ((tree && tree.tree) || []).filter((item) => item && item.type === "blob" && isProgressJson(item.path));
    for (const item of blobs) {
      const blob = await request("GET", `/git/blobs/${item.sha}`);
      texts.set(item.path, decodeBlob(blob));
    }
    snapshot = { headSha, treeSha, texts, state: stateFromTexts(texts) };
    return snapshot;
  }

  async function pull() {
    const current = await loadSnapshot();
    return { headSha: current.headSha, state: publicState(current.state) };
  }

  async function testConnection() {
    const repo = await request("GET", "");
    const flag = repo && repo.permissions ? repo.permissions.push : undefined;
    return { ok: true, canPush: flag === true ? true : flag === false ? false : null };
  }

  function changedFiles(localState) {
    return changedPaths(localState).paths;
  }

  async function push(localState, options) {
    const opts = options || {};
    if (typeof mergeStates !== "function") {
      const err = new Error("mergeStates 不可用");
      throw err;
    }
    for (let attempt = 1; attempt <= 3; attempt += 1) {
      const current = await loadSnapshot();
      const local = typeof opts.readLocal === "function" ? opts.readLocal() : localState;
      const merged = mergeStates(local, current.state);
      const diff = changedPaths(merged);
      if (!diff.paths.length) {
        return { commitSha: current.headSha, changedFiles: [], state: publicState(merged) };
      }
      if (!current.treeSha || !current.headSha) {
        const err = new Error("没有可基于的提交");
        throw err;
      }
      const entries = [];
      for (const path of diff.paths) {
        const blob = await request("POST", "/git/blobs", {
          content: utf8ToBase64(diff.files[path]),
          encoding: "base64"
        });
        if (!blob || !blob.sha) {
          const err = new Error("blob 没写上");
          throw err;
        }
        entries.push({ path, mode: "100644", type: "blob", sha: blob.sha });
      }
      const tree = await request("POST", "/git/trees", {
        base_tree: current.treeSha,
        tree: entries
      });
      if (!tree || !tree.sha) {
        const err = new Error("目录树没写上");
        throw err;
      }
      const message = typeof opts.message === "function" ? opts.message() : (opts.message || fallbackMessage());
      const commit = await request("POST", "/git/commits", {
        message,
        tree: tree.sha,
        parents: [current.headSha]
      });
      if (!commit || !commit.sha) {
        const err = new Error("提交没写上");
        throw err;
      }
      try {
        const cfg = config || {};
        await request("PATCH", `/git/refs/heads/${encodeURIComponent(cfg.branch || "")}`, {
          sha: commit.sha,
          force: false
        });
      } catch (err) {
        if (err && err.status === 422 && attempt < 3) {
          snapshot = null;
          continue;
        }
        throw err;
      }
      const texts = new Map(current.texts);
      for (const [path, text] of Object.entries(diff.files)) texts.set(path, text);
      snapshot = {
        headSha: commit.sha,
        treeSha: tree.sha,
        texts,
        state: cloneState(merged)
      };
      return { commitSha: commit.sha, changedFiles: diff.paths.slice(), state: publicState(merged) };
    }
    const err = new Error("远端有新提交");
    err.status = 422;
    throw err;
  }

  async function getRaw(path) {
    const cfg = config || {};
    if (!cfg.token) {
      const err = new Error("还没有令牌");
      err.code = "no-token";
      throw err;
    }
    const encodedPath = String(path || "").split("/").filter(Boolean).map((part) => encodeURIComponent(part)).join("/");
    const owner = encodeURIComponent(cfg.owner || "");
    const repo = encodeURIComponent(cfg.repo || "");
    const branch = encodeURIComponent(cfg.branch || "");
    const headers = {
      Authorization: `Bearer ${cfg.token}`,
      Accept: "application/vnd.github.raw+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
    let res;
    try {
      res = await fetchImpl(`https://api.github.com/repos/${owner}/${repo}/contents/${encodedPath}?ref=${branch}`, {
        method: "GET",
        headers
      });
    } catch (_) {
      const err = new Error("网络不通");
      err.network = true;
      throw err;
    }
    if (!res.ok) {
      const err = new Error("读取失败");
      err.status = res.status;
      throw err;
    }
    return res;
  }

  return { pull, push, testConnection, changedFiles, getRaw };
}

<script>
const APP_VERSION = "2026-10-30.2";
const QA_DIRECT_KEY = "study-qa-direct-v1";
const QA_DIRECT_PROVIDERS = [
  ["deepseek", "DeepSeek"],
  ["dashscope", "阿里 DashScope"],
  ["anthropic", "Anthropic"],
  ["openai-compatible", "自定义 OpenAI 兼容"]
];
let qaApi = null;
let qaLoadPromise = null;
const qaPanels = new Map();
let swControllerReload = false;
const INTERVALS = [1, 3, 7, 14, 30, 60];

function studyTodayOverride() {
  try {
    if (typeof mockRepoOn !== "function" || !mockRepoOn()) return "";
    const value = new URLSearchParams(location.search).get("today") || "";
    return /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : "";
  } catch (_) {
    return "";
  }
}

function shanghaiToday(date = new Date()) {
  const override = studyTodayOverride();
  if (override) return override;
  const formatter = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Shanghai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  });
  return formatter.format(date);
}

function parseYmd(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return Date.UTC(y, m - 1, d);
}

function addDaysYmd(ymd, days) {
  const ms = parseYmd(ymd) + days * 86400000;
  return new Date(ms).toISOString().slice(0, 10);
}

function diffDaysYmd(fromYmd, toYmd) {
  return Math.floor((parseYmd(toYmd) - parseYmd(fromYmd)) / 86400000);
}

function nextCardRemember(card, today) {
  const next = { ...card };
  const nextStreak = (next.streak || 0) + 1;
  next.streak = nextStreak;
  if (nextStreak === 1) {
    next.streakStart = today;
  }
  const nextBox = Math.min((next.box || 0) + 1, 5);
  next.box = nextBox;
  next.due = addDaysYmd(today, INTERVALS[nextBox]);
  return next;
}

function nextCardForget(card, today) {
  return {
    ...card,
    streak: 0,
    streakStart: null,
    box: 0,
    due: addDaysYmd(today, 1)
  };
}

function shouldClearWrongCard(card, today) {
  if (card.src !== "wrong" || !card.streakStart) return false;
  return (card.streak || 0) >= 3 && diffDaysYmd(card.streakStart, today) > 21;
}

function planSkeletonIntroductions(cards, states, today, activeUnits, cap) {
  const limit = typeof cap === "number" ? cap : 10;
  const active = new Set(activeUnits || []);
  const byUnit = new Map();
  for (const card of cards || []) {
    if (!card || !active.has(card.unit)) continue;
    if (!byUnit.has(card.unit)) byUnit.set(card.unit, []);
    byUnit.get(card.unit).push(card);
  }
  const newcomers = [];
  for (const list of byUnit.values()) {
    const ordered = list.slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    let introducedToday = 0;
    for (const card of ordered) {
      const state = states && states[card.id];
      if (state && state.created === today) introducedToday += 1;
    }
    let slots = limit - introducedToday;
    if (slots < 0) slots = 0;
    for (const card of ordered) {
      if (slots <= 0) break;
      if (states && states[card.id]) continue;
      newcomers.push(card);
      slots -= 1;
    }
  }
  return newcomers;
}

function newSkeletonCardState(today) {
  return {
    box: 0,
    due: today,
    streak: 0,
    streakStart: null,
    cleared: false,
    src: "skeleton",
    created: today,
    updatedAt: 1,
    intro: true
  };
}

function shouldActivateSkeletons(tokenConfigured, initialPullSettled) {
  return !tokenConfigured || !!initialPullSettled;
}

function isMultiSelect(type) {
  return type === "多选" || type === "案例";
}

function normalizeChoice(choice, type) {
  if (!choice) return "";
  if (isMultiSelect(type)) {
    return [...new Set(choice.split("").filter(Boolean))].sort().join("");
  }
  return choice;
}

function compareAnswer(choice, answer, type) {
  if (!choice || !answer) return false;
  const expected = String(answer).trim();
  if (isMultiSelect(type)) {
    return normalizeChoice(choice, type) === normalizeChoice(expected, type);
  }
  return String(choice).trim() === expected;
}

const EXAM_DATE = "2027-11-08"; // 按往年 11 月初估计，出公告后改
const STORAGE_KEY = "study-state-cache-v1";
const GITHUB_CONFIG_KEY = "study-github-config";
const SYNC_META_KEY = "study-github-sync";
const NAV_TABS = ["today", "practice", "review", "map", "week", "plan"];
const VALID_TABS = NAV_TABS.concat(["settings"]);

const BOOK_NAMES = {

function bookName(code) {
  return BOOK_NAMES[code] || code || "";
}

function printedFromAnchor(anchor) {
  const match = /^([A-Z]+):p(\d+)/.exec(String(anchor || ""));
  if (!match || !Object.prototype.hasOwnProperty.call(BOOK_PAGE_OFFSET, match[1])) return null;
  return {
    book: match[1],
    name: bookName(match[1]),
    printed: Number(match[2]) + BOOK_PAGE_OFFSET[match[1]]
  };
}

function anchorPrintedHtml(anchor) {
  const info = printedFromAnchor(anchor);
  if (!info) return "";
  return `<p class="small">在教材中：${info.name} 印刷页 <span class="mono">${info.printed}</span></p>`;
}

function stemPreview(stem) {
  const text = String(stem || "").replace(/\s+/g, " ").trim();
  if (!text) return "（无题干）";
  if (text.length <= 40) return text;
  return `${text.slice(0, 40)}…`;
}

function safeParse(raw) {
  try {
    return JSON.parse(raw);
  } catch (_) {
    return null;
  }
}

function cloneObj(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function loadStateFromLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      app.state = createDefaultState();
      return;
    }
    const parsed = safeParse(raw);
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return;
    app.state = coerceState(parsed, { fillStarted: true });
    saveStateToLocal();
  } catch (_) {
    app.state = createDefaultState();
  }
}

function saveStateToLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(app.state));
  } catch (_) {}
}

function onChange(fn) {
  app.listeners.add(fn);
}

function emitChange() {
  for (const fn of app.listeners) fn(app.state);
}

function getState() {
  return app.state;

function unitForCardId(cardId) {
  const skeleton = app.derived.cardById.get(cardId);
  if (skeleton && skeleton.unit) return skeleton.unit;
  const state = app.state.cards[cardId];
  const qid = (state && state.qid) || (String(cardId).startsWith("WQ-") ? String(cardId).slice(3) : "");
  if (qid) {
    const question = app.derived.questionById.get(qid);
    if (question && question.unit) return question.unit;
  }
  if (state && state.src === "kaokao") {
    const fromKid = String(state.kid || "").match(/U\d+/);
    if (fromKid) return fromKid[0];
  }
  const fromId = String(cardId || "").match(/U\d+/);
  if (fromId) return fromId[0];
  return "unknown";
}

function unitForQuestionId(questionId) {
  const question = app.derived.questionById.get(questionId);
  return (question && question.unit) || "unknown";
}

function copyRecords(source, target) {
  if (!source || typeof source !== "object" || Array.isArray(source)) return;
  for (const [id, rec] of Object.entries(source)) {
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    target[id] = { ...rec, updatedAt: Number(rec.updatedAt) || 0 };
  }
}

function coerceState(input, options) {
  const fillStarted = !options || options.fillStarted !== false;
  const src = input && typeof input === "object" && !Array.isArray(input) ? input : {};
  const state = {
    sections: {},
    sectionsAt: {},
    baselineDone: !!src.baselineDone,
    baselineAt: src.baselineAt == null || src.baselineAt === "" ? 0 : (Number(src.baselineAt) || 0),
    startedAt: src.startedAt ? String(src.startedAt) : (fillStarted ? shanghaiToday() : ""),
    cards: {},
    attempts: {},
    weeks: {},
    chunks: {},
    kaokao: {},
    kaokaoRetell: {},
    doubts: {}
  };
  const sections = src.sections && typeof src.sections === "object" && !Array.isArray(src.sections) ? src.sections : {};
  const sectionsAt = src.sectionsAt && typeof src.sectionsAt === "object" && !Array.isArray(src.sectionsAt) ? src.sectionsAt : {};
  for (const id of Object.keys(sections)) {
    const status = Number(sections[id]);
    state.sections[id] = status >= 0 && status <= 3 ? status : 0;
    const at = sectionsAt[id];
    state.sectionsAt[id] = at == null || at === "" ? 0 : (Number(at) || 0);
  }
  for (const id of Object.keys(sectionsAt)) {
    if (!Object.prototype.hasOwnProperty.call(state.sectionsAt, id)) {
      state.sectionsAt[id] = Number(sectionsAt[id]) || 0;
    }
  }
  copyRecords(src.cards, state.cards);
  copyRecords(src.attempts, state.attempts);
  copyRecords(src.weeks, state.weeks);
  copyRecords(src.chunks, state.chunks);
  copyRecords(src.kaokao, state.kaokao);
  copyRecords(src.kaokaoRetell, state.kaokaoRetell);
  copyRecords(src.doubts, state.doubts);
  return state;
}

function withoutStamp(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) return JSON.stringify(value);
  const copy = { ...value };
  delete copy.updatedAt;
  return JSON.stringify(copy);
}

function isUnchanged(path, value) {
  if (path === "baselineDone") return !!app.state.baselineDone === !!value;
  const slash = path.indexOf("/");
  if (slash <= 0) return false;
  const kind = path.slice(0, slash);
  const id = path.slice(slash + 1);
  const bucket = app.state[kind];
  if (!bucket || !Object.prototype.hasOwnProperty.call(bucket, id)) return false;
  const prev = bucket[id];
  if (kind === "sections") return Number(prev) === Number(value);
  return withoutStamp(prev) === withoutStamp(value);
}

function countAttemptDelta(path, value) {
  if (!path.startsWith("attempts/")) return;
  const id = path.slice("attempts/".length);
  const prev = app.state.attempts[id];
  const prevN = prev && Array.isArray(prev.tries) ? prev.tries.length : 0;
  const nextN = value && Array.isArray(value.tries) ? value.tries.length : 0;
  if (nextN > prevN) app.sync.sessionAttempts += nextN - prevN;
}

function stampSavedRecord(value, options, now) {
  const next = { ...(value && typeof value === "object" && !Array.isArray(value) ? value : {}) };
  if (options && options.keepUpdatedAt) {
    const at = Number(next.updatedAt);
    next.updatedAt = Number.isFinite(at) ? at : 0;
  } else {
    next.updatedAt = now;
  }
  return next;
}

function cardWriteValue(value, options, now) {
  const next = stampSavedRecord(value, options, now);
  if (!(options && options.keepUpdatedAt)) delete next.intro;
  return next;
}

function setNestedState(path, value, options) {
  const keepUpdatedAt = !!(options && options.keepUpdatedAt);
  const now = Date.now();
  if (!app.state.sectionsAt) app.state.sectionsAt = {};
  const slash = path.indexOf("/");
  const kind = slash >= 0 ? path.slice(0, slash) : path;
  const id = slash >= 0 ? path.slice(slash + 1) : "";
  if (kind === "sections" && id) {
    app.state.sections[id] = value;
    if (!keepUpdatedAt) app.state.sectionsAt[id] = now;
  } else if (kind === "cards" && id) {
    app.state.cards[id] = cardWriteValue(value, options, now);
  } else if (kind === "attempts" && id) {
    app.state.attempts[id] = stampSavedRecord(value, options, now);
  } else if (kind === "weeks" && id) {
    app.state.weeks[id] = stampSavedRecord(value, options, now);
  } else if (kind === "chunks" && id) {
    if (!app.state.chunks) app.state.chunks = {};
    app.state.chunks[id] = stampSavedRecord(value, options, now);
  } else if (kind === "kaokao" && id) {
    if (!app.state.kaokao) app.state.kaokao = {};
    app.state.kaokao[id] = stampSavedRecord(value, options, now);
  } else if (kind === "kaokaoRetell" && id) {
    if (!app.state.kaokaoRetell) app.state.kaokaoRetell = {};
    app.state.kaokaoRetell[id] = stampSavedRecord(value, options, now);
  } else if (kind === "doubts" && id) {
    if (!app.state.doubts) app.state.doubts = {};
    app.state.doubts[id] = stampSavedRecord(value, options, now);
  } else if (path === "startedAt") {
    app.state.startedAt = value;
  } else if (path === "baselineDone") {
    app.state.baselineDone = !!value;
    if (!keepUpdatedAt) app.state.baselineAt = now;
  }
}

function save(path, value, options) {
  if (isUnchanged(path, value)) return;
  countAttemptDelta(path, value);
  if (options?.requirePersistence && path.startsWith("doubts/") && path.length > 7) {
    const id = path.slice(7);
    const nextState = { ...app.state, doubts: { ...app.state.doubts,
      [id]: stampSavedRecord(value, options, Date.now()) } };
    // The QA module must know that the question is durable before it sends it.
    // A failed write leaves the previous in-memory state and input intact.
    localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
    app.state = nextState;
  } else {
    setNestedState(path, value, options);
    saveStateToLocal();
  }
  if (!hasToken()) {
    app.sync.phase = "disconnected";
    app.sync.errorText = "";
  } else {
    app.sync.dirty = true;
    if (app.sync.busy) {
      app.sync.pendingAgain = true;
    } else {
      app.sync.phase = "dirty";
      clearTimeout(app.sync.debounce);
      app.sync.debounce = setTimeout(() => requestPush("debounce"), 20000);
    }
  }
  if (!(options && options.silent)) emitChange();
  renderSyncStatus();
}

function hasToken() {
  return !!(app.githubConfig && app.githubConfig.token);
}

function loadGithubConfig() {
  const defaults = {
    token: "",
    owner: DEFAULT_GITHUB.owner,
    repo: DEFAULT_GITHUB.repo,
    branch: DEFAULT_GITHUB.branch
  };
  try {
    const raw = localStorage.getItem(GITHUB_CONFIG_KEY);
    const parsed = raw ? safeParse(raw) : null;
    if (!parsed || typeof parsed !== "object") return { ...defaults };
    return {
      token: typeof parsed.token === "string" ? parsed.token : "",
      owner: typeof parsed.owner === "string" && parsed.owner.trim() ? parsed.owner.trim() : defaults.owner,
      repo: typeof parsed.repo === "string" && parsed.repo.trim() ? parsed.repo.trim() : defaults.repo,
      branch: typeof parsed.branch === "string" && parsed.branch.trim() ? parsed.branch.trim() : defaults.branch
    };
  } catch (_) {
    return { ...defaults };
  }
}

function saveGithubConfig(cfg) {
  const next = {
    token: cfg && typeof cfg.token === "string" ? cfg.token : "",
    owner: cfg && typeof cfg.owner === "string" && cfg.owner.trim() ? cfg.owner.trim() : DEFAULT_GITHUB.owner,
    repo: cfg && typeof cfg.repo === "string" && cfg.repo.trim() ? cfg.repo.trim() : DEFAULT_GITHUB.repo,
    branch: cfg && typeof cfg.branch === "string" && cfg.branch.trim() ? cfg.branch.trim() : DEFAULT_GITHUB.branch
  };
  app.githubConfig = next;
  try {
    localStorage.setItem(GITHUB_CONFIG_KEY, JSON.stringify(next));
  } catch (_) {}
  return next;
}

function loadDirectConfig() {
  const empty = { provider: "", model: "", baseUrl: "", apiKey: "", dailyLimit: 30 };
  try {
    const parsed = JSON.parse(localStorage.getItem(QA_DIRECT_KEY) || "{}");
    const provider = QA_DIRECT_PROVIDERS.some(([id]) => id === parsed.provider) ? parsed.provider : "";
    const model = typeof parsed.model === "string" ? parsed.model : "";
    const baseUrl = typeof parsed.baseUrl === "string" ? parsed.baseUrl : "";
    const apiKey = typeof parsed.apiKey === "string" ? parsed.apiKey : "";
    const limit = Number(parsed.dailyLimit);
    const dailyLimit = Number.isInteger(limit) && limit >= 1 && limit <= 200 ? limit : 30;
    return { provider, model, baseUrl, apiKey, dailyLimit };
  } catch (_) { return empty; }
}

function readQaDirectDraft() {
  const saved = loadDirectConfig();
  const providerEl = document.getElementById("qa-provider");
  const modelEl = document.getElementById("qa-model");
  const baseEl = document.getElementById("qa-base-url");
  const keyEl = document.getElementById("qa-api-key");
  const limitEl = document.getElementById("qa-daily-limit");
  const provider = providerEl ? providerEl.value : saved.provider;
  const model = modelEl ? modelEl.value.trim() : saved.model;
  const baseUrl = baseEl ? baseEl.value.trim() : saved.baseUrl;
  const typedKey = keyEl ? keyEl.value.trim() : "";
  let dailyLimit = saved.dailyLimit;
  if (limitEl && limitEl.value.trim()) {
    const parsed = Number(limitEl.value.trim());
    dailyLimit = Number.isInteger(parsed) ? parsed : NaN;
  }
  return { provider, model, baseUrl, apiKey: typedKey || saved.apiKey, dailyLimit };
}

function qaBaseUrlProblem(baseUrl) {
  const value = String(baseUrl || "").trim();
  if (!value) return "请填写自定义地址。";
  let url;
  try { url = new URL(value); }
  catch (_) { return "自定义地址格式不正确。"; }
  if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash) {
    return "自定义地址必须是 https，且不能带用户名、密码、查询参数或 #。";
  }
  return "";
}

function qaDirectProblem(draft, { requireLimit = true } = {}) {
  if (!QA_DIRECT_PROVIDERS.some(([id]) => id === draft.provider)) return "请选择厂商。";
  if (!draft.model) return "请填写模型名。";
  if (draft.provider === "openai-compatible") {
    const urlError = qaBaseUrlProblem(draft.baseUrl);
    if (urlError) return urlError;
  }
  if (!draft.apiKey) return "请填写钥匙。";
  if (/^(gh[pousr]_|github_pat_)/i.test(draft.apiKey)) return "这里需要答疑专用凭证，不能使用 GitHub 同步令牌。";
  if (requireLimit && (!Number.isInteger(draft.dailyLimit) || draft.dailyLimit < 1 || draft.dailyLimit > 200)) {
    return "每天最多提问次数要在 1 到 200 之间。";
  }
  return "";
}

function shanghaiCalendarDay(ms) {
  const parts = shanghaiParts(ms);
  return parts.y && parts.m && parts.d ? `${parts.y}-${parts.m}-${parts.d}` : "";
}

function qaTodayTurnCount() {
  const today = shanghaiCalendarDay(Date.now());
  if (!today || !app.state || !app.state.doubts) return 0;
  let count = 0;
  for (const rec of Object.values(app.state.doubts)) {
    const turns = rec && rec.qa && rec.qa.turns;
    if (!turns || typeof turns !== "object") continue;
    for (const turn of Object.values(turns)) {
      const created = Number(turn && turn.createdAt);
      if (!Number.isFinite(created)) continue;
      if (shanghaiCalendarDay(created) === today) count += 1;
    }
  }
  return count;
}

function limitClient(client, allowed) {
  return {
    get configured() { return client.configured; },
    answer(request, options) {
      try {
        if (!allowed(request)) return Promise.reject(new qaApi.QaError("DAILY_LIMIT"));
      } catch (error) {
        return Promise.reject(error);
      }
      return client.answer(request, options);
    }
  };
}

function directPingRequest() {
  const requestId = globalThis.crypto && typeof crypto.randomUUID === "function"
    ? crypto.randomUUID()
    : `ping-${Date.now()}`;
  return {
    v: 1,
    requestId,
    threadId: "qa-ping:1",
    unit: "U00",
    chunkId: "qa-ping",
    blockId: "1",
    book: "SWX",
    question: "用一句话说明火灾自动报警系统的作用",
    context: [{
      anchor: "SWX:p1:b1",
      kind: "para",
      text: "火灾自动报警系统用于尽早发现火灾并发出警报。"
    }],
    history: []
  };
}

function saveQaDirectSettings(event) {
  event.preventDefault();
  const message = document.getElementById("qa-settings-message");
  const draft = readQaDirectDraft();
  const problem = qaDirectProblem(draft);
  if (problem) {
    if (message) message.textContent = problem;
    return;
  }
  const next = {
    provider: draft.provider,
    model: draft.model,
    baseUrl: draft.baseUrl,
    apiKey: draft.apiKey,
    dailyLimit: draft.dailyLimit
  };
  try { localStorage.setItem(QA_DIRECT_KEY, JSON.stringify(next)); }
  catch (_) {
    if (message) message.textContent = "设置未保存，请重试。";
    return;
  }
  destroyQaPanels();
  renderSettings();
  const status = document.getElementById("qa-settings-message");
  if (status) status.textContent = "当场问设置已保存在这台设备上。";
}

function clearQaDirectKey() {
  const cfg = loadDirectConfig();
  const next = { provider: cfg.provider, model: cfg.model, baseUrl: cfg.baseUrl, apiKey: "", dailyLimit: cfg.dailyLimit };
  try { localStorage.setItem(QA_DIRECT_KEY, JSON.stringify(next)); }
  catch (_) {
    const message = document.getElementById("qa-settings-message");
    if (message) message.textContent = "清除未成功，请重试。";
    return;
  }
  destroyQaPanels();
  renderSettings();
  const status = document.getElementById("qa-settings-message");
  if (status) status.textContent = "钥匙已从这台设备清除。";
}

async function testDirectConnection() {
  const message = document.getElementById("qa-settings-message");
  const button = document.getElementById("qa-direct-test");
  if (!message || (button && button.disabled)) return;
  const draft = readQaDirectDraft();
  const problem = qaDirectProblem(draft, { requireLimit: false });
  if (problem) {
    message.textContent = problem;
    return;
  }
  if (!qaApi) await loadQaModule();
  if (!qaApi || !qaApi.createDirectClient) {
    message.textContent = "当场问模块还没载入，请联网刷新后再试。";
    return;
  }
  if (button) button.disabled = true;
  message.textContent = "正在测试连接…";
  const started = Date.now();
  try {
    const client = qaApi.createDirectClient({
      provider: draft.provider,
      model: draft.model,
      baseUrl: draft.baseUrl,
      getApiKey: () => draft.apiKey
    });
    const response = await client.answer(directPingRequest());
    const seconds = Math.max(1, Math.round((Date.now() - started) / 1000));
    const by = response && response.answer && response.answer.by ? response.answer.by : `${draft.provider}/${draft.model}`;
    const current = document.getElementById("qa-settings-message");
    if (current) current.textContent = `连通了：${by}，用时 ${seconds} 秒`;
  } catch (error) {
    const failure = qaApi.errorRecord ? qaApi.errorRecord(error) : null;
    const current = document.getElementById("qa-settings-message");
    if (current) current.textContent = failure && failure.message ? failure.message : "测试没有完成，请稍后重试。";
  } finally {
    const currentButton = document.getElementById("qa-direct-test");
    if (currentButton) currentButton.disabled = false;
  }
}

function destroyQaPanels() {
  for (const panel of qaPanels.values()) panel.handle.destroy();
  qaPanels.clear();
}

function loadQaModule() {
  if (qaLoadPromise) return qaLoadPromise;
  qaLoadPromise = import("./modules/qa/index.js").then((api) => {
    qaApi = api;
    flushDoubtInputs();
    render();
    return api;
  }).catch(() => {
    // Reading and existing progress remain usable when the optional module is unavailable.
    return null;
  });
  return qaLoadPromise;
}

function studyQaContext(meta, blockId) {
  const blocks = app.study.bodies[meta.id]?.blocks || [];
  const index = blocks.findIndex((block) => String(block.id) === String(blockId));
  if (index < 0) return null;
  const positions = new Set([index]);
  if (index > 0) positions.add(index - 1);
  if (index + 1 < blocks.length) positions.add(index + 1);
  for (let i = index - 1; i >= 0; i -= 1) {
    if (/^h[3-6]$/.test(blocks[i].kind)) { positions.add(i); break; }
  }
  const context = [...positions].sort((a, b) => a - b).map((i) => blocks[i])
    .filter((block) => Number.isFinite(Number(block.page)))
    .map((block) => {
      const kind = block.kind || "para";
      const text = kind === "figure"
        ? (markdownPlain(block.md) || "图片（无图题）")
        : markdownPlain(String(block.md || "").replace(/<\/t[dh]>/gi, " | ").replace(/<\/tr>/gi, "\n"));
      return { anchor: `${meta.book}:p${block.page}:b${block.id}`, kind, text };
    })
    .filter((part) => part.text);
  return { unit: meta.unit, chunkId: meta.id, blockId: String(blockId), book: meta.book, context,
    label: `${bookName(meta.book)} · ${meta.title || meta.id} · 原文第 ${blocks[index].printed ?? blocks[index].page} 页` };
}

function mountStudyQa(meta) {
  if (!qaApi) return;
  const root = document.getElementById("page-learn");
  const active = new Set();
  const cfg = loadDirectConfig();
  // 提问先写入 turn 再调用 answer，所以用 <=：第 limit 次仍能发出，重试不会再增加条数。
  const client = limitClient(qaApi.createDirectClient({
    provider: cfg.provider,
    model: cfg.model,
    baseUrl: cfg.baseUrl,
    getApiKey: () => loadDirectConfig().apiKey
  }), () => qaTodayTurnCount() <= loadDirectConfig().dailyLimit);
  for (const placeholder of root.querySelectorAll("[data-qa-block]")) {
    const blockId = placeholder.dataset.qaBlock;
    const id = doubtKey(meta.id, blockId);
    const context = studyQaContext(meta, blockId);
    if (!context || !activeDoubt(meta.id, blockId)) continue;
    const signature = qaApi.contextKey(context);
    active.add(id);
    const existing = qaPanels.get(id);
    if (existing && existing.signature === signature) {
      placeholder.replaceWith(existing.root);
      existing.handle.refresh();
      continue;
    }
    if (existing) existing.handle.destroy();
    const handle = qaApi.mountPanel({ root: placeholder, context,
      getRecord: () => app.state.doubts?.[id],
      saveRecord: (update) => {
        const latest = app.state.doubts?.[id];
        if (!latest || latest.removed) return latest;
        const next = typeof update === "function" ? update(latest) : update;
        if (!next || next === latest) return latest;
        const value = { ...next, chunk: meta.id, block: blockId, unit: meta.unit };
        store.save(`doubts/${id}`, value, { silent: true, keepUpdatedAt: true, requirePersistence: true });
        return app.state.doubts[id];
      },
      client
    });
    qaPanels.set(id, { root: placeholder, handle, signature });
  }
  for (const [id, panel] of qaPanels) {
    if (!active.has(id)) { panel.handle.destroy(); qaPanels.delete(id); }
  }
}
